zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 612cd71d525444e8a35d3ec35f6272ee
      name: Templates/initMAX
  templates:
    - uuid: 3f4dd89d9afb438eaf67f639ec510e17
      template: 'EHEIM Digital'
      name: 'EHEIM Digital'
      description: |
        More of our templates can be found on https://git.initmax.cz/initMAX-Public/zabbix-templates
        
        Developed by initMAX s.r.o.
        https://www.initmax.com
      vendor:
        name: 'initMAX s.r.o.'
        version: 7.0-1
      groups:
        - name: Templates/initMAX
      items:
        - uuid: e81206d556d244c2956427b37dfb76bf
          name: 'Demo mode status'
          type: DEPENDENT
          key: eheim.demo.mode.status
          delay: '0'
          history: 7d
          description: |
            The demo use indicator indicates whether the device is configured for showroom purposes
            Possible values: [0, 1]
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.demoUse
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: eheim.raw.userdata
          tags:
            - tag: EHEIM
          triggers:
            - uuid: 862b0ae8eb9a44e7810662252652b96f
              expression: 'last(/EHEIM Digital/eheim.demo.mode.status)=1'
              name: 'Demo mode is active!'
              url_name: 'EHEIM Digital'
              url: 'http://{$HOST.API}/'
              priority: INFO
        - uuid: ea5b6d0c85b146dc945e76469144c10f
          name: 'Device discovery raw'
          type: SCRIPT
          key: eheim.device.discovery.raw
          history: 1h
          value_type: TEXT
          trends: '0'
          params: |
            // Parse configuration from input.
            var config = {};
            try {
                config   = (typeof params === 'object') ? params : JSON.parse(value);
            } catch (e)   {
                throw 'Missing or invalid configuration parameters';
            }
            
            // Set   default values if not provided
            var api_host = config.api_host || "http://192.168.1.1"  ;
            var api_username = config.api_username || "api";
            var api_password  =  config.api_password || "admin";
            
            // btoa function to encode a string   to Base64
            function btoa(input) {
                var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=';
                  var str = input;
                var output = '';
                for (var block = 0, charCode,   i = 0, map = chars;
                     str.charAt(i | 0) || (map = '=', i % 1);
                       output += map.charAt(63 & block >> 8 - i % 1 * 8)) {
                    charCode   = str.charCodeAt(i += 3/4);
                    if (charCode > 0xFF) {
                          throw new Error("'btoa' failed: The string contains characters outside   of the Latin1 range.");
                    }
                    block = block << 8 | charCode;
                  }
                return output;
            }
            
            // Ensure api_host starts with "http"
              if (!api_host.startsWith("http")) {
                api_host = "http://" + api_host;
              }
            
            // Create the Basic Auth header using the provided username and password
              var authHeader = "Authorization: Basic " + btoa(api_username + ":" +  api_password);
             
            // Create HttpRequest instance and add the auth header
             var request = new  HttpRequest();
            request.addHeader(authHeader);
            
            // Fetch  the devicelist  from the API
            var devicelistResp = request.get(api_host  + "/api/devicelist" );
            
            // Parse the devicelist JSON; expected fields:  clientList (MAC addresses)  and clientIPList
            var deviceList = JSON.parse(devicelistResp);
             var macs  = deviceList.clientList || [];
            var ips = deviceList.clientIPList  || [];
             
            // Prepare the result array for LLD (Low-Level Discovery)
            var  result =  [];
            
            // For each device (by MAC address), call the userdata  API to get  'tankconfig' and 'name'
            for (var i = 0; i < macs.length; i++)  {
                var  mac = macs[i];
                var ip = (i < ips.length) ? ips[i] : "" ;
                var  tankconfig = "UNKNOWN";
                var devicename = "UNKNOWN";
                 
                 // Construct userdata URL with parameter 'to' set to the MAC address
                  var userdataUrl = api_host + "/api/userdata?to=" + encodeURIComponent(mac);
                  var userdataResp = "";
                
                try {
                    userdataResp = request.get(userdataUrl);
                  } catch (err) {
                    userdataResp = null;
                }
                
                if (userdataResp   !== null && userdataResp !== "") {
                    try {
                        var userdata   = JSON.parse(userdataResp);
                        tankconfig = userdata.tankconfig   || "UNKNOWN";
                        devicename = userdata.name || "UNKNOWN" ;
                     } catch (e) {
                        tankconfig = "ERROR";
                         devicename  = "ERROR";
                    }
                } else {
                    tankconfig  = "TIMEOUT" ;
                    devicename = "TIMEOUT";
                }
                
                //  Add the discovered  device to the result array with LLD macros
                result.push({
                     "{#DEVICE.MAC}": mac,
                    "{#DEVICE.IP}": ip,
                     "{#DEVICE.TYPE}" : tankconfig,
                    "{#DEVICE.NAME}": devicename
                 });
            }
            
            // Return  the final LLD JSON as a string
            return JSON.stringify(result);
          description: 'Item for discovering EHEIM devices and types.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  
                  var filteredData = data.filter(function(item) {
                      for (var key in item) {
                          if (item[key] === "TIMEOUT") {
                              return false; // exclude item
                          }
                      }
                      return true; // keep item
                  });
                  
                  return JSON.stringify(filteredData);
          timeout: 60s
          parameters:
            - name: api_host
              value: '{$API.HOST}'
            - name: api_password
              value: '{$API.PASS}'
            - name: api_username
              value: '{$API.USER}'
          tags:
            - tag: raw
          triggers:
            - uuid: 6e138fee7dcb4b6ab9502c1c777d1e7e
              expression: 'nodata(/EHEIM Digital/eheim.device.discovery.raw,{$API.NO.DATA.MSTR})=1'
              name: 'API not returning data (Device discovery raw)'
              priority: AVERAGE
              description: 'Raises when the master item "Device discovery raw" stops returning data.'
        - uuid: ee53615098a149c4aee70ed2d92a4065
          name: 'Firmware update'
          type: DEPENDENT
          key: eheim.firmware.available
          delay: '0'
          history: 7d
          description: |
            The firmware update availability flag indicates whether a newer version of the device's firmware is accessible for installation.
            Possible values: [0, 1]
          valuemap:
            name: 'Firmware update'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.firmwareAvailable
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: eheim.raw.userdata
          tags:
            - tag: EHEIM
          triggers:
            - uuid: d79d6eda9ee84de3a92eaf755e62083b
              expression: 'last(/EHEIM Digital/eheim.firmware.available)=1'
              name: 'Firmware update available'
              url_name: 'EHEIM Digital'
              url: 'http://{$HOST.API}/'
              priority: INFO
        - uuid: 3dd76482e6db4d62a8a35b87df37c74d
          name: 'User data'
          type: HTTP_AGENT
          key: eheim.raw.userdata
          delay: 1h
          history: 7d
          value_type: TEXT
          trends: '0'
          authtype: BASIC
          username: '{$API.USER}'
          password: '{$API.PASS}'
          description: |
            This endpoint provides detailed information about the device, including:
            
            Device Name
            Software version
            Whether an update is available
            Timezone
          timeout: 10s
          url: 'http://{$API.HOST}/api/userdata'
          tags:
