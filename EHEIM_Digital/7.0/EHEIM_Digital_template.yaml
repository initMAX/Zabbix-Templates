              url_name: 'EHEIM Downloads web page'
              url: 'https://eheim.com/en_GB/support/downloads/'
              priority: INFO
              manual_close: 'YES'
      discovery_rules:
        - uuid: 261cf175b8704d8ba7222b53ea3e188c
