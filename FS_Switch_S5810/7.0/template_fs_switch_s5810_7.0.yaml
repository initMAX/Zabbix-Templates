              tags:
                - tag: component
                  value: fan
            - uuid: a9d5ba5b634e491bace1ff998f5c177c
              name: 'Fan {#FAN_INDEX}: Status'
              type: DEPENDENT
              key: 'sensor.fan.status[{#SNMPINDEX}]'
              delay: '0'
              description: 'FS-MIB::switchFanStatus (1=ok, 2=failure)'
              valuemap:
                name: 'FS::Fan status'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.52642.1.1.10.2.1.1.43.1.4.{#SNMPINDEX}'
                    - '0'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 3m
              master_item:
                key: sensor.fans.walk
              tags:
                - tag: component
                  value: fan
              trigger_prototypes:
                - uuid: 949c2ad73a884e979eebdbf19e498993
                  expression: 'last(/FS Switch S5810 SNMP/sensor.fan.status[{#SNMPINDEX}])<>4'
                  name: 'Fan {#FAN_INDEX}: Fan failure'
                  opdata: 'Current state: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  tags:
                    - tag: component
                      value: fan
                    - tag: scope
                      value: availability
          graph_prototypes:
            - uuid: d1ec32c8cf90413c9da5bf5c9d58716f
              name: 'Fan {#FAN_INDEX}: Speed'
              ymin_type_1: FIXED
