            - uuid: 593fc507106b45cdae055fcd6d8fdb8f
              name: 'DNS server {#DNS.SERVER}: SRV _kerberos normalized targets'
              description: |
                Normalized list of SRV targets from the specific resolver.
                Expected value: space-separated list of "target:port" pairs.
              type: DEPENDENT
              key: 'ipa.dns.srv.kerberos.normalized[{#DNS.SERVER}]'
              delay: '0'
              history: 7d
              value_type: TEXT
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var out = [];
                      var lines = value.split('\\n');
                      for (var i = 0; i < lines.length; i++) {
                        var line = lines[i].trim();
                        if (!line) continue;
                        var parts = line.split(/\\s+/);
                        var idx = parts.indexOf('SRV');
                        if (idx === -1 || parts.length < idx + 5) continue;
                        var port = parts[idx + 3];
                        var target = parts[idx + 4];
                        if (!target) continue;
                        target = target.replace(/\\.$/, '');
                        out.push(target + ':' + port);
                      }
                      out.sort();
                      return out.join(' ');
              master_item:
                key: 'net.dns.record[{#DNS.SERVER},_kerberos._tcp.{$IPA.DNS.SRV.DOMAIN},SRV]'
              tags:
                - tag: FreeIPA
                  value: Client
                - tag: FreeIPA
                  value: DNS
