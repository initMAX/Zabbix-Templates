              name: 'JVM heap usage is critical'
              event_name: 'JVM heap usage is above {$LOGSTASH.HEAP.CRIT}%'
              opdata: 'Heap: {ITEM.LASTVALUE}'
              priority: HIGH
        - uuid: f3de43ad4e3a440481653117764292c9
