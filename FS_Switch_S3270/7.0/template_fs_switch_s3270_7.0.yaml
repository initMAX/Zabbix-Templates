                  value: capacity
                - tag: scope
                  value: performance
        - uuid: 594b6c32b1f840819df420bd66e09d2a
          name: 'SNMP agent availability'
          type: INTERNAL
          key: 'zabbix[host,snmp,available]'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: bef0ccf4d87b46309a1c004f271cb4dc
              expression: 'max(/FS Switch S3270 SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              name: 'FS Switch: No SNMP data collection'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: WARNING
              dependencies:
                - name: 'FS Switch: Unavailable by ICMP ping'
                  expression: 'max(/FS Switch S3270 SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
      discovery_rules:
        - uuid: ca5f248e09494845ba2727f0878c8bd8
          name: 'Network interfaces discovery'
          type: DEPENDENT
          key: net.if.discovery
          delay: '0'
          filter:
            conditions:
              - macro: '{#IFDESCR}'
                value: '{$NET.IF.IFDESCR.MATCHES}'
                formulaid: A
              - macro: '{#IFDESCR}'
                value: '{$NET.IF.IFDESCR.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
              - macro: '{#IFNAME}'
                value: '{$NET.IF.IFNAME.MATCHES}'
                formulaid: C
              - macro: '{#IFNAME}'
                value: '{$NET.IF.IFNAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: D
          description: 'Discovering interfaces from IF-MIB.'
          item_prototypes:
            - uuid: f608706217844c15a269a5d1c4de0704
              name: 'Interface {#IFNAME}({#IFALIAS}): Inbound packets discarded'
              type: DEPENDENT
              key: 'net.if.in.discards[ifInDiscards.{#SNMPINDEX}]'
              delay: '0'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}'
                    - '0'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 3m
              master_item:
                key: net.if.walk
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 3cea53d7c0014d89bee6eafcc15c88dd
              name: 'Interface {#IFNAME}({#IFALIAS}): Inbound packets with errors'
              type: DEPENDENT
              key: 'net.if.in.errors[ifInErrors.{#SNMPINDEX}]'
              delay: '0'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}'
                    - '0'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 3m
              master_item:
                key: net.if.walk
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
              trigger_prototypes:
                - uuid: d54151abb9f74b91a92463bf2864dc70
                  expression: 'min(/FS Switch S3270 SNMP/net.if.in.errors[ifInErrors.{#SNMPINDEX}],5m)>{$IF.ERRORS.WARN}'
                  name: 'Interface {#IFNAME}({#IFALIAS}): High inbound error rate'
                  event_name: 'Interface {#IFNAME}({#IFALIAS}): High inbound error rate (>{$IF.ERRORS.WARN} for 5m)'
                  priority: WARNING
                  manual_close: 'YES'
                  dependencies:
                    - name: 'Interface {#IFNAME}({#IFALIAS}): Link down'
                      expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/FS Switch S3270 SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2 and (last(/FS Switch S3270 SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/FS Switch S3270 SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#2))'
                      recovery_expression: 'last(/FS Switch S3270 SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0'
                  tags:
