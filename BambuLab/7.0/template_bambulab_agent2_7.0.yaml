        - uuid: 9b58fe38441d4ab985cf68d6af87c7ad
          name: 'BambuLab: Network conf'
          type: DEPENDENT
          key: bambulab.net.conf
          delay: '0'
          description: |
            Numeric network configuration code from $.print.net.conf.
            
            Observed values:
            - 16 = WiFi (observed in sample payloads)
            - 0  = other modes (possibly LAN/default), not confirmed across models.
            
            If you see other values, share them and we can extend the mapping/meaning.
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.print.net.conf
              error_handler: DISCARD_VALUE
            - type: JAVASCRIPT
              parameters:
                - |
                  var n = parseInt(value, 10);
                  return isNaN(n) ? null : n;
          master_item:
            key: 'bambulab.get["{$BAMBU_URL}","device/{$BAMBU_SN}/report","{$BAMBU_USER}","{$BAMBU_PASS}"]'
          tags:
            - tag: component
              value: network
        - uuid: 4a3a3d28e99246b8becacb9b478fdfbc
          name: 'BambuLab: Network connection'
          type: DEPENDENT
          key: bambulab.net.connection
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: |
            Heuristic LAN/WiFi connection label.
            
            Primarily uses $.print.net.conf:
            - 16 = WiFi (observed in sample payloads)
            - 0  = unclear; falls back to wired_flag
            
            If you see values other than 0/16, share them and we can extend the mapping.
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  function toU32(n) {
                    if (n === null || n === undefined) return null;
                    var v = parseInt(n, 10);
                    if (isNaN(v)) return null;
                    if (v < 0) v = 4294967296 + v;
                    return v;
                  }
                  
                  try {
                    var s = (value === null || value === undefined) ? '' : String(value);
                    s = s.replace(/\u0000/g, '').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
                    var start = s.indexOf('{');
                    var end = s.lastIndexOf('}');
                    if (start === -1 || end === -1 || end <= start) return 'unknown';
                    var j = JSON.parse(s.substring(start, end + 1));
                    var p = (j && j.print) ? j.print : {};
                  
                    var conf = null;
                    if (p.net && p.net.conf !== undefined && p.net.conf !== null) conf = parseInt(p.net.conf, 10);
                  
                    var hf = toU32(p.home_flag);
                    var wiredFlag = (hf !== null && (hf & 0x00040000) !== 0) ? 1 : 0;
                  
                    if (conf === 16) return 'WiFi';
                    if (conf === 0) return wiredFlag ? 'LAN' : 'WiFi';
                    if (conf !== null && !isNaN(conf)) return 'unknown(conf=' + conf + ',flag=' + wiredFlag + ')';
                  
                    return wiredFlag ? 'LAN' : 'WiFi';
                  } catch (e) {
                    return 'unknown';
                  }
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 10m
          master_item:
            key: 'bambulab.get["{$BAMBU_URL}","device/{$BAMBU_SN}/report","{$BAMBU_USER}","{$BAMBU_PASS}"]'
          tags:
            - tag: component
              value: network
        - uuid: 3f9aa4c28b8b4c268003615fc93f288a
          name: 'BambuLab: Network IP'
          type: DEPENDENT
          key: bambulab.net.ip
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: |
            Printer IP address from $.print.net.info[0].ip.
            
            Bambu reports this as a 32-bit integer; the template converts it to IPv4 (tries little-endian and big-endian
            and prefers private ranges 10/8, 172.16/12, 192.168/16).
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.print.net.info[0].ip'
              error_handler: DISCARD_VALUE
            - type: JAVASCRIPT
              parameters:
                - |
                  function toBytesBE(n) { return [(n >>> 24) & 255, (n >>> 16) & 255, (n >>> 8) & 255, n & 255]; }
                  function toBytesLE(n) { return [n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255]; }
                  function isPrivate(b) {
                    if (b[0] === 10) return true;
                    if (b[0] === 192 && b[1] === 168) return true;
                    if (b[0] === 172 && b[1] >= 16 && b[1] <= 31) return true;
                    return false;
                  }
                  var n = parseInt(value, 10);
                  if (isNaN(n)) return '';
                  if (n < 0) n = 4294967296 + n;
                  var be = toBytesBE(n);
                  var le = toBytesLE(n);
                  var b = isPrivate(le) ? le : (isPrivate(be) ? be : le);
                  return b[0] + '.' + b[1] + '.' + b[2] + '.' + b[3];
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: 'bambulab.get["{$BAMBU_URL}","device/{$BAMBU_SN}/report","{$BAMBU_USER}","{$BAMBU_PASS}"]'
          tags:
            - tag: component
              value: network
        - uuid: 6718eaf918ce4cfa83d2090d1c6a69d3
          name: 'BambuLab: Network mask'
          type: DEPENDENT
          key: bambulab.net.mask
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: |
            Network mask from $.print.net.info[0].mask (same format as IP: 32-bit integer).
            
            The template converts it to IPv4 notation (e.g. 255.255.255.0) and tries to pick a valid mask.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.print.net.info[0].mask'
              error_handler: DISCARD_VALUE
            - type: JAVASCRIPT
              parameters:
                - |
                  function toBytesBE(n) { return [(n >>> 24) & 255, (n >>> 16) & 255, (n >>> 8) & 255, n & 255]; }
                  function toBytesLE(n) { return [n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255]; }
                  var n = parseInt(value, 10);
                  if (isNaN(n)) return '';
                  if (n < 0) n = 4294967296 + n;
                  var le = toBytesLE(n);
                  var be = toBytesBE(n);
                  var isValidMask = function(b) {
                    var bits = (b[0] << 24) | (b[1] << 16) | (b[2] << 8) | b[3];
                    bits = bits >>> 0;
                    var inv = (~bits) >>> 0;
                    return ((inv + 1) & inv) === 0;
                  };
                  var b = isValidMask(le) ? le : (isValidMask(be) ? be : le);
                  return b[0] + '.' + b[1] + '.' + b[2] + '.' + b[3];
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: 'bambulab.get["{$BAMBU_URL}","device/{$BAMBU_SN}/report","{$BAMBU_USER}","{$BAMBU_PASS}"]'
          tags:
            - tag: component
              value: network
        - uuid: c4595fb32c15467da529e086a039cd9e
          name: 'BambuLab: Wired network flag'
          type: DEPENDENT
          key: bambulab.net.wired_flag
          delay: '0'
          description: |
            Derived flag from home_flag (bit 0x00040000).
            
            Warning: this bit can be set even when the printer is on WiFi, so do not treat it as authoritative.
            Use 'Network connection' for the human-readable LAN/WiFi value.
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var n = parseInt(value, 10);
                  if (isNaN(n)) return null;
                  if (n < 0) n = 4294967296 + n;
                  return ((n & 0x00040000) !== 0) ? 1 : 0;
          master_item:
