        - uuid: 2ec00f1a49594f798c8096a0971ecab6
          name: 'CPU utilization (1 min)'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.4413.1.1.1.1.4.12.0]'
          key: system.cpu.util.1min
          value_type: FLOAT
          units: '%'
          description: 'Enterprise 4413 - CPU utilization 60 second average'
          tags:
            - tag: component
