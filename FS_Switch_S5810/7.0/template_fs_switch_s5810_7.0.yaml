zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 612cd71d525444e8a35d3ec35f6272ee
      name: Templates/initMAX
  templates:
    - uuid: c63f121c052043c4bc3f65c6958d5f23
      template: 'FS Switch S5810 SNMP'
      name: 'FS Switch S5810 SNMP'
      description: |
        More of our templates can be found on https://git.initmax.cz/initMAX-Public/zabbix-templates
        
        Developed by initMAX s.r.o.
        https://www.initmax.com
      vendor:
        name: 'initMAX s.r.o.'
        version: 7.0-0
      groups:
        - name: Templates/initMAX
      items:
        - uuid: 43e184b2860d46269f87323805ce3fee
          name: 'ICMP ping'
          type: SIMPLE
          key: icmpping
          valuemap:
            name: 'Service state'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: 457d59ce90d74ded816f7fcd293eff5c
              expression: 'max(/FS Switch S5810 SNMP/icmpping,#3)=0'
              name: 'FS Switch: Unavailable by ICMP ping'
              priority: HIGH
              tags:
                - tag: scope
                  value: availability
        - uuid: 70729e1069024ebb981b614c9a08e74e
          name: 'ICMP loss'
          type: SIMPLE
          key: icmppingloss
          value_type: FLOAT
          units: '%'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: d500f4a9f8974aa3aee9774130a40647
              expression: 'min(/FS Switch S5810 SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/FS Switch S5810 SNMP/icmppingloss,5m)<100'
              name: 'FS Switch: High ICMP ping loss'
              opdata: 'Loss: {ITEM.LASTVALUE1}'
              priority: WARNING
              dependencies:
                - name: 'FS Switch: Unavailable by ICMP ping'
                  expression: 'max(/FS Switch S5810 SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: 5c9c7fc14a1b4ca5ad2873a135d256ed
          name: 'ICMP response time'
          type: SIMPLE
          key: icmppingsec
          value_type: FLOAT
          units: s
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: 24ecb29275a0412b96e20f40a897e6d2
              expression: 'avg(/FS Switch S5810 SNMP/icmppingsec,5m)>{$ICMP_RESPONSE_TIME_WARN}'
              name: 'FS Switch: High ICMP ping response time'
              opdata: 'Value: {ITEM.LASTVALUE1}'
              priority: WARNING
              dependencies:
                - name: 'FS Switch: High ICMP ping loss'
                  expression: 'min(/FS Switch S5810 SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/FS Switch S5810 SNMP/icmppingloss,5m)<100'
                - name: 'FS Switch: Unavailable by ICMP ping'
                  expression: 'max(/FS Switch S5810 SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: 8e1e09e1cd3e41c48df74f234aeced27
