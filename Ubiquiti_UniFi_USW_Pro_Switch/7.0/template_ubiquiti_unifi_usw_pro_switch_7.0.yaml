          key: system.hw.serialnumber
          delay: 1h
          value_type: CHAR
          trends: '0'
          description: 'ENTITY-MIB::entPhysicalSerialNum.1'
          inventory_link: SERIALNO_A
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: c2a8ca1f61174a8f8d6c4e3f3b661644
              expression: 'last(/Ubiquiti Unifi USW Pro Switch SNMP/system.hw.serialnumber,#1)<>last(/Ubiquiti Unifi USW Pro Switch SNMP/system.hw.serialnumber,#2)'
