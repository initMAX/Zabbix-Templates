              expression: 'count(/FreeIPA Client/logrt[/var/log/sssd/^sssd_.*\.log$,{$IPA.SSSD.LOG.ERROR},,,skip],{$IPA.SSSD.LOG.WINDOW})>0 and nodata(/FreeIPA Client/logrt[/var/log/sssd/^sssd_.*\.log$,{$IPA.SSSD.LOG.ERROR},,,skip],{$IPA.SSSD.LOG.WINDOW})=0'
              name: 'SSSD errors detected in logs'
              priority: WARNING
              manual_close: 'YES'
        - uuid: 3d03b986e51f4deca593e8f14e01323b
          name: 'IPA CA certificate: notAfter raw'
          description: |
            Reads notAfter from /etc/ipa/ca.crt using openssl via userparameter.
            Expected value: string "notAfter=..." or empty on failure.
          key: ipa.ca.notafter
          delay: 1h
          history: '0'
          trends: '0'
          value_type: TEXT
          tags:
            - tag: FreeIPA
              value: Client
            - tag: FreeIPA
              value: 'CA Cert'
            - tag: FreeIPA
              value: RAW
        - uuid: 170bacd517a34b0e85a708ed9c9cae26
          name: 'IPA CA certificate: expiration time'
          description: |
            Parses notAfter into Unix time (seconds since epoch).
            Expected value: unix timestamp; 0 means parse failed or source empty.
          type: DEPENDENT
          key: ipa.ca.cert.expire
          delay: '0'
          history: 90d
          units: unixtime
          preprocessing:
            - type: REGEX
              parameters:
                - 'notAfter=(.+)'
                - '\1'
            - type: JAVASCRIPT
              parameters:
                - |
                  var v = value.trim();
                  var m = v.match(/^([A-Za-z]{3})\s+(\d{1,2})\s+(\d{2}):(\d{2}):(\d{2})\s+(\d{4})(?:\s+(GMT|UTC))?$/);
                  if (m) {
                    var months = {
                      Jan: 0, Feb: 1, Mar: 2, Apr: 3, May: 4, Jun: 5,
                      Jul: 6, Aug: 7, Sep: 8, Oct: 9, Nov: 10, Dec: 11
                    };
                    var mi = months[m[1]];
                    if (mi === undefined) return 0;
                    var dd = parseInt(m[2], 10);
                    var hh = parseInt(m[3], 10);
                    var mm = parseInt(m[4], 10);
                    var ss = parseInt(m[5], 10);
                    var yyyy = parseInt(m[6], 10);
                    var t = Date.UTC(yyyy, mi, dd, hh, mm, ss);
                    return Math.floor(t / 1000);
                  }
                  var t = Date.parse(v.replace('GMT', 'UTC'));
                  if (isNaN(t)) return 0;
                  return Math.floor(t / 1000);
          master_item:
            key: ipa.ca.notafter
          tags:
            - tag: FreeIPA
              value: Client
            - tag: FreeIPA
              value: 'CA Cert'
          triggers:
            - uuid: d342c17637a547aeb14e79cb25d1252c
              expression: '(last(/FreeIPA Client/ipa.ca.cert.expire) - now()) < {$IPA.CERT.EXPIRE.WARN}'
              name: 'IPA CA certificate expires soon'
              priority: WARNING
              manual_close: 'YES'
      discovery_rules:
        - uuid: 12cd423fe8d24fdb80c6c61d1d4ac504
          name: 'IPA packages discovery'
          type: DEPENDENT
          key: ipa.packages.discovery
          delay: '0'
          lifetime: 30d
          item_prototypes:
            - uuid: 7149e2d480684a4bb54b126d3f3bf422
              name: 'Package {#PKG.NAME}: version'
              description: |
                Extracts version for {#PKG.NAME} from system.sw.packages.get.
                Expected value: version string; empty means package not present in the JSON.
              type: DEPENDENT
              key: 'ipa.package.version[{#PKG.NAME}]'
