                - type: NOT_MATCHES_REGEX
                  parameters:
                    - ^$
                  error_handler: CUSTOM_VALUE
                  error_handler_params: 'Not synchronised!'
              master_item:
                key: 'eheim.professionel5e.raw[{#DEVICE.MAC}]'
              tags:
                - tag: EHEIM
                  value: professionel5e
