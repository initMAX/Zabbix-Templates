# FreeIPA client monitoring - exec-based checks only.
# Native checks (packages, services, DNS, logs) are handled directly by the template.

# Kerberos keytab test (1=ok, 0=fail). If no principal is provided, use host/$(hostname -f).
UserParameter=ipa.kerberos.kinit[*],principal="$${1:-host/$(hostname -f)}"; realm="$1"; principal_realm="${principal}"; [ -n "$realm" ] && principal_realm="${principal}@${realm}"; /usr/bin/sudo -n /usr/bin/kinit -k -t /etc/krb5.keytab "$principal_realm" >/dev/null 2>&1 && /usr/bin/sudo -n /usr/bin/kdestroy >/dev/null 2>&1 && echo 1 || echo 0

# Time sync flags from timedatectl (NTP, NTPSynchronized, Timezone).
UserParameter=ipa.time.timedatectl,/usr/bin/timedatectl show -p NTPSynchronized -p NTP -p Timezone 2>/dev/null

# IPA CA certificate expiration (raw notAfter string).
UserParameter=ipa.ca.notafter,/usr/bin/openssl x509 -enddate -noout -in /etc/ipa/ca.crt 2>/dev/null
