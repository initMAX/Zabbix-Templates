      discovery_rules:
        - uuid: d54c369a8d7d41b58370fd4e5e480bcd
          name: 'Fan discovery'
          type: DEPENDENT
          key: fan.discovery
          delay: '0'
          description: 'Discovery of FS-MIB::switchFanTable.'
          item_prototypes:
            - uuid: 8a6b6b5f58da487883960454ace5f72e
              name: 'Fan {#FAN_INDEX}: Speed'
              type: DEPENDENT
              key: 'sensor.fan.speed[{#SNMPINDEX}]'
              delay: '0'
              units: rpm
              description: 'FS-MIB::switchFanOperSpeed in RPM'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.52642.1.1.10.2.1.1.43.1.6.{#SNMPINDEX}'
                    - '0'
                - type: DISCARD_UNCHANGED_HEARTBEAT
