zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 612cd71d525444e8a35d3ec35f6272ee
      name: Templates/initMAX
  templates:
    - uuid: a5fb658a285841b68164f5ba76afb72c
      template: 'Ubiquiti Unifi UAP Access Point SNMP'
      name: 'Ubiquiti Unifi UAP Access Point SNMP'
      description: |
        Zabbix template for Ubiquiti Unifi Access Points:
        - U6-Pro, U6-Lite, U6-LR, U6-Mesh, U6-Enterprise
        - UAP-AC-Pro, UAP-AC-Lite, UAP-AC-LR
        - UAP-nanoHD, UAP-FlexHD
        
        Monitors via SNMP v2c using UBNT-UniFi-MIB, FROGFOOT-RESOURCES-MIB and standard MIBs.
        
        More of our templates can be found on https://git.initmax.cz/initMAX-Public/zabbix-templates
        
        Developed by initMAX s.r.o.
        https://www.initmax.com
      vendor:
        name: 'initMAX s.r.o.'
        version: 7.0-0
      groups:
        - name: Templates/initMAX
      items:
        - uuid: b6849a9c33af4b3fa35b98e67887a6a6
          name: 'ICMP ping'
          type: SIMPLE
          key: icmpping
          valuemap:
            name: 'Service state'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: eff4f8fdc9b4400d9242574c1a3f0c33
              expression: 'max(/Ubiquiti Unifi UAP Access Point SNMP/icmpping,#3)=0'
              name: 'Unifi AP: Unavailable by ICMP ping'
              priority: HIGH
              tags:
                - tag: scope
                  value: availability
        - uuid: c89b22ae55c74c5690bad2fb3344b1d2
          name: 'ICMP loss'
          type: SIMPLE
          key: icmppingloss
          value_type: FLOAT
          units: '%'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: 3c60c799c9bb4c85a6087a6434c9f357
              expression: 'min(/Ubiquiti Unifi UAP Access Point SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Ubiquiti Unifi UAP Access Point SNMP/icmppingloss,5m)<100'
              name: 'Unifi AP: High ICMP ping loss'
              event_name: 'Unifi AP: High ICMP ping loss (>{$ICMP_LOSS_WARN}%)'
              opdata: 'Loss: {ITEM.LASTVALUE1}'
              priority: WARNING
              dependencies:
                - name: 'Unifi AP: Unavailable by ICMP ping'
                  expression: 'max(/Ubiquiti Unifi UAP Access Point SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: cd9456e2582a4fcfb9be42630c20cde9
          name: 'ICMP response time'
          type: SIMPLE
          key: icmppingsec
          value_type: FLOAT
          units: s
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: a861df35099d4e57b0cca65b3a7f0da1
              expression: 'avg(/Ubiquiti Unifi UAP Access Point SNMP/icmppingsec,5m)>{$ICMP_RESPONSE_TIME_WARN}'
              name: 'Unifi AP: High ICMP ping response time'
              event_name: 'Unifi AP: High ICMP ping response time (>{$ICMP_RESPONSE_TIME_WARN}s)'
              opdata: 'Value: {ITEM.LASTVALUE1}'
              priority: WARNING
              dependencies:
                - name: 'Unifi AP: High ICMP ping loss'
                  expression: 'min(/Ubiquiti Unifi UAP Access Point SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Ubiquiti Unifi UAP Access Point SNMP/icmppingloss,5m)<100'
                - name: 'Unifi AP: Unavailable by ICMP ping'
                  expression: 'max(/Ubiquiti Unifi UAP Access Point SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: ac9f3be8761446cb8ced79c04f5b4bfd
          name: 'Unifi AP: SNMP walk network interfaces'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.2.1.2.2.1.8,1.3.6.1.2.1.2.2.1.7,1.3.6.1.2.1.31.1.1.1.18,1.3.6.1.2.1.31.1.1.1.1,1.3.6.1.2.1.2.2.1.2,1.3.6.1.2.1.2.2.1.3,1.3.6.1.2.1.31.1.1.1.6,1.3.6.1.2.1.31.1.1.1.10,1.3.6.1.2.1.2.2.1.14,1.3.6.1.2.1.2.2.1.20,1.3.6.1.2.1.2.2.1.19,1.3.6.1.2.1.2.2.1.13,1.3.6.1.2.1.31.1.1.1.15]'
          key: net.if.walk
