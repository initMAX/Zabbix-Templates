zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 612cd71d525444e8a35d3ec35f6272ee
      name: Templates/initMAX
  templates:
    - uuid: e6b6018c6e0d42ac9f1835cd383f88dc
      template: 'Template DB Firebird'
      name: 'Template DB Firebird'
      description: |
        More of our templates can be found on
        https://git.initmax.cz/initMAX-Public/zabbix-templates
        
        Developed by initMAX s.r.o.
        https://www.initmax.com
      vendor:
        name: 'initMAX s.r.o.'
        version: 7.0-0
      groups:
        - name: Templates/initMAX
      discovery_rules:
        - uuid: 262ae947594e414583d7524fb6aa4f3f
          name: 'FirebirdDB Discovery'
          key: 'firebird.discovery[{$FIREBIRD.LLD.PATH}]'
          delay: 1h
          filter:
            conditions:
              - macro: '{#FIREBIRD.DB.NAME}'
                value: '{$FIREBIRD.DB.MATCHES}'
                formulaid: A
              - macro: '{#FIREBIRD.DB.NAME}'
                value: '{$FIREBIRD.DB.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
          item_prototypes:
            - uuid: 3d0a96fbcd734cc8aabd853ed48c9f84
              name: 'Connections active on {#FIREBIRD.DB.NAME}'
              key: 'fbdb[{$FIREBIRD.CONNSTRING},{#FIREBIRD.DB.PATH},{$FIREBIRD.USER},{$FIREBIRD.PASSWORD},attach_active]'
              history: 7d
              tags:
                - tag: Firebird
                  value: connections
            - uuid: 552fb92e6639458990e701d5d15c511a
              name: 'Connections idle on {#FIREBIRD.DB.NAME}'
              key: 'fbdb[{$FIREBIRD.CONNSTRING},{#FIREBIRD.DB.PATH},{$FIREBIRD.USER},{$FIREBIRD.PASSWORD},attach_idle]'
              history: 7d
              tags:
                - tag: Firebird
                  value: connections
            - uuid: c3e6e0fe318544b6ad0e6c22a9202d02
              name: 'Cache hit ratio on {#FIREBIRD.DB.NAME}'
              key: 'fbdb[{$FIREBIRD.CONNSTRING},{#FIREBIRD.DB.PATH},{$FIREBIRD.USER},{$FIREBIRD.PASSWORD},cache_hit_ratio]'
              history: 7d
              tags:
                - tag: Firebird
                  value: performance
              trigger_prototypes:
                - uuid: 00d4500fac024ff38711d475feed0649
                  expression: 'last(/Template DB Firebird/fbdb[{$FIREBIRD.CONNSTRING},{#FIREBIRD.DB.PATH},{$FIREBIRD.USER},{$FIREBIRD.PASSWORD},cache_hit_ratio])<{$FB_CACHE_HIT_MIN}'
                  name: 'Cache hit ratio below 90% on {#FIREBIRD.DB.NAME}'
                  priority: WARNING
            - uuid: fb48c88b2cb140cfa2ffbf03a6a0f984
              name: 'Encryption state on {#FIREBIRD.DB.NAME}'
              key: 'fbdb[{$FIREBIRD.CONNSTRING},{#FIREBIRD.DB.PATH},{$FIREBIRD.USER},{$FIREBIRD.PASSWORD},crypt_state]'
              history: 7d
              tags:
                - tag: Firebird
                  value: security
              trigger_prototypes:
                - uuid: b38343a32306401db4b0d95f59654cca
                  expression: 'last(/Template DB Firebird/fbdb[{$FIREBIRD.CONNSTRING},{#FIREBIRD.DB.PATH},{$FIREBIRD.USER},{$FIREBIRD.PASSWORD},crypt_state])>{$FB_CRYPT_STATE_ALERT}'
                  name: 'Database encryption/decryption in progress on {#FIREBIRD.DB.NAME}'
                  priority: INFO
            - uuid: 2528dcca459442e38d9304527920345e
              name: 'Database backup state on {#FIREBIRD.DB.NAME}'
              key: 'fbdb[{$FIREBIRD.CONNSTRING},{#FIREBIRD.DB.PATH},{$FIREBIRD.USER},{$FIREBIRD.PASSWORD},database_backup]'
              history: 7d
              tags:
                - tag: Firebird
                  value: database
              trigger_prototypes:
                - uuid: ad702838dd24425ab0a0c64add3f6bed
                  expression: 'last(/Template DB Firebird/fbdb[{$FIREBIRD.CONNSTRING},{#FIREBIRD.DB.PATH},{$FIREBIRD.USER},{$FIREBIRD.PASSWORD},database_backup])<>0'
                  name: 'Firebird database {#FIREBIRD.DB.NAME} backup failed'
                  priority: HIGH
            - uuid: 1e736812c409480bae526f2678665882
              name: 'Database read-only on {#FIREBIRD.DB.NAME}'
              key: 'fbdb[{$FIREBIRD.CONNSTRING},{#FIREBIRD.DB.PATH},{$FIREBIRD.USER},{$FIREBIRD.PASSWORD},database_readonly]'
              history: 7d
              tags:
                - tag: Firebird
                  value: database
              trigger_prototypes:
                - uuid: 0b1bfa12be044c8e9f2494df6e2153ab
                  expression: 'last(/Template DB Firebird/fbdb[{$FIREBIRD.CONNSTRING},{#FIREBIRD.DB.PATH},{$FIREBIRD.USER},{$FIREBIRD.PASSWORD},database_readonly])<>0'
                  name: 'Firebird database {#FIREBIRD.DB.NAME} is read-only!'
                  priority: DISASTER
            - uuid: 7752b37df3d44411882f58254fbfb10a
              name: 'Database status on {#FIREBIRD.DB.NAME}'
              key: 'fbdb[{$FIREBIRD.CONNSTRING},{#FIREBIRD.DB.PATH},{$FIREBIRD.USER},{$FIREBIRD.PASSWORD},database_status]'
              history: 7d
              tags:
                - tag: Firebird
                  value: database
              trigger_prototypes:
                - uuid: 778f3fd793b545be84e0d3dffe852701
                  expression: 'last(/Template DB Firebird/fbdb[{$FIREBIRD.CONNSTRING},{#FIREBIRD.DB.PATH},{$FIREBIRD.USER},{$FIREBIRD.PASSWORD},database_status])<>0'
                  name: 'Firebird database {#FIREBIRD.DB.NAME} is down!'
                  priority: DISASTER
            - uuid: 6838219eb9c44e4c83788b6b558e26f4
              name: 'Database size bytes on {#FIREBIRD.DB.NAME}'
              key: 'fbdb[{$FIREBIRD.CONNSTRING},{#FIREBIRD.DB.PATH},{$FIREBIRD.USER},{$FIREBIRD.PASSWORD},db_size_bytes]'
              history: 7d
              tags:
                - tag: Firebird
                  value: size
            - uuid: 7278800fe36e452a89e334e8f8cb6e46
              name: 'Forced writes flag on {#FIREBIRD.DB.NAME}'
              key: 'fbdb[{$FIREBIRD.CONNSTRING},{#FIREBIRD.DB.PATH},{$FIREBIRD.USER},{$FIREBIRD.PASSWORD},forced_writes]'
              history: 7d
              tags:
