          triggers:
            - uuid: 45463381324b4b4489e61bc29f2d126e
              expression: 'last(/FS Switch S3400 SNMP/system.name,#1)<>last(/FS Switch S3400 SNMP/system.name,#2) and length(last(/FS Switch S3400 SNMP/system.name))>0'
              name: 'FS Switch: System name has changed'
              event_name: 'FS Switch: System name has changed (new name: {ITEM.VALUE})'
              priority: INFO
              manual_close: 'YES'
              tags:
                - tag: scope
