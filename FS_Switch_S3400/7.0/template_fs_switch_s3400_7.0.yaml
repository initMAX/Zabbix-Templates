        - uuid: d773327aef8746ad8774687e5e4424b3
          name: 'Hardware model name'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.52642.3.6.10.1.3.0]'
          key: system.hw.model
