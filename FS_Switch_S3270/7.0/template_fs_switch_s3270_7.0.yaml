          snmp_oid: 'get[1.3.6.1.4.1.52642.1.1.10.2.1.1.22.0]'
          key: system.status
          description: 'FS enterprise MIB - switchOperState'
          valuemap:
            name: 'FS-MIB::switchOperState'
