          value_type: CHAR
          trends: '0'
          description: 'Server FQDN reported by ipahealthcheck.meta.core.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data;
                  try { data = JSON.parse(value); } catch (e) { data = []; }
                  if (!Array.isArray(data)) return '';
