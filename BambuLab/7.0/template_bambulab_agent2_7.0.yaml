          tags:
            - tag: component
              value: print
        - uuid: 497f326fe38242babfc81b1e08b2a6bd
          name: 'BambuLab: Last failure snapshot'
          type: DEPENDENT
          key: bambulab.last_failure.snapshot
          delay: '0'
          value_type: TEXT
          trends: '0'
          description: 'One-line summary built from gcode_state, fail_reason, file, profile and job_id.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  try {
                    var s = (value === null || value === undefined) ? '' : String(value);
                    s = s.replace(/\u0000/g, '').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
                    var start = s.indexOf('{');
                    var end = s.lastIndexOf('}');
                    if (start === -1 || end === -1 || end <= start) return '';
                    var j = JSON.parse(s.substring(start, end + 1));
                    var p = (j && j.print) ? j.print : {};
                    function pick(obj, key) {
                      var v = obj ? obj[key] : null;
                      return (v === null || v === undefined) ? '' : v;
                    }
                    var gcodeState = pick(p, 'gcode_state');
                    var failReason = pick(p, 'fail_reason');
                    var file = pick(p, 'gcode_file');
                    if (file === '') file = pick(p, 'file');
                    var profile = pick(p, 'subtask_name');
                    var jobId = pick(p, 'job_id');
                    return [
                      'gcode_state=' + gcodeState,
                      'fail_reason=' + failReason,
                      'file=' + file,
                      'profile=' + profile,
                      'job_id=' + jobId
                    ].join(' | ');
                  } catch (e) {
                    return '';
                  }
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: 'bambulab.get["{$BAMBU_URL}","device/{$BAMBU_SN}/report","{$BAMBU_USER}","{$BAMBU_PASS}"]'
          tags:
            - tag: component
              value: print
        - uuid: 7a3e044631814320aa8d9da69c6d648e
