zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 612cd71d525444e8a35d3ec35f6272ee
      name: Templates/initMAX
  templates:
    - uuid: d4289074d9644fb69abac05cb763b8e4
      template: 'FS Switch S3400 SNMP'
      name: 'FS Switch S3400 SNMP'
      description: |
        More of our templates can be found on https://git.initmax.cz/initMAX-Public/zabbix-templates
        
        Developed by initMAX s.r.o.
        https://www.initmax.com
      vendor:
        name: 'initMAX s.r.o.'
        version: 7.0-0
      groups:
        - name: Templates/initMAX
      items:
        - uuid: d1235834ff754ae18b9d245156148110
          name: 'ICMP ping'
          type: SIMPLE
          key: icmpping
          valuemap:
            name: 'Service state'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: c526dbe0c7d648178ebf1ced293501bb
              expression: 'max(/FS Switch S3400 SNMP/icmpping,#3)=0'
              name: 'FS Switch: Unavailable by ICMP ping'
              priority: HIGH
              tags:
                - tag: scope
                  value: availability
        - uuid: f858398c52844c43900c87179225029e
          name: 'ICMP loss'
          type: SIMPLE
          key: icmppingloss
          value_type: FLOAT
          units: '%'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: a786fe606f2646b6a1a46063a3acf907
              expression: 'min(/FS Switch S3400 SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/FS Switch S3400 SNMP/icmppingloss,5m)<100'
              name: 'FS Switch: High ICMP ping loss'
              opdata: 'Loss: {ITEM.LASTVALUE1}'
              priority: WARNING
              dependencies:
                - name: 'FS Switch: Unavailable by ICMP ping'
                  expression: 'max(/FS Switch S3400 SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: 414edb1fbc8c402e8f00a31c32ac4e1c
          name: 'ICMP response time'
          type: SIMPLE
          key: icmppingsec
          value_type: FLOAT
          units: s
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: 21ff68ed68ff4e8988535a53d86749c5
              expression: 'avg(/FS Switch S3400 SNMP/icmppingsec,5m)>{$ICMP_RESPONSE_TIME_WARN}'
              name: 'FS Switch: High ICMP ping response time'
              opdata: 'Value: {ITEM.LASTVALUE1}'
              priority: WARNING
              dependencies:
                - name: 'FS Switch: High ICMP ping loss'
                  expression: 'min(/FS Switch S3400 SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/FS Switch S3400 SNMP/icmppingloss,5m)<100'
                - name: 'FS Switch: Unavailable by ICMP ping'
                  expression: 'max(/FS Switch S3400 SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: f0c74a33fce84f7e96f07f0d0602b5ee
          name: 'FS Switch: SNMP walk network interfaces'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.2.1.2.2.1.8,1.3.6.1.2.1.2.2.1.7,1.3.6.1.2.1.31.1.1.1.18,1.3.6.1.2.1.31.1.1.1.1,1.3.6.1.2.1.2.2.1.2,1.3.6.1.2.1.2.2.1.3,1.3.6.1.2.1.31.1.1.1.6,1.3.6.1.2.1.31.1.1.1.10,1.3.6.1.2.1.2.2.1.14,1.3.6.1.2.1.2.2.1.20,1.3.6.1.2.1.2.2.1.19,1.3.6.1.2.1.2.2.1.13,1.3.6.1.2.1.31.1.1.1.15]'
          key: net.if.walk
          history: '0'
          value_type: TEXT
          trends: '0'
          description: 'SNMP walk of IF-MIB for network interface discovery and monitoring.'
          tags:
            - tag: component
              value: raw
        - uuid: 868bdaa9209f4745921ccd7f1c996541
          name: 'PoE: Operational status'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.105.1.3.1.1.3.1]'
          key: poe.oper.status
          delay: 5m
          description: 'POWER-ETHERNET-MIB::pethMainPseOperStatus - 1=on, 2=off, 3=faulty.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          tags:
            - tag: component
              value: poe
            - tag: component
              value: power
          triggers:
            - uuid: f3cb76e2c42c426291fc765d712bcf54
              expression: 'last(/FS Switch S3400 SNMP/poe.oper.status)=2'
              name: 'FS Switch: PoE is off'
              event_name: 'FS Switch: PoE is turned off'
              priority: WARNING
              tags:
                - tag: component
                  value: poe
                - tag: scope
                  value: availability
            - uuid: 96a513c92b3240fcb3e37a2b8d321f46
              expression: 'last(/FS Switch S3400 SNMP/poe.oper.status)=3'
              name: 'FS Switch: PoE operational status faulty'
              event_name: 'FS Switch: PoE operational status is faulty'
              priority: HIGH
              tags:
                - tag: component
                  value: poe
                - tag: scope
                  value: availability
        - uuid: 10295d057740428da60807f173116160
          name: 'FS Switch: SNMP walk PoE ports'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.52642.2.236.1.1.1,1.3.6.1.4.1.52642.2.236.1.1.5]'
          key: poe.port.walk
          history: '0'
          value_type: TEXT
          trends: '0'
          description: 'Walk of FS-MIB PoE port table: ifIndex, port name, admin status, max power, current consumption.'
          timeout: 30s
          tags:
            - tag: component
              value: poe
        - uuid: a618668c816443d9a11eaf68856bbc37
          name: 'PoE: Total power budget'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.105.1.3.1.1.2.1]'
          key: poe.total.budget
          delay: 5m
          units: W
          description: 'POWER-ETHERNET-MIB::pethMainPsePower - Total PoE power budget in Watts.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          tags:
            - tag: component
              value: poe
            - tag: component
              value: power
        - uuid: e26265360f3e4838b2021a3a22fb3b12
          name: 'PoE: Total power consumption'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.105.1.3.1.1.4.1]'
          key: poe.total.consumption
          units: W
          description: 'POWER-ETHERNET-MIB::pethMainPseConsumptionPower - Current total PoE power consumption in Watts.'
          tags:
            - tag: component
              value: poe
            - tag: component
              value: power
        - uuid: 02091cae631c450d8f8af1176bef19b8
          name: 'PoE: Utilization'
          type: CALCULATED
          key: poe.util
          value_type: FLOAT
          units: '%'
          params: 'last(//poe.total.consumption) / last(//poe.total.budget) * 100'
          description: 'PoE power utilization as percentage of total budget.'
          tags:
            - tag: component
              value: poe
            - tag: component
              value: power
          triggers:
            - uuid: a25feb5a21bd40e5ab802ab60940233e
              expression: 'min(/FS Switch S3400 SNMP/poe.util,5m)>{$POE.UTIL.WARN}'
              name: 'FS Switch: PoE utilization high'
              event_name: 'FS Switch: PoE utilization high (>{$POE.UTIL.WARN}% for 5m)'
              opdata: 'Current utilization: {ITEM.LASTVALUE1}'
              priority: WARNING
              tags:
                - tag: component
                  value: poe
                - tag: scope
                  value: capacity
        - uuid: 97ec2d71e101427d8bf29d619ccc0ba8
          name: 'FS Switch: SNMP walk PSUs'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.52642.9.189.5.1.1.1,1.3.6.1.4.1.52642.9.189.5.1.1.3,1.3.6.1.4.1.52642.9.189.5.1.1.4,1.3.6.1.4.1.52642.9.189.5.1.1.5]'
          key: sensor.psu.walk
          history: '0'
          value_type: TEXT
          trends: '0'
          description: 'Walk FS PSU table at .9.189.5.1.1 (index, description, status, alarm)'
          tags:
            - tag: component
              value: raw
        - uuid: c83b7aafe81642c8a8ec3d237b61b399
          name: Temperature
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.52642.3.6.10.1.12.0]'
          key: sensor.temp.value
          value_type: FLOAT
          units: °C
          description: 'Board temperature in Celsius'
          tags:
            - tag: component
              value: memory
          triggers:
            - uuid: 5374edcdfea24a8182399102542b6877
              expression: 'avg(/FS Switch S3400 SNMP/sensor.temp.value,5m)>{$TEMP.MAX.CRIT}'
              name: 'FS Switch: Temperature critical (>{$TEMP.MAX.CRIT}°C)'
              priority: HIGH
              tags:
                - tag: component
                  value: temperature
                - tag: scope
                  value: availability
            - uuid: 450884861e6e474ea9cc71de9da8a1a6
              expression: 'avg(/FS Switch S3400 SNMP/sensor.temp.value,5m)>{$TEMP.MAX.WARN}'
              name: 'FS Switch: Temperature warning (>{$TEMP.MAX.WARN}°C)'
              priority: WARNING
              dependencies:
                - name: 'FS Switch: Temperature critical (>{$TEMP.MAX.CRIT}°C)'
                  expression: 'avg(/FS Switch S3400 SNMP/sensor.temp.value,5m)>{$TEMP.MAX.CRIT}'
              tags:
                - tag: component
                  value: temperature
                - tag: scope
                  value: performance
        - uuid: ee2a2b6964924e5b89f9fddd678a3307
          name: 'System contact details'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.4.0]'
          key: 'system.contact[sysContact.0]'
