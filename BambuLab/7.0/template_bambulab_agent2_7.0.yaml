        - uuid: 4b2d5537db314649b5b3f8b1dd9acf64
          name: 'BambuLab: Home flag'
          type: DEPENDENT
          key: bambulab.home_flag
          delay: '0'
          description: |
            Internal bitfield from the printer (one number contains multiple flags).
            
            The value may be negative in the MQTT payload; the template converts it to an unsigned 32-bit integer.
            Used mainly as a source for derived diagnostic flags (e.g. wired_flag).
            
            Note: most bits are not officially documented and may differ by model/firmware.
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.print.home_flag
              error_handler: DISCARD_VALUE
            - type: JAVASCRIPT
              parameters:
                - |
                  var n = parseInt(value, 10);
                  if (isNaN(n)) return null;
                  if (n < 0) n = 4294967296 + n;
                  return n;
          master_item:
            key: 'bambulab.get["{$BAMBU_URL}","device/{$BAMBU_SN}/report","{$BAMBU_USER}","{$BAMBU_PASS}"]'
          tags:
            - tag: component
              value: network
        - uuid: e0f80c1a80b9468ebd3e31aa179f533f
          name: 'BambuLab: Is printing'
          type: DEPENDENT
          key: bambulab.is_printing
          delay: '0'
          description: 'Derived boolean: 1 when Print stage == 2, otherwise 0.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var n = parseInt(value, 10);
                  if (isNaN(n)) return 0;
                  return (n === 2) ? 1 : 0;
          master_item:
            key: bambulab.mc_print_stage
          tags:
            - tag: component
              value: print
        - uuid: f7883503f5644aac8e3848640d7190de
          name: 'BambuLab: Job ID'
          type: DEPENDENT
          key: bambulab.job_id
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: 'Current job ID from $.print.job_id.'
          preprocessing:
