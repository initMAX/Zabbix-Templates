                  value: SRV
              trigger_prototypes:
                - uuid: 26cba12c2b084f90b3baf60523370f5e
                  expression: 'find(/FreeIPA Client/ipa.dns.srv.kerberos.normalized[{#DNS.SERVER}],,"regexp",".+")=1 and find(/FreeIPA Client/ipa.dns.srv.kerberos.normalized.local,,"regexp",".+")=1 and last(/FreeIPA Client/ipa.dns.srv.kerberos.normalized[{#DNS.SERVER}])<>last(/FreeIPA Client/ipa.dns.srv.kerberos.normalized.local)'
