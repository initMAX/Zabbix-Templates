          tags:
            - tag: component
              value: system
        - uuid: baca6ccc8a8e407ca60283572849849c
          name: 'Firmware version'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.47.1.1.1.1.10.1]'
          key: system.sw.version
          delay: 1h
          value_type: CHAR
          trends: '0'
          description: 'FS enterprise MIB - full firmware version string'
          inventory_link: SOFTWARE_APP_A
          preprocessing:
