            - uuid: e54a0cf492164a1fbab84ad3b5a955fe
              name: 'Firebird: transactions statistics on {#FIREBIRD.DB.NAME}'
              graph_items:
                - color: 1A7C11
                  item:
                    host: 'Template DB Firebird'
                    key: 'fbdb[{$FIREBIRD.CONNSTRING},{#FIREBIRD.DB.PATH},{$FIREBIRD.USER},{$FIREBIRD.PASSWORD},trans_idle]'
                - sortorder: '1'
                  color: 0080FF
                  item:
                    host: 'Template DB Firebird'
                    key: 'fbdb[{$FIREBIRD.CONNSTRING},{#FIREBIRD.DB.PATH},{$FIREBIRD.USER},{$FIREBIRD.PASSWORD},trans_active]'
      macros:
        - macro: '{$FB_CACHE_HIT_MIN}'
          value: '90'
          description: 'Minimum acceptable cache hit ratio in percent'
        - macro: '{$FB_CRYPT_STATE_ALERT}'
          value: '1'
          description: 'Crypt_state > this value means encrypt/decrypt in progress (FB4+)'
        - macro: '{$FB_FORCED_WRITES_DISABLED}'
          value: '0'
          description: 'Value of MON$FORCED_WRITES that indicates it is OFF'
        - macro: '{$FB_LOCK_CONFLICTS_MAX}'
          value: '0'
          description: 'Maximum allowed lock conflicts (FB5+)'
        - macro: '{$FB_LONG_TXN_COUNT_MAX}'
          value: '0'
          description: 'Allowed number of long running transactions (>300s)'
        - macro: '{$FB_REPLICA_MODE_ALERT}'
          value: '2'
          description: 'Replica_mode value that indicates read-only replica (FB4+)'
        - macro: '{$FB_RESERVE_SPACE_DISABLED}'
          value: '0'
          description: 'Value of MON$RESERVE_SPACE that indicates it is OFF'
        - macro: '{$FB_SWEEP_ACTIVE_SEC}'
          value: '600'
          description: 'Seconds sweep may stay active before alert'
        - macro: '{$FB_TXN_GAP_MAX}'
          value: '500000'
          description: 'Maximum allowed transaction gap (NEXT_TXN - OLDEST_ACTIVE) before alert'
        - macro: '{$FIREBIRD.CONNSTRING}'
          value: 127.0.0.1
        - macro: '{$FIREBIRD.DB.MATCHES}'
          value: .+
        - macro: '{$FIREBIRD.DB.NOT_MATCHES}'
          value: ^\s$
        - macro: '{$FIREBIRD.LLD.PATH}'
