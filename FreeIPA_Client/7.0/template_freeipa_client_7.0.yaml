            - uuid: 566ddf48768048aa99e9db88bb7879a7
              name: 'Package {#PKG.NAME}: arch'
              description: |
                Extracts package architecture for {#PKG.NAME} from system.sw.packages.get.
                Expected value: arch string (x86_64, aarch64, ...); empty means value not available.
