          type: DEPENDENT
          key: ipa.meta.fqdn
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: 'Server FQDN reported by ipahealthcheck.meta.core.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data;
                  try { data = JSON.parse(value); } catch (e) { data = []; }
                  if (!Array.isArray(data)) return '';
                  for (var i = 0; i < data.length; i++) {
                      var d = data[i];
                      if (d.source === 'ipahealthcheck.meta.core' && d.check === 'MetaCheck') {
                          var kw = d.kw || {};
                          return kw.fqdn || '';
                      }
                  }
                  return '';
          master_item:
