        - uuid: 08bb6ab5707745a58e23ce840ba9e0f1
          name: 'Firmware on EHEIM web page'
          type: HTTP_AGENT
          key: eheim.web.firmware
          delay: 1h
          history: 7d
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: REGEX
