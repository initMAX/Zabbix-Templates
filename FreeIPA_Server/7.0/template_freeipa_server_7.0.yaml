        - uuid: 9eb980aa301f4ea1a3b9b72e36b300f2
          name: 'IPA: validate healthcheck data and freshness'
          type: DEPENDENT
          key: imx.ipa.collection
          delay: '0'
          history: '0'
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |-
                  var out = { ok: 0, source_timestamp: 0, checks: 0, sources: 0 };
                  try {
                      var data = JSON.parse(value);
                      if (!Array.isArray(data) || !data.length) throw 'Empty or invalid healthcheck';
                      var found = Object.create(null), oldest = Infinity;
                      var rank = { SUCCESS: 0, WARNING: 1, ERROR: 2, CRITICAL: 3 };
                      for (var i = 0; i < data.length; i++) {
                          var row = data[i];
                          if (!row || !row.source || !row.check || !Object.prototype.hasOwnProperty.call(rank, row.result)) {
                              throw 'Invalid healthcheck entry';
                          }
                          var m = /^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})Z$/.exec(row.when || '');
                          if (!m) throw 'Invalid source time';
                          var date = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6]));
                          if (date.getUTCFullYear() !== +m[1] || date.getUTCMonth() !== +m[2] - 1 ||
                                  date.getUTCDate() !== +m[3] || date.getUTCHours() !== +m[4] ||
                                  date.getUTCMinutes() !== +m[5] || date.getUTCSeconds() !== +m[6]) {
                              throw 'Invalid source time';
                          }
                          var ts = date.getTime() / 1000;
                          if (ts > Date.now() / 1000 + 300 || ts < Date.now() / 1000 - 1800) throw 'Stale or future source';
                          oldest = Math.min(oldest, ts);
                          found[row.source] = true;
                      }
                      out = { ok: 1, source_timestamp: oldest, checks: data.length, sources: Object.keys(found).length };
                  } catch (error) {
                      out.error = String(error);
                  }
                  return JSON.stringify(out);
          master_item:
            key: ipa.raw
          tags:
            - tag: imx.component
              value: ipa
            - tag: imx.scope
              value: company
          description: 'Validate non-empty payload structure and source timestamps (maximum age 30m, future tolerance 5m). Does not require a fixed set of healthcheck sources.'
