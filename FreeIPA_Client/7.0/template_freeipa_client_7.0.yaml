                  manual_close: 'YES'
                - uuid: f38c3953db3a4ea5b6ce28f0d5343491
                  expression: 'avg(/FreeIPA Client/net.dns.perf[{#DNS.SERVER},{$IPA.DNS.TEST.NAME},A],5m)>{$IPA.DNS.RESP.TIME.WARN} and avg(/FreeIPA Client/net.dns.perf[{#DNS.SERVER},{$IPA.DNS.TEST.NAME},A],5m)<={$IPA.DNS.RESP.TIME.CRIT}'
                  name: 'DNS server {#DNS.SERVER} A response time is high (warning)'
                  priority: WARNING
                  manual_close: 'YES'
            - uuid: ebb57338d1704840a8d218d56786778a
              name: 'DNS server {#DNS.SERVER}: A record normalized'
              description: |
                Normalized list of A record IPs for {$IPA.DNS.TEST.NAME} from the specific resolver.
                Expected value: space-separated list of IPs; empty means no A records found.
              type: DEPENDENT
              key: 'ipa.dns.test.a.normalized[{#DNS.SERVER}]'
              delay: '0'
              history: 7d
              value_type: TEXT
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var ips = value.match(/\\b\\d{1,3}(?:\\.\\d{1,3}){3}\\b/g);
                      if (!ips) return '';
                      var seen = {};
                      var out = [];
                      for (var i = 0; i < ips.length; i++) {
                        if (seen[ips[i]]) continue;
                        seen[ips[i]] = true;
                        out.push(ips[i]);
                      }
                      out.sort();
                      return out.join(' ');
              master_item:
                key: 'net.dns.record[{#DNS.SERVER},{$IPA.DNS.TEST.NAME},A]'
              tags:
                - tag: FreeIPA
                  value: Client
                - tag: FreeIPA
                  value: DNS
              trigger_prototypes:
                - uuid: 731c3b2b9ed447df9f6e0d066a8b3f77
                  expression: 'find(/FreeIPA Client/ipa.dns.test.a.normalized[{#DNS.SERVER}],,"regexp",".+")=1 and find(/FreeIPA Client/ipa.dns.test.a.normalized.local,,"regexp",".+")=1 and last(/FreeIPA Client/ipa.dns.test.a.normalized[{#DNS.SERVER}])<>last(/FreeIPA Client/ipa.dns.test.a.normalized.local)'
                  name: 'DNS server {#DNS.SERVER} A record differs from local resolver'
                  priority: WARNING
                  manual_close: 'YES'
        - uuid: 6a6c7f8c0e8f45c6890a2b447b1d1f62
          name: 'IPA SRV targets discovery'
          description: |
            Discovers SRV targets and ports from _ldap._tcp.{$IPA.DNS.SRV.DOMAIN}.
            Expected value: LLD JSON with {#SRV.TARGET} and {#SRV.PORT} extracted from SRV records.
          type: DEPENDENT
          key: ipa.srv.discovery
          delay: '0'
          lifetime: 30d
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var out = { data: [] };
                  if (!value) return JSON.stringify(out);
                  var lines = value.split('\n');
                  for (var i = 0; i < lines.length; i++) {
                    var line = lines[i].trim();
                    if (!line) continue;
                    var parts = line.split(/\s+/);
                    var idx = parts.indexOf('SRV');
                    if (idx === -1 || parts.length < idx + 5) continue;
                    var priority = parts[idx + 1];
                    var weight = parts[idx + 2];
                    var port = parts[idx + 3];
                    var target = parts[idx + 4];
                    if (!target) continue;
                    target = target.replace(/\.$/, '');
                    out.data.push({
                      "{#SRV.TARGET}": target,
                      "{#SRV.PORT}": port,
                      "{#SRV.PRIORITY}": priority,
                      "{#SRV.WEIGHT}": weight
                    });
                  }
                  return JSON.stringify(out);
          master_item:
            key: 'net.dns.record[,_ldap._tcp.{$IPA.DNS.SRV.DOMAIN},SRV]'
          item_prototypes:
            - uuid: c5b8f8d33c2e4d94b6a49e97c989b686
              name: 'IPA SRV target {#SRV.TARGET}:{#SRV.PORT} TCP'
              description: |
                Simple TCP connectivity check for the SRV target and port discovered via DNS.
                Expected value: 1 = reachable, 0 = connection failed.
              key: 'net.tcp.service[tcp,{#SRV.TARGET},{#SRV.PORT}]'
              delay: 1m
              history: 7d
              value_type: UNSIGNED
              valuemap:
                name: 'Service status'
              tags:
                - tag: FreeIPA
                  value: Client
                - tag: FreeIPA
                  value: DNS
                - tag: FreeIPA
                  value: SRV
            - uuid: 3a1d4057eede4b63b2b0f4a69d4db7c1
              name: 'IPA SRV target {#SRV.TARGET}: A record'
              description: |
                Resolves A record for the SRV target.
                Expected value: DNS response with IP addresses; empty means no A record.
              key: 'net.dns.record[,{#SRV.TARGET},A]'
              delay: 5m
              history: 7d
              trends: '0'
              value_type: TEXT
              tags:
                - tag: FreeIPA
                  value: Client
                - tag: FreeIPA
                  value: DNS
                - tag: FreeIPA
                  value: SRV
              trigger_prototypes:
                - uuid: 5ed9f1a67af24849b303476c8177c4cc
                  expression: 'find(/FreeIPA Client/net.dns.record[,{#SRV.TARGET},A],,"regexp","\\sA\\s")=0'
                  name: 'SRV target {#SRV.TARGET} has no A record'
                  priority: HIGH
                  manual_close: 'YES'
            - uuid: e5ed0c1f3dbf4c4d9bd19af6f2b2f3d0
              name: 'IPA SRV target {#SRV.TARGET}: DNS response time'
              description: |
                Measures DNS response time for the SRV target (A query) using the local resolver.
                Expected value: response time in seconds; 0 means query failed or DNS down.
              key: 'net.dns.perf[,{#SRV.TARGET},A]'
              delay: 1m
              history: 7d
              value_type: FLOAT
              units: s
              tags:
                - tag: FreeIPA
                  value: Client
                - tag: FreeIPA
                  value: DNS
                - tag: FreeIPA
                  value: SRV
              trigger_prototypes:
                - uuid: 3b1f0c5bb8ef47d2a0f53d88b0b3f251
                  expression: 'last(/FreeIPA Client/net.dns.perf[,{#SRV.TARGET},A])=0'
                  name: 'SRV target {#SRV.TARGET} DNS query failed'
                  priority: HIGH
                  manual_close: 'YES'
                - uuid: 9b2f1a3e4a5d4b4e9b2f1a3e4a5d4b4e
                  expression: 'avg(/FreeIPA Client/net.dns.perf[,{#SRV.TARGET},A],5m)>{$IPA.DNS.RESP.TIME.CRIT}'
                  name: 'SRV target {#SRV.TARGET} DNS response time is high (critical)'
                  priority: HIGH
                  manual_close: 'YES'
                - uuid: 8c1d2e3f4a5b4c5d8c1d2e3f4a5b4c5d
                  expression: 'avg(/FreeIPA Client/net.dns.perf[,{#SRV.TARGET},A],5m)>{$IPA.DNS.RESP.TIME.WARN} and avg(/FreeIPA Client/net.dns.perf[,{#SRV.TARGET},A],5m)<={$IPA.DNS.RESP.TIME.CRIT}'
                  name: 'SRV target {#SRV.TARGET} DNS response time is high (warning)'
                  priority: WARNING
                  manual_close: 'YES'
      macros:
