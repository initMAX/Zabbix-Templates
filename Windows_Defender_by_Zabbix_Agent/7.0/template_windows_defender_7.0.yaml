        - uuid: 350a64a1df8045af8baece47ab4e5b04
          name: 'AntiSpyware Signature Last updated'
          type: DEPENDENT
          key: defender.AntispywareSignatureLastUpdated
          delay: '0'
          history: 90d
          trends: '0'
          units: unixtime
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.AntispywareSignatureLastUpdated
            - type: JAVASCRIPT
              parameters:
                - |
                  var year    = value.substring(0, 4);   // 2025
                      var month   = value.substring(4, 6);   // 12
                      var day     = value.substring(6, 8);   // 04
                      var hour    = value.substring(8, 10);  // 04
                      var minute  = value.substring(10, 12); // 02
                      var second  = value.substring(12, 14); // 21
                  
                      // 2. Sestavení ISO 8601 řetězce
                      // ISO 8601 formát: YYYY-MM-DDTHH:MM:SS.msZ
                      // Použijeme Z na konci, protože vstupní řetězec má "+000" (UTC/Zulu time).
                      var isoString = year + '-' + month + '-' + day + 'T' + 
                                      hour + ':' + minute + ':' + second + 'Z';
                      
                      // 3. Parsování a získání milisekund od Epochy
                      // Duktape Date.parse() by měl tento standardní formát zvládnout.
                      var milliseconds = Date.parse(isoString);
                  
                      // Kontrola, zda parsování proběhlo úspěšně
                      if (isNaN(milliseconds)) {
                          //print("ERROR: Nepodařilo se parsovat datum: " + isoString);
                          return NaN;
                      }
                  
                      // 4. Převod na sekundy a zaokrouhlení
                      return Math.floor(milliseconds / 1000);
          master_item:
            key: 'wmi.getall["root\microsoft\windows\defender","select * from MSFT_MpComputerStatus"]'
          tags:
            - tag: component
              value: defender
