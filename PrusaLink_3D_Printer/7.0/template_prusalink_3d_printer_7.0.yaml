          name: 'Printer state'
          type: DEPENDENT
          key: status.state
          delay: '0'
          history: 7d
          valuemap:
            name: StatusPrinter.state
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.printer.state
              error_handler: DISCARD_VALUE
            - type: STR_REPLACE
              parameters:
                - IDLE
                - '1'
            - type: STR_REPLACE
              parameters:
                - BUSY
                - '2'
            - type: STR_REPLACE
              parameters:
                - PRINTING
                - '3'
            - type: STR_REPLACE
              parameters:
                - PAUSED
                - '4'
            - type: STR_REPLACE
              parameters:
                - FINISHED
                - '5'
            - type: STR_REPLACE
              parameters:
                - STOPPED
                - '6'
            - type: STR_REPLACE
              parameters:
                - ERROR
                - '7'
            - type: STR_REPLACE
              parameters:
                - ATTENTION
                - '8'
            - type: STR_REPLACE
              parameters:
                - READY
                - '9'
            - type: IN_RANGE
              parameters:
                - '1'
                - '9'
              error_handler: CUSTOM_VALUE
              error_handler_params: '7'
          master_item:
            key: prusa.status
          tags:
            - tag: component
              value: status
          triggers:
            - uuid: 599e69b785cd447bbeae517726ed1709
              expression: 'last(/PrusaLink 3D Printer/status.state)=8'
              name: 'PrusaLink: Printer state is ATTENTION'
              priority: WARNING
              tags:
                - tag: component
                  value: state
            - uuid: 67c578dc4c3f43258f77536bd907f09d
              expression: 'last(/PrusaLink 3D Printer/status.state)=7'
              name: 'PrusaLink: Printer state is ERROR'
              priority: HIGH
              tags:
                - tag: component
                  value: state
