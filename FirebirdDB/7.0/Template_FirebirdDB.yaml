                  value: transactions
              trigger_prototypes:
                - uuid: 617a930dedf94b9aa648c132fe2def45
                  expression: 'last(/Template DB Firebird/fbdb[{$FIREBIRD.CONNSTRING},{#FIREBIRD.DB.PATH},{$FIREBIRD.USER},{$FIREBIRD.PASSWORD},txn_gap])>{$FB_TXN_GAP_MAX}'
                  name: 'Transaction gap too high on {#FIREBIRD.DB.NAME}'
