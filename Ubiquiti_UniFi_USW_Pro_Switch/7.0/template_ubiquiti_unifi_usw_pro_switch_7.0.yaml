zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 612cd71d525444e8a35d3ec35f6272ee
      name: Templates/initMAX
  templates:
    - uuid: 3ed593c73ebe45349368a9a7279c3fd9
      template: 'Ubiquiti Unifi USW Pro Switch SNMP'
      name: 'Ubiquiti Unifi USW Pro Switch SNMP'
      description: |
        Zabbix template for Ubiquiti Unifi PRO switches:
        - USW-Pro-24 (24-port)
        - USW-Pro-48 (48-port)
        - USW-Pro-24-PoE (24-port PoE)
        - USW-Pro-48-PoE (48-port PoE)
        
        Broadcom-based switches (sysObjectID: enterprises.4413).
        For standard models (USW-24/48, USW-24-PoE) use the separate USW Switch template.
        
        Monitors via SNMP v2c using enterprise 4413 MIB, ENTITY-MIB and standard IF-MIB.
        
        More of our templates can be found on https://git.initmax.cz/initMAX-Public/zabbix-templates
        
        Developed by initMAX s.r.o.
        https://www.initmax.com
      vendor:
        name: 'initMAX s.r.o.'
        version: 7.0-0
      groups:
        - name: Templates/initMAX
      items:
        - uuid: 21b2276697fd4be490469b524711a72e
          name: 'ICMP ping'
          type: SIMPLE
          key: icmpping
          valuemap:
            name: 'Service state'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: 184793954c7140b99c48f295d3c84d05
              expression: 'max(/Ubiquiti Unifi USW Pro Switch SNMP/icmpping,#3)=0'
              name: 'Unifi Switch Pro: Unavailable by ICMP ping'
              priority: HIGH
              tags:
                - tag: scope
                  value: availability
        - uuid: 5cd9ed1ef9d14f4da2ccee0fe406eb16
          name: 'ICMP loss'
          type: SIMPLE
          key: icmppingloss
          value_type: FLOAT
          units: '%'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: 6ebd2dafd2084d5b92d4fb90e20576d6
              expression: 'min(/Ubiquiti Unifi USW Pro Switch SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Ubiquiti Unifi USW Pro Switch SNMP/icmppingloss,5m)<100'
              name: 'Unifi Switch Pro: High ICMP ping loss'
              event_name: 'Unifi Switch Pro: High ICMP ping loss (>{$ICMP_LOSS_WARN}%)'
              opdata: 'Loss: {ITEM.LASTVALUE1}'
              priority: WARNING
              dependencies:
                - name: 'Unifi Switch Pro: Unavailable by ICMP ping'
                  expression: 'max(/Ubiquiti Unifi USW Pro Switch SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
        - uuid: b75241a756294db8a011284b2c150346
          name: 'ICMP response time'
          type: SIMPLE
          key: icmppingsec
          value_type: FLOAT
          units: s
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: a88ebd4eaea74e7e9096fd17a86ae54a
              expression: 'avg(/Ubiquiti Unifi USW Pro Switch SNMP/icmppingsec,5m)>{$ICMP_RESPONSE_TIME_WARN}'
              name: 'Unifi Switch Pro: High ICMP ping response time'
              event_name: 'Unifi Switch Pro: High ICMP ping response time (>{$ICMP_RESPONSE_TIME_WARN}s)'
              opdata: 'Value: {ITEM.LASTVALUE1}'
              priority: WARNING
              dependencies:
                - name: 'Unifi Switch Pro: High ICMP ping loss'
                  expression: 'min(/Ubiquiti Unifi USW Pro Switch SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Ubiquiti Unifi USW Pro Switch SNMP/icmppingloss,5m)<100'
                - name: 'Unifi Switch Pro: Unavailable by ICMP ping'
                  expression: 'max(/Ubiquiti Unifi USW Pro Switch SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
        - uuid: 6b19ace72ca444aa8a494da1b836bc51
          name: 'Unifi Switch Pro: SNMP walk network interfaces'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.2.1.2.2.1.8,1.3.6.1.2.1.2.2.1.7,1.3.6.1.2.1.31.1.1.1.18,1.3.6.1.2.1.31.1.1.1.1,1.3.6.1.2.1.2.2.1.2,1.3.6.1.2.1.2.2.1.3,1.3.6.1.2.1.31.1.1.1.6,1.3.6.1.2.1.31.1.1.1.10,1.3.6.1.2.1.2.2.1.14,1.3.6.1.2.1.2.2.1.20,1.3.6.1.2.1.2.2.1.19,1.3.6.1.2.1.2.2.1.13,1.3.6.1.2.1.31.1.1.1.15]'
          key: net.if.walk
          history: '0'
          value_type: TEXT
          trends: '0'
          description: 'SNMP walk of IF-MIB for network interface discovery and monitoring.'
          tags:
            - tag: component
              value: raw
        - uuid: afb4c04094834eef8ed7a34e0e961021
          name: 'Unifi Switch Pro: SNMP walk fans'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.4413.1.1.43.1.6.1.1.1,1.3.6.1.4.1.4413.1.1.43.1.6.1.3.1,1.3.6.1.4.1.4413.1.1.43.1.6.1.4.1,1.3.6.1.4.1.4413.1.1.43.1.6.1.5.1]'
          key: sensor.fan.walk
          history: '0'
          value_type: TEXT
          trends: '0'
          description: 'SNMP walk of UnifiSwitch-BOXSERVICES-MIB fan table.'
          tags:
            - tag: component
              value: raw
        - uuid: 5f5ceb81ce7a4086bf210851ca4434c0
          name: 'Unifi Switch Pro: SNMP walk temperature sensors'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.4413.1.1.43.1.8.1.2.1,1.3.6.1.4.1.4413.1.1.43.1.8.1.3.1,1.3.6.1.4.1.4413.1.1.43.1.8.1.5.1]'
          key: sensor.temp.walk
          history: '0'
          value_type: TEXT
          trends: '0'
          description: 'SNMP walk of UnifiSwitch-BOXSERVICES-MIB temperature sensor table.'
          tags:
            - tag: component
              value: raw
        - uuid: ddc5058047584bdf91b5665b1bc12f68
