      template: 'BambuLab by Zabbix agent2 MQTT'
      name: 'BambuLab by Zabbix agent2 (MQTT)'
      description: |
        More of our templates can be found on https://git.initmax.cz/initMAX-Public/zabbix-templates
        
        Developed by initMAX s.r.o.
        https://www.initmax.com
      vendor:
        name: 'initMAX s.r.o.'
        version: 7.0-0
      groups:
        - name: Templates/initMAX
      items:
        - uuid: cac2b58b5ef14042975558669148847a
          name: 'BambuLab: Active AMS tray (tray_now)'
          type: DEPENDENT
          key: bambulab.ams.tray_now
          delay: '0'
          description: |
            Active filament tray index (tray_now).
            
            Common mapping:
            - tray_now = ams_id*4 + tray_id
            - 255 means no active tray
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  function safeParse(s) {
                    if (s === null || s === undefined) return null;
                    s = String(s).replace(/\u0000/g, '').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
                    var start = s.indexOf('{');
                    var end = s.lastIndexOf('}');
                    if (start === -1 || end === -1 || end <= start) return null;
                    try { return JSON.parse(s.substring(start, end + 1)); } catch (e) { return null; }
                  }
                  var j = safeParse(value);
                  if (!j || !j.print) return null;
                  var p = j.print;
                  var v = null;
                  if (p.ams && p.ams.tray_now !== undefined && p.ams.tray_now !== null) v = p.ams.tray_now;
                  else if (p.tray_now !== undefined && p.tray_now !== null) v = p.tray_now;
                  else if (j.tray_now !== undefined && j.tray_now !== null) v = j.tray_now;
                  var n = parseInt(v, 10);
                  return isNaN(n) ? null : n;
          master_item:
            key: 'bambulab.get["{$BAMBU_URL}","device/{$BAMBU_SN}/report","{$BAMBU_USER}","{$BAMBU_PASS}"]'
          tags:
            - tag: component
              value: ams
        - uuid: c151b04d896f4f62aa83a1fad652da4e
          name: 'BambuLab: Active AMS tray (text)'
          type: DEPENDENT
          key: bambulab.ams.tray_now.text
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: 'Human-readable label derived from tray_now (e.g. "AMS 0 Tray 3" or "None").'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var n = parseInt(value, 10);
                  if (isNaN(n)) return 'unknown';
                  if (n === 255) return 'None';
                  if (n < 0) return 'unknown';
                  var amsId = Math.floor(n / 4);
                  var trayId = n % 4;
                  return 'AMS ' + String(amsId) + ' Tray ' + String(trayId);
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: bambulab.ams.tray_now
          tags:
            - tag: component
              value: ams
        - uuid: 10c95df6f0bb4ec499a1733fb752c43d
