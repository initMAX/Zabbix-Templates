        - uuid: 25e88376813c4532a9cd33da78267d18
          name: Version
          type: DEPENDENT
          key: pbs.version.string
          delay: '0'
          history: 7d
          value_type: TEXT
          trends: '0'
          description: 'Proxmox Backup Server version string.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.data.version
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          master_item:
            key: pbs.version
          tags:
            - tag: component
              value: system
      discovery_rules:
        - uuid: 01eb2d203e2e41da82ae5fc55e715705
          name: 'Datastore discovery'
          type: DEPENDENT
          key: pbs.datastore.discovery
          delay: '0'
          description: 'Discovery of configured datastores via /status/datastore-usage.'
          item_prototypes:
            - uuid: b5ad2b9d7f264896b7b9d2f91508cad2
              name: 'Datastore [{#DATASTORE}]: Available space'
              type: DEPENDENT
              key: 'pbs.datastore.avail[{#DATASTORE}]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              units: B
              description: 'Available datastore space in bytes.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.data[?(@.store=="{#DATASTORE}")].avail.first()'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 10m
              master_item:
                key: pbs.datastore.usage
              tags:
                - tag: component
                  value: datastore
                - tag: datastore
                  value: '{#DATASTORE}'
            - uuid: 42a1cdc13e914fdaa9c59b6034705747
              name: 'Datastore [{#DATASTORE}]: Latest backup age'
              type: CALCULATED
              key: 'pbs.datastore.backup.age[{#DATASTORE}]'
              delay: 5m
              history: 7d
              value_type: FLOAT
              units: s
              params: '(last(//pbs.datastore.backup.last[{#DATASTORE}])>0)*(now()-last(//pbs.datastore.backup.last[{#DATASTORE}]))'
              description: 'Age of the latest backup in seconds (now - latest backup time). Returns 0 when no backup exists yet.'
              tags:
                - tag: component
                  value: backup
                - tag: datastore
                  value: '{#DATASTORE}'
            - uuid: 5d48aac04d764dfcad7d0f8977778e79
              name: 'Datastore [{#DATASTORE}]: Total backups count'
              type: DEPENDENT
              key: 'pbs.datastore.backup.count[{#DATASTORE}]'
              delay: '0'
              history: 7d
              description: 'Total number of backup snapshots across all groups on the datastore (sum of backup-count).'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - 'try { return (JSON.parse(value).data || []).reduce(function(s, g) { return s + (g[''backup-count''] || 0); }, 0); } catch (e) { return 0; }'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: 'pbs.datastore.groups.get[{#DATASTORE}]'
              tags:
                - tag: component
                  value: backup
                - tag: datastore
                  value: '{#DATASTORE}'
            - uuid: 746f409c31b34da5a0512c768fdc7bc5
              name: 'Datastore [{#DATASTORE}]: Latest backup duration'
              type: DEPENDENT
              key: 'pbs.datastore.backup.duration[{#DATASTORE}]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              units: s
              description: 'Duration of the most recent backup task for this datastore (endtime - starttime).'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      try {
                        var tasks = JSON.parse(value).data || [];
                        var pfx = '{#DATASTORE}:';
                        var best = null;
                        for (var i = 0; i < tasks.length; i++) {
                          var t = tasks[i];
                          if ((t.worker_id || '').indexOf(pfx) === 0 && t.endtime) {
                            if (best === null || t.starttime > best.starttime) best = t;
                          }
                        }
                        return best ? (best.endtime - best.starttime) : 0;
                      } catch (e) { return 0; }
              master_item:
                key: pbs.tasks.backup.get
              tags:
                - tag: component
                  value: backup
                - tag: datastore
                  value: '{#DATASTORE}'
            - uuid: 1c98aa056d324119bc638d0bfce3c935
              name: 'Datastore [{#DATASTORE}]: Failed backups (24h)'
              type: DEPENDENT
              key: 'pbs.datastore.backup.failed[{#DATASTORE}]'
              delay: '0'
              history: 7d
              description: 'Number of failed backup tasks for this datastore in the last 24 hours.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      try {
                        var tasks = JSON.parse(value).data || [];
                        var pfx = '{#DATASTORE}:';
                        var cutoff = Math.floor(Date.now() / 1000) - 86400;
                        var n = 0;
                        for (var i = 0; i < tasks.length; i++) {
                          var t = tasks[i];
                          if ((t.worker_id || '').indexOf(pfx) === 0 && t.status && t.status !== 'OK' && (t.endtime || 0) >= cutoff) n++;
                        }
                        return n;
                      } catch (e) { return 0; }
              master_item:
                key: pbs.tasks.backup.get
              tags:
                - tag: component
                  value: backup
                - tag: datastore
                  value: '{#DATASTORE}'
              trigger_prototypes:
                - uuid: 4650bca9f49140028d3703da5aa6f863
                  expression: 'last(/Proxmox Backup Server by HTTP/pbs.datastore.backup.failed[{#DATASTORE}])>0'
                  name: 'Proxmox Backup Server: Datastore [{#DATASTORE}] has failed backups in the last 24h'
                  priority: HIGH
                  description: 'One or more backup tasks for this datastore have failed in the last 24 hours.'
                  tags:
                    - tag: datastore
                      value: '{#DATASTORE}'
                    - tag: scope
                      value: backup
            - uuid: 17837f5a13264e8ea25118b7476936d1
              name: 'Datastore [{#DATASTORE}]: Backup groups count'
              type: DEPENDENT
              key: 'pbs.datastore.backup.groups[{#DATASTORE}]'
              delay: '0'
              history: 7d
              description: 'Number of distinct backup groups (vm/ct/host targets) on the datastore.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - 'try { return (JSON.parse(value).data || []).length; } catch (e) { return 0; }'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: 'pbs.datastore.groups.get[{#DATASTORE}]'
              tags:
                - tag: component
                  value: backup
                - tag: datastore
                  value: '{#DATASTORE}'
              trigger_prototypes:
                - uuid: 42207445a42249d0b8af640117715f15
                  expression: 'last(/Proxmox Backup Server by HTTP/pbs.datastore.backup.groups[{#DATASTORE}])=0'
                  name: 'Proxmox Backup Server: Datastore [{#DATASTORE}] has no backup groups'
                  priority: WARNING
                  description: 'The datastore contains no backup groups.'
                  tags:
                    - tag: datastore
                      value: '{#DATASTORE}'
                    - tag: scope
                      value: backup
            - uuid: 49672cf1647344d59c3c4771604813aa
              name: 'Datastore [{#DATASTORE}]: Latest backup time'
              type: DEPENDENT
              key: 'pbs.datastore.backup.last[{#DATASTORE}]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              trends: '0'
              units: unixtime
              description: 'UNIX timestamp of the most recent backup across all groups on the datastore.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - 'try { var groups = JSON.parse(value).data || []; var max = 0; for (var i = 0; i < groups.length; i++) { var t = groups[i][''last-backup''] || 0; if (t > max) max = t; } return max; } catch (e) { return 0; }'
              master_item:
                key: 'pbs.datastore.groups.get[{#DATASTORE}]'
              tags:
                - tag: component
                  value: backup
                - tag: datastore
                  value: '{#DATASTORE}'
            - uuid: 2a2f59baacc44212a7c03a2f0222a5de
              name: 'Datastore [{#DATASTORE}]: Total backup size'
              type: DEPENDENT
              key: 'pbs.datastore.backup.size[{#DATASTORE}]'
              delay: '0'
              history: 7d
              units: B
              description: 'Sum of the size of all backup snapshots on the datastore.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - 'try { return (JSON.parse(value).data || []).reduce(function(s, e) { return s + (e.size || 0); }, 0); } catch (e) { return 0; }'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: 'pbs.datastore.snapshots.get[{#DATASTORE}]'
              tags:
                - tag: component
                  value: backup
                - tag: datastore
                  value: '{#DATASTORE}'
            - uuid: 38e388eb5db64ed4a6b9593d5206938a
              name: 'Datastore [{#DATASTORE}]: Get config'
              type: HTTP_AGENT
              key: 'pbs.datastore.config.get[{#DATASTORE}]'
              delay: 1h
              history: '0'
              value_type: TEXT
              trends: '0'
              description: 'Datastore configuration (used to read the GC schedule).'
              preprocessing:
                - type: CHECK_NOT_SUPPORTED
                  parameters:
                    - '-1'
                  error_handler: CUSTOM_VALUE
