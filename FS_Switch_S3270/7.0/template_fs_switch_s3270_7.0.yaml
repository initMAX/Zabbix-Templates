              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
        - uuid: e8c1ec01b2c744aeb5b65c6ac4e78377
          name: 'Memory: Utilization (raw)'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.52642.1.1.10.2.35.1.1.1.3.1]'
          key: vm.memory.pfree
          units: '%'
          description: 'FS enterprise MIB - likely memory utilization percentage'
          tags:
            - tag: component
              value: memory
        - uuid: 34eb192df15245258493446e3d82fbf0
          name: 'Memory: Total'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.52642.1.1.10.2.1.1.37.0]'
          key: vm.memory.total
          delay: 5m
