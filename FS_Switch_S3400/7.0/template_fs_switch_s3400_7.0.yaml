            - uuid: 39f7d24a69fd46638bca383c5d5152b1
              expression: 'last(/FS Switch S3400 SNMP/system.status)=6'
              name: 'FS Switch: System in nonrecoverable state'
              priority: DISASTER
              tags:
                - tag: scope
                  value: availability
        - uuid: 5f5d80694aaa4e35ac06d0512283b91b
          name: 'Product name'
