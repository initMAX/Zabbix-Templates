        - uuid: 2cc199d1c0554498b10b8ee41cba3a97
          name: 'Open file descriptors'
          type: DEPENDENT
          key: logstash.process.open_fd
          delay: '0'
          history: 7d
          preprocessing:
            - type: JSONPATH
              parameters:
