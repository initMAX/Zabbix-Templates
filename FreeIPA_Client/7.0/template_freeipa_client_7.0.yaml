          delay: 1s
          history: 7d
          description: |
            Active log check for SSSD errors in /var/log/sssd matching {$IPA.SSSD.LOG.ERROR}.
            Expected value: log line content; empty when no matches. Requires active checks and read access.
          value_type: LOG
