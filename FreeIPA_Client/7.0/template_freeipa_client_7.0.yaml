                  expression: 'last(/FreeIPA Client/net.dns.perf[{#DNS.SERVER},{$IPA.DNS.TEST.NAME},A])=0'
                  name: 'DNS server {#DNS.SERVER} A query failed for {$IPA.DNS.TEST.NAME}'
