          triggers:
            - uuid: 5fc0393752bd411895c423b201771b0f
              expression: 'min(/Ubiquiti Unifi USW Pro Switch SNMP/system.cpu.util.5min,5m)>{$CPU.UTIL.CRIT}'
              name: 'Unifi Switch Pro: High CPU utilization'
              event_name: 'Unifi Switch Pro: High CPU utilization (>{$CPU.UTIL.CRIT}% for 5m)'
              opdata: 'Current utilization: {ITEM.LASTVALUE1}%'
              priority: WARNING
              tags:
                - tag: scope
                  value: performance
        - uuid: fbb5fa71e40b4a4680387be5c3400b08
          name: 'System description'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.1.0]'
          key: 'system.descr[sysDescr.0]'
