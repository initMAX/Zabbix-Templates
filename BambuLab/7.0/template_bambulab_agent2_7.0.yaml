          name: 'BambuLab: Online version (hex)'
          type: DEPENDENT
          key: bambulab.online.version.hex
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: 'Online version marker formatted as hex (e.g. 0x00000009).'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
