zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: a571c0d144b14fd4a87a9d9b2aa9fcd6
      name: Templates/Applications
  host_groups:
    - uuid: 2deb24a1c5f0458e845a10af1fe44f99
      name: Certificates
  templates:
    - uuid: 8232529abcb644f1a5ef01c5bc3daf90
      template: 'Multiple Website certificate by Zabbix agent 2 - Discovery'
      name: 'Multiple Website certificate by Zabbix agent 2 - Discovery'
      description: |
        Based on original Zabbix template "Website certificate by Zabbix agent 2"
        
        This template monitors TLS/SSL certificates across multiple websites simultaneously.
        
        DEPLOYMENT OPTIONS:
        1. Item Discovery Mode (Default): Template automatically creates items to monitor all certificates on the host where the template is applied. This is the default setting.
        2. Host Discovery Mode: Optionally, you can activate discovery of virtual hosts, where a separate virtual host is created for each certificate. Individual monitoring checks are then attached to these virtual hosts to monitor the respective certificates.
        
        Note: Switching between these modes is done in the template settings.
        
        CONFIGURATION:
        Set {$CERT.ARRAY} macro with your certificate targets using format:
        (<hostname1>:<port1>:<ip1>),(<hostname2>:<port2>:<ip2>),(<hostname3>)
        
        - Hostname: Required, FQDN of the website (e.g., example.com)
        - Port: Optional, defaults to {$CERT.DEFAULT.PORT} (443) if omitted
        - IP: Optional, allows checking certificates on specific IP addresses
        
        ALERTS:
        - Warning trigger: Certificate expires within {$CERT.EXPIRY.WARN} days (default: 30)
        - Critical trigger: Certificate expires within {$CERT.EXPIRY.HIGH} days (default: 7)
        
        COLLECTED METRICS:
        - Certificate issuer
        - Certificate subject
        - Certificate validity period
        - Days until certificate expiration
        - Certificate validation status
        
        More of our templates can be found on
        https://git.initmax.cz/initMAX-Public/zabbix-templates
        
        Developed by initMAX s.r.o.
        https://www.initmax.com
      vendor:
        name: initMAX s.r.o.
        version: 7.0-2
      groups:
        - name: Templates/Applications
      items:
        - uuid: 30dd8fdd3ad545c59b037dee02aaeed3
          name: 'Count of monitored certificates'
          type: DEPENDENT
          key: multiple.cert.count
          history: 10d
          trends: '0'
          units: '!certs'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return value.split('','').length'
          master_item:
            key: multiple.cert.list
        - uuid: 243f1e5524bf4383978ad65a6155c5f1
          name: 'List of monitored certificates'
          type: SCRIPT
          key: multiple.cert.list
          value_type: TEXT
          params: |
            params = JSON.parse(value)
            
            return params.cert_array;
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 15m
          parameters:
            - name: cert_array
              value: '{$CERT.ARRAY}'
      discovery_rules:
        - uuid: a62af111cc5941f89f031629cccfc09b
          name: 'Multiple Cert Discovery - Hosts'
          type: DEPENDENT
          key: multiple.cert.discovery.hosts
          status: DISABLED
          lifetime: 1d
          host_prototypes:
            - uuid: b343104330734897a6e5071d9e941825
              host: 'cert_{#DISPLAYNAME}'
              name: 'Cert "{#DISPLAYNAME}"'
              inventory_mode: AUTOMATIC
              group_links:
                - group:
                    name: Certificates
              templates:
                - name: 'Multiple Website certificate by Zabbix agent 2 - Host monitoring'
              macros:
                - macro: '{$CERT.EXPIRY.HIGH}'
                  value: '{#CERT.EXPIRY.HIGH}'
                  description: 'Number of days until the certificate expires.'
                - macro: '{$CERT.EXPIRY.WARN}'
                  value: '{#CERT.EXPIRY.WARN}'
                  description: 'Number of days until the certificate expires.'
                - macro: '{$CERT.WEBSITE.HOSTNAME}'
                  value: '{#HOSTNAME}'
                - macro: '{$CERT.WEBSITE.IP}'
                  value: '{#IP}'
                - macro: '{$CERT.WEBSITE.PORT}'
                  value: '{#PORT}'
          master_item:
            key: multiple.cert.list
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  // Cert LLD: CSV input to discovery JSON using macro-based default port
                  const CLogger = function(serviceName) {
                      this.serviceName = serviceName;
                      this.INFO = 4;
                      this.WARN = 3;
                      this.ERROR = 2;
                  
                      this.log = function(level, msg) {
                          Zabbix.log(level, '[' + this.serviceName + '] ' + msg);
                      };
                  };
                  
                  var log = new CLogger('CertDiscovery');
                  
                  // Macro will be replaced at runtime by Zabbix
                  var defaultPort = '{$CERT.DEFAULT.PORT}';
                  
                  // Fallback to hardcoded default if macro not filled
                  if (!defaultPort || defaultPort === '{$CERT.DEFAULT.PORT}') {
                      log.log(log.WARN, 'Macro {$CERT.DEFAULT.PORT} not set. Using fallback port 443');
                      defaultPort = '443';
                  }
                  
                  // Remove brackets and split list
                  var cleaned = value.replace(/[()]/g, '');
                  log.log(log.INFO, 'Cleaned input: ' + cleaned);
                  
                  var entries = cleaned.split(',');
                  var result = [];
                  
                  for (var i = 0; i < entries.length; i++) {
                      var parts = entries[i].split(':').map(function(s) { return s.trim(); });
                  
                      var hostname = parts[0];
                      var port = parts[1] || defaultPort;
                      var ip = parts[2] || '';
                  
                      // Skip and log error if both hostname and IP are missing
                      if (!hostname && !ip) {
                          log.log(log.ERROR, 'Invalid entry at index ' + i + ': Missing both hostname and IP');
                          continue;
                      }
                  
                      var display = hostname ? hostname : ip;
                      if (port) {
                          display += '_' + port;
                      }
                  
                      result.push({
                          "{#HOSTNAME}": hostname,
                          "{#PORT}": port,
                          "{#IP}": ip,
                          "{#DISPLAYNAME}": display,
                  		"{$CERT.EXPIRY.WARN}": "{$CERT.EXPIRY.WARN}",
                  		"{$CERT.EXPIRY.HIGH}": "{$CERT.EXPIRY.HIGH}"
                      });
                  }
                  
                  var output = JSON.stringify(result);
                  log.log(log.INFO, 'Generated output: ' + output);
                  
                  return output;
        - uuid: 5fb29368af164843af071e8b29ea459f
          name: 'Multiple Cert Discovery - Items'
          type: DEPENDENT
          key: multiple.cert.discovery.items
          lifetime: 1d
          item_prototypes:
            - uuid: 35c04652b18440f096c78ca736517cc1
              name: 'Cert {#DISPLAYNAME}: Subject alternative name'
              type: DEPENDENT
              key: 'cert.alternative_names[{#DISPLAYNAME}]'
              history: 7d
              value_type: TEXT
              description: 'The subject alternative name extension allows identities to be bound to the subject of the certificate.  These identities may be included in addition to or in place of the identity in the subject field of the certificate.  Defined options include an Internet electronic mail address, a DNS name, an IP address, and a Uniform Resource Identifier (URI).'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.x509.alternative_names
              master_item:
                key: 'web.certificate.get[{#HOSTNAME},{#PORT},{#IP}]'
              tags:
                - tag: Cert
                  value: '{#DISPLAYNAME}'
            - uuid: ebf3e49be48c470c8ee1d0c3fd9aa825
              name: 'Cert {#DISPLAYNAME}: Days to Expire'
              type: CALCULATED
              key: 'cert.expire.timer[{#DISPLAYNAME}]'
              delay: 15m
              history: 7d
              trends: '0'
              units: '!days'
              params: 'round((last(//cert.not_after[{#DISPLAYNAME}]) - now()) / 86400, 0)'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              tags:
                - tag: Cert
                  value: '{#DISPLAYNAME}'
              trigger_prototypes:
                - uuid: 1a069d3e144f424b9fcc5c9d8a5de016
                  expression: 'last(/Multiple Website certificate by Zabbix agent 2 - Discovery/cert.expire.timer[{#DISPLAYNAME}]) <= 0'
                  name: 'Cert {#DISPLAYNAME}: Certificate expired'
                  opdata: '{ITEM.LASTVALUE}'
                  priority: DISASTER
                - uuid: 6c8997d2dd4f431492486a6d1d40d8a4
                  expression: 'last(/Multiple Website certificate by Zabbix agent 2 - Discovery/cert.expire.timer[{#DISPLAYNAME}]) <= {$CERT.EXPIRY.HIGH}'
                  name: 'Cert {#DISPLAYNAME}: Days to Expire (High)'
                  event_name: 'Cert {#DISPLAYNAME}: Days to Expire is lower than {$CERT.EXPIRY.HIGH}'
                  opdata: '{ITEM.LASTVALUE}'
                  priority: HIGH
                  dependencies:
                    - name: 'Cert {#DISPLAYNAME}: Certificate expired'
                      expression: 'last(/Multiple Website certificate by Zabbix agent 2 - Discovery/cert.expire.timer[{#DISPLAYNAME}]) <= 0'
                - uuid: 5c7d7fc2acf145b589058b5e5117d845
                  expression: 'last(/Multiple Website certificate by Zabbix agent 2 - Discovery/cert.expire.timer[{#DISPLAYNAME}]) <= {$CERT.EXPIRY.WARN}'
                  name: 'Cert {#DISPLAYNAME}: Days to Expire (Warning)'
                  event_name: 'Cert {#DISPLAYNAME}: Days to Expire is lower than {$CERT.EXPIRY.WARN}'
                  opdata: '{ITEM.LASTVALUE}'
                  priority: WARNING
                  manual_close: 'YES'
                  dependencies:
                    - name: 'Cert {#DISPLAYNAME}: Certificate expired'
                      expression: 'last(/Multiple Website certificate by Zabbix agent 2 - Discovery/cert.expire.timer[{#DISPLAYNAME}]) <= 0'
                    - name: 'Cert {#DISPLAYNAME}: Days to Expire (High)'
                      expression: 'last(/Multiple Website certificate by Zabbix agent 2 - Discovery/cert.expire.timer[{#DISPLAYNAME}]) <= {$CERT.EXPIRY.HIGH}'
            - uuid: 0b5a9220b87a4ab2ac6913438601aee0
              name: 'Cert {#DISPLAYNAME}: Issuer name'
              type: DEPENDENT
              key: 'cert.issuer.name[{#DISPLAYNAME}]'
              history: 7d
              value_type: TEXT
              description: 'The field identifies the entity that has signed and issued the certificate.'
              preprocessing:
                - type: REGEX
                  parameters:
                    - 'O=([^,]+)'
                    - \1
              master_item:
                key: 'cert.issuer[{#DISPLAYNAME}]'
              tags:
                - tag: Cert
                  value: '{#DISPLAYNAME}'
            - uuid: 9f312eca0997406cb77d7eb920492b7c
              name: 'Cert {#DISPLAYNAME}: Issuer'
              type: DEPENDENT
              key: 'cert.issuer[{#DISPLAYNAME}]'
              history: 7d
              value_type: TEXT
              description: 'The field identifies the entity that has signed and issued the certificate.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.x509.issuer
              master_item:
                key: 'web.certificate.get[{#HOSTNAME},{#PORT},{#IP}]'
              tags:
                - tag: Cert
                  value: '{#DISPLAYNAME}'
            - uuid: f57004e360e7488bbbadc7d964e49d99
              name: 'Cert {#DISPLAYNAME}: Lifespan %'
              type: CALCULATED
              key: 'cert.lifespan[{#DISPLAYNAME}]'
              delay: 15m
              history: 7d
              trends: '0'
              units: '%'
              params: '((now()-last(//cert.not_before[{#DISPLAYNAME}]))/(last(//cert.not_after[{#DISPLAYNAME}])-last(//cert.not_before[{#DISPLAYNAME}])))*100'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              tags:
                - tag: Cert
                  value: '{#DISPLAYNAME}'
            - uuid: c8e685be0071485a9cf3674ac2808ee2
              name: 'Cert {#DISPLAYNAME}: Last validation status'
              type: DEPENDENT
              key: 'cert.message[{#DISPLAYNAME}]'
              history: 7d
              value_type: TEXT
              description: 'Last check result message.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.result.message
              master_item:
                key: 'web.certificate.get[{#HOSTNAME},{#PORT},{#IP}]'
              tags:
                - tag: Cert
                  value: '{#DISPLAYNAME}'
            - uuid: 17e1f2885c0e4d63838710769e4ffc27
              name: 'Cert {#DISPLAYNAME}: Expires on'
              type: DEPENDENT
              key: 'cert.not_after[{#DISPLAYNAME}]'
              history: 7d
              trends: '0'
              units: unixtime
              description: 'The date on which the certificate validity period ends.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.x509.not_after.timestamp
              master_item:
                key: 'web.certificate.get[{#HOSTNAME},{#PORT},{#IP}]'
              tags:
                - tag: Cert
                  value: '{#DISPLAYNAME}'
            - uuid: 6a095f2ca1844cce9d777b3a884ad592
              name: 'Cert {#DISPLAYNAME}: Valid from'
              type: DEPENDENT
              key: 'cert.not_before[{#DISPLAYNAME}]'
              history: 7d
              trends: '0'
              units: unixtime
              description: 'The date on which the certificate validity period begins.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.x509.not_before.timestamp
              master_item:
                key: 'web.certificate.get[{#HOSTNAME},{#PORT},{#IP}]'
              tags:
                - tag: Cert
                  value: '{#DISPLAYNAME}'
            - uuid: 8cbb86c54ee74bf49a17fbf17b24cb7f
              name: 'Cert {#DISPLAYNAME}: Public key algorithm'
              type: DEPENDENT
              key: 'cert.public_key_algorithm[{#DISPLAYNAME}]'
              history: 7d
              value_type: CHAR
              description: 'The digital signature algorithm is used to verify the signature of a certificate.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.x509.public_key_algorithm
              master_item:
                key: 'web.certificate.get[{#HOSTNAME},{#PORT},{#IP}]'
              tags:
                - tag: Cert
                  value: '{#DISPLAYNAME}'
            - uuid: 9ee278dd284a40aebd09cbe8f4d018df
              name: 'Cert {#DISPLAYNAME}: Serial number'
              type: DEPENDENT
              key: 'cert.serial_number[{#DISPLAYNAME}]'
              history: 7d
              value_type: CHAR
              description: 'The serial number is a positive integer assigned by the CA to each certificate. It is unique for each certificate issued by a given CA. Non-conforming CAs may issue certificates with serial numbers that are negative or zero.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.x509.serial_number
              master_item:
                key: 'web.certificate.get[{#HOSTNAME},{#PORT},{#IP}]'
              tags:
                - tag: Cert
                  value: '{#DISPLAYNAME}'
            - uuid: d0243f70b08a45788471cb857dc55af2
              name: 'Cert {#DISPLAYNAME}: Fingerprint'
              type: DEPENDENT
              key: 'cert.sha1_fingerprint[{#DISPLAYNAME}]'
              history: 7d
              value_type: CHAR
              description: 'The Certificate Signature (SHA1 Fingerprint or Thumbprint) is the hash of the entire certificate in DER form.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.sha1_fingerprint
              master_item:
                key: 'web.certificate.get[{#HOSTNAME},{#PORT},{#IP}]'
              tags:
                - tag: Cert
                  value: '{#DISPLAYNAME}'
              trigger_prototypes:
                - uuid: 338b145d0d334b549892cb170bde59db
                  expression: 'last(/Multiple Website certificate by Zabbix agent 2 - Discovery/cert.sha1_fingerprint[{#DISPLAYNAME}]) <> last(/Multiple Website certificate by Zabbix agent 2 - Discovery/cert.sha1_fingerprint[{#DISPLAYNAME}],#2)'
                  name: 'Cert {#DISPLAYNAME}: Fingerprint has changed'
                  event_name: 'Cert {#DISPLAYNAME}: Fingerprint has changed (new version: {ITEM.VALUE})'
                  opdata: '{ITEM.VALUE}'
                  priority: INFO
                  description: |
                    The SSL certificate fingerprint has changed. If you did not update the certificate, it may mean your certificate has been hacked. Acknowledge to close the problem manually.
                    There could be multiple valid certificates on some installations. In this case, the trigger will have a false positive. You can ignore it or disable the trigger.
                  manual_close: 'YES'
            - uuid: e9d3efece864445b8c33cf429d7f1979
              name: 'Cert {#DISPLAYNAME}: Signature algorithm'
              type: DEPENDENT
              key: 'cert.signature_algorithm[{#DISPLAYNAME}]'
              history: 7d
              value_type: CHAR
              description: 'The algorithm identifier for the algorithm used by the CA to sign the certificate.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.x509.signature_algorithm
              master_item:
                key: 'web.certificate.get[{#HOSTNAME},{#PORT},{#IP}]'
              tags:
                - tag: Cert
                  value: '{#DISPLAYNAME}'
            - uuid: de681771550a42199385c86f8a991ef7
              name: 'Cert {#DISPLAYNAME}: Subject'
              type: DEPENDENT
              key: 'cert.subject[{#DISPLAYNAME}]'
              history: 7d
              value_type: TEXT
              description: 'The field identifies the entity associated with the public key stored in the subject public key field.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.x509.subject
              master_item:
                key: 'web.certificate.get[{#HOSTNAME},{#PORT},{#IP}]'
              tags:
                - tag: Cert
                  value: '{#DISPLAYNAME}'
            - uuid: e3a49768e61d43c7bc26007c480a9e2a
              name: 'Cert {#DISPLAYNAME}: Validation result'
              type: DEPENDENT
              key: 'cert.validation[{#DISPLAYNAME}]'
              history: 7d
              trends: '0'
              description: 'The certificate validation result. Possible values: valid/invalid/valid-but-self-signed'
              valuemap:
                name: 'Cert validity'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.result.value
                - type: JAVASCRIPT
                  parameters:
                    - |
                      if (value === "valid") {
                          return 1;
                        } else if (value === "valid-but-self-signed") {
                          return 2;
                        } else if (value === "invalid") {
                          return 0;
                        } else {
                          return -1;
                        }
              master_item:
                key: 'web.certificate.get[{#HOSTNAME},{#PORT},{#IP}]'
              tags:
                - tag: Cert
                  value: '{#DISPLAYNAME}'
              trigger_prototypes:
                - uuid: 8ba08f6d512248ba846041f7acf5c998
                  expression: 'last(/Multiple Website certificate by Zabbix agent 2 - Discovery/cert.validation[{#DISPLAYNAME}])=0'
                  name: 'Cert {#DISPLAYNAME}: SSL certificate is invalid'
                  opdata: '{ITEM.VALUE}'
                  priority: HIGH
                  description: 'SSL certificate has expired or it is issued for another domain.'
            - uuid: 87da7e3d15f6459d938452b7160d9fbd
              name: 'Cert {#DISPLAYNAME}: Version'
              type: DEPENDENT
              key: 'cert.version[{#DISPLAYNAME}]'
              history: 7d
              value_type: CHAR
              description: 'The version of the encoded certificate.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.x509.version
              master_item:
                key: 'web.certificate.get[{#HOSTNAME},{#PORT},{#IP}]'
              tags:
                - tag: Cert
                  value: '{#DISPLAYNAME}'
            - uuid: 0b655ee53a2f4fb8bdeada7ab6fb5b18
              name: 'Cert {#DISPLAYNAME}: Get'
              key: 'web.certificate.get[{#HOSTNAME},{#PORT},{#IP}]'
              delay: 15m
              history: '0'
              value_type: TEXT
              description: 'Returns the JSON with attributes of a certificate of the requested site.'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              tags:
                - tag: Cert
                  value: '{#DISPLAYNAME}'
                - tag: RAW
          master_item:
            key: multiple.cert.list
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  // Cert LLD: CSV input to discovery JSON using macro-based default port
                  const CLogger = function(serviceName) {
                      this.serviceName = serviceName;
                      this.INFO = 4;
                      this.WARN = 3;
                      this.ERROR = 2;
                  
                      this.log = function(level, msg) {
                          Zabbix.log(level, '[' + this.serviceName + '] ' + msg);
                      };
                  };
                  
                  var log = new CLogger('CertDiscovery');
                  
                  // Macro will be replaced at runtime by Zabbix
                  var defaultPort = '{$CERT.DEFAULT.PORT}';
                  
                  // Fallback to hardcoded default if macro not filled
                  if (!defaultPort || defaultPort === '{$CERT.DEFAULT.PORT}') {
                      log.log(log.WARN, 'Macro {$CERT.DEFAULT.PORT} not set. Using fallback port 443');
                      defaultPort = '443';
                  }
                  
                  // Remove brackets and split list
                  var cleaned = value.replace(/[()]/g, '');
                  log.log(log.INFO, 'Cleaned input: ' + cleaned);
                  
                  var entries = cleaned.split(',');
                  var result = [];
                  
                  for (var i = 0; i < entries.length; i++) {
                      var parts = entries[i].split(':').map(function(s) { return s.trim(); });
                  
                      var hostname = parts[0];
                      var port = parts[1] || defaultPort;
                      var ip = parts[2] || '';
                  
                      // Skip and log error if both hostname and IP are missing
                      if (!hostname && !ip) {
                          log.log(log.ERROR, 'Invalid entry at index ' + i + ': Missing both hostname and IP');
                          continue;
                      }
                  
                      var display = hostname ? hostname : ip;
                      if (port) {
                          display += '_' + port;
                      }
                  
                      result.push({
                          "{#HOSTNAME}": hostname,
                          "{#PORT}": port,
                          "{#IP}": ip,
                          "{#DISPLAYNAME}": display
                      });
                  }
                  
                  var output = JSON.stringify(result);
                  log.log(log.INFO, 'Generated output: ' + output);
                  
                  return output;
      macros:
        - macro: '{$CERT.ARRAY}'
          value: '(<hostname1>:<port1>:<ip1>),(<hostname2>:<port2>:<ip2>)'
          description: 'Array of hostnames, IP addresses and ports. (edit outside'
        - macro: '{$CERT.DEFAULT.PORT}'
          value: '443'
          description: 'Default port if not specified'
        - macro: '{$CERT.EXPIRY.HIGH}'
          value: '7'
          description: 'Number of days until the certificate expires.'
        - macro: '{$CERT.EXPIRY.WARN}'
          value: '30'
          description: 'Number of days until the certificate expires.'
      dashboards:
        - uuid: 7d475a285060408dbac2de95eb425234
          name: 'Multiple Certificate Items'
          display_period: '60'
          auto_start: 'NO'
          pages:
            - widgets:
                - type: item
                  name: Info
                  width: '18'
                  fields:
                    - type: INTEGER
                      name: decimal_places
                      value: '0'
                    - type: INTEGER
                      name: desc_v_pos
                      value: '0'
                    - type: ITEM
                      name: itemid.0
                      value:
                        host: 'Multiple Website certificate by Zabbix agent 2 - Discovery'
                        key: multiple.cert.count
                    - type: INTEGER
                      name: show.0
                      value: '1'
                    - type: INTEGER
                      name: show.1
                      value: '2'
                - type: itemnavigator
                  name: Certificates
                  'y': '2'
                  width: '18'
                  height: '12'
                  fields:
                    - type: INTEGER
                      name: group_by.0.attribute
                      value: '3'
                    - type: STRING
                      name: group_by.0.tag_name
                      value: Cert
                    - type: STRING
                      name: items.0
                      value: 'Cert *: *'
                    - type: INTEGER
                      name: item_tags.0.operator
                      value: '5'
                    - type: STRING
                      name: item_tags.0.tag
                      value: RAW
                    - type: STRING
                      name: item_tags.0.value
                      value: ''
                    - type: STRING
                      name: reference
                      value: PJNEY
                    - type: INTEGER
                      name: state
                      value: '0'
                - type: item
                  name: Detail
                  'y': '14'
                  width: '18'
                  hide_header: 'YES'
                  fields:
                    - type: INTEGER
                      name: decimal_places
                      value: '0'
                    - type: INTEGER
                      name: desc_v_pos
                      value: '0'
                    - type: STRING
                      name: itemid._reference
                      value: PJNEY._itemid
                    - type: INTEGER
                      name: show.0
                      value: '1'
                    - type: INTEGER
                      name: show.1
                      value: '2'
                    - type: INTEGER
                      name: value_size
                      value: '30'
                - type: honeycomb
                  name: Lifespan
                  x: '18'
                  width: '54'
                  height: '8'
                  fields:
                    - type: INTEGER
                      name: interpolation
                      value: '1'
                    - type: STRING
                      name: items.0
                      value: 'Cert *: Days to Expire'
                    - type: STRING
                      name: primary_label
                      value: '{{ITEM.NAME}.regsub("Cert\s+(.*?):\s",\1)}'
                    - type: STRING
                      name: reference
                      value: MLWPM
                    - type: INTEGER
                      name: secondary_label_decimal_places
                      value: '0'
                    - type: STRING
                      name: thresholds.0.color
                      value: '000000'
                    - type: STRING
                      name: thresholds.0.threshold
                      value: '-500'
                    - type: STRING
                      name: thresholds.1.color
                      value: '000000'
                    - type: STRING
                      name: thresholds.1.threshold
                      value: '-1'
                    - type: STRING
                      name: thresholds.2.color
                      value: E65660
