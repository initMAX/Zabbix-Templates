        - uuid: 6f368abe72a14080bf20e17b4ec45fd7
          name: 'BambuLab: Current stage (text)'
          type: DEPENDENT
          key: bambulab.stage.current.text
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: 'Human-readable current stage derived from $.print.stg_cur.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var raw = (value === null || value === undefined) ? '' : String(value).trim();
                  if (raw === '') return 'unknown';
                  var id = parseInt(raw, 10);
                  if (isNaN(id)) return 'unknown';
                  
                  var map = {
                    '-1': 'idle',
                    '0': 'printing',
