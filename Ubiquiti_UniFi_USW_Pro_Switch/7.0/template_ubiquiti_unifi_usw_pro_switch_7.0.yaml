        - uuid: 51b4b328dba84b4e9cc2ce717c2d7105
          name: 'Hardware version'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.4413.1.1.1.1.1.6.0]'
          key: system.hw.version
          delay: 1h
          value_type: CHAR
          trends: '0'
          description: 'Enterprise 4413 - hardware revision'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
        - uuid: 486a95737b6d4a97ac3b86d90dacb22a
          name: 'System location'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.6.0]'
          key: 'system.location[sysLocation.0]'
          delay: 15m
          value_type: CHAR
          trends: '0'
          description: 'SNMPv2-MIB::sysLocation.0'
          inventory_link: LOCATION
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
        - uuid: c8e4cf66acda40a1afc7bfdb863d3d9e
          name: 'System name'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.5.0]'
          key: system.name
          delay: 15m
          value_type: CHAR
          trends: '0'
          description: 'SNMPv2-MIB::sysName.0'
          inventory_link: NAME
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 30b3068264ff400baf429a6fa22098fa
              expression: 'last(/Ubiquiti Unifi USW Pro Switch SNMP/system.name,#1)<>last(/Ubiquiti Unifi USW Pro Switch SNMP/system.name,#2)'
              name: 'Unifi Switch Pro: System name has changed'
              event_name: 'Unifi Switch Pro: System name has changed (new name: {ITEM.LASTVALUE1})'
              priority: INFO
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
        - uuid: a9fe8fb690ee4c6881549815f01c065b
          name: 'Uptime (network)'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.3.0]'
          key: 'system.net.uptime[sysUpTime.0]'
          delay: 30s
          value_type: FLOAT
          trends: '0'
          units: uptime
          description: 'SNMPv2-MIB::sysUpTime.0'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: fd0f3eb9eb9a413db74e825c8256685f
              expression: 'last(/Ubiquiti Unifi USW Pro Switch SNMP/system.net.uptime[sysUpTime.0])>0 and last(/Ubiquiti Unifi USW Pro Switch SNMP/system.net.uptime[sysUpTime.0])<600'
              name: 'Unifi Switch Pro: Device has been restarted'
              opdata: 'Uptime: {ITEM.LASTVALUE1}'
              priority: WARNING
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
        - uuid: 5c83427bb5ef4f25960a4cb0648cd277
          name: 'System object ID'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.2.0]'
          key: 'system.objectid[sysObjectID.0]'
          delay: 15m
          value_type: CHAR
          trends: '0'
          description: 'SNMPv2-MIB::sysObjectID.0'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
        - uuid: bd6991e9d37b4410b15cdfc8ad16038d
          name: 'Firmware version'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.4413.1.1.1.1.1.13.0]'
          key: system.sw.version
          delay: 1h
          value_type: CHAR
          trends: '0'
          description: 'Enterprise 4413 - firmware version'
          inventory_link: SOFTWARE_APP_A
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 06e14924993c4547bd2a72b84b92d6b5
              expression: 'last(/Ubiquiti Unifi USW Pro Switch SNMP/system.sw.version,#1)<>last(/Ubiquiti Unifi USW Pro Switch SNMP/system.sw.version,#2)'
              name: 'Unifi Switch Pro: Firmware version has changed'
              event_name: 'Unifi Switch Pro: Firmware version has changed (new version: {ITEM.LASTVALUE1})'
              priority: INFO
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
        - uuid: 48f1704ac4d6403eb9e93119ab3ec6ce
          name: 'Memory: Free'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.4413.1.1.1.1.4.1.0]'
          key: vm.memory.free
          units: B
          description: 'Enterprise 4413 - free memory in KB, converted to bytes'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1024'
          tags:
            - tag: component
              value: memory
        - uuid: 4de8e3d365e1478da6eb28bb9ea44919
          name: 'Memory: Total'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.4413.1.1.1.1.4.2.0]'
          key: vm.memory.total
          delay: 5m
          units: B
          description: 'Enterprise 4413 - total memory in KB, converted to bytes'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1024'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          tags:
            - tag: component
              value: memory
        - uuid: 54467d8681df490fb79207ec8a20de7b
          name: 'Memory: Utilization'
          type: CALCULATED
          key: vm.memory.util
          value_type: FLOAT
          units: '%'
          params: '(last(//vm.memory.total) - last(//vm.memory.free)) / last(//vm.memory.total) * 100'
          description: 'Memory utilization: (total - free) / total * 100'
          tags:
            - tag: component
              value: memory
          triggers:
            - uuid: b75c72e54eb042edbb0f15db7748d1d0
              expression: 'min(/Ubiquiti Unifi USW Pro Switch SNMP/vm.memory.util,5m)>{$MEMORY.UTIL.MAX}'
              name: 'Unifi Switch Pro: High memory utilization'
              event_name: 'Unifi Switch Pro: High memory utilization (>{$MEMORY.UTIL.MAX}% for 5m)'
              opdata: 'Current utilization: {ITEM.LASTVALUE1}%'
              priority: AVERAGE
              tags:
                - tag: scope
                  value: performance
        - uuid: 39b3b7c3a0a34a399aae089c675ff6ba
          name: 'SNMP agent availability'
          type: INTERNAL
          key: 'zabbix[host,snmp,available]'
          valuemap:
            name: zabbix.host.available
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: 16147c8fa412406882deca5d65810e49
              expression: 'max(/Ubiquiti Unifi USW Pro Switch SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              name: 'Unifi Switch Pro: No SNMP data collection'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: WARNING
              dependencies:
                - name: 'Unifi Switch Pro: Unavailable by ICMP ping'
                  expression: 'max(/Ubiquiti Unifi USW Pro Switch SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
      discovery_rules:
        - uuid: 765b428776ff44f98fc5cf48062d036a
          name: 'Network interfaces discovery'
          type: DEPENDENT
          key: net.if.discovery
          delay: '0'
          filter:
            evaltype: AND
            conditions:
              - macro: '{#IFDESCR}'
                value: '{$NET.IF.IFDESCR.MATCHES}'
                formulaid: A
              - macro: '{#IFDESCR}'
                value: '{$NET.IF.IFDESCR.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
              - macro: '{#IFNAME}'
                value: '{$NET.IF.IFNAME.MATCHES}'
                formulaid: C
              - macro: '{#IFNAME}'
                value: '{$NET.IF.IFNAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: D
          item_prototypes:
            - uuid: 45e3026886c14c7d9f89242b542efe35
              name: 'Interface {#IFNAME}({#IFALIAS}): Inbound packets discarded'
              type: DEPENDENT
              key: 'net.if.in.discards[ifInDiscards.{#SNMPINDEX}]'
              delay: '0'
              description: 'IF-MIB::ifInDiscards'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}'
                    - '0'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 3m
              master_item:
                key: net.if.walk
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: c5f76f9da3c44deeb43f3a735e59b3f0
              name: 'Interface {#IFNAME}({#IFALIAS}): Inbound packets with errors'
              type: DEPENDENT
              key: 'net.if.in.errors[ifInErrors.{#SNMPINDEX}]'
              delay: '0'
              description: 'IF-MIB::ifInErrors'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}'
                    - '0'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 3m
              master_item:
                key: net.if.walk
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
              trigger_prototypes:
                - uuid: d08b94556e0b479c915d787289629ca0
                  expression: 'min(/Ubiquiti Unifi USW Pro Switch SNMP/net.if.in.errors[ifInErrors.{#SNMPINDEX}],5m)>{$IF.ERRORS.WARN}'
                  name: 'Interface {#IFNAME}({#IFALIAS}): High inbound error rate'
                  event_name: 'Interface {#IFNAME}({#IFALIAS}): High inbound error rate (>{$IF.ERRORS.WARN} for 5m)'
                  opdata: 'Errors: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  manual_close: 'YES'
                  dependencies:
                    - name: 'Interface {#IFNAME}({#IFALIAS}): Link down'
                      expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/Ubiquiti Unifi USW Pro Switch SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2 and (last(/Ubiquiti Unifi USW Pro Switch SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/Ubiquiti Unifi USW Pro Switch SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#2))'
                      recovery_expression: 'last(/Ubiquiti Unifi USW Pro Switch SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0'
                  tags:
                    - tag: scope
                      value: performance
            - uuid: 96352c2b374043cbabcc7665987c3808
              name: 'Interface {#IFNAME}({#IFALIAS}): Bits received'
              type: DEPENDENT
              key: 'net.if.in[ifHCInOctets.{#SNMPINDEX}]'
              delay: '0'
              units: bps
              description: 'IF-MIB::ifHCInOctets - 64-bit input octet counter'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}'
                    - '0'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              master_item:
                key: net.if.walk
              tags:
                - tag: component
                  value: network
