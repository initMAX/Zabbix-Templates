          snmp_oid: 'get[1.3.6.1.4.1.52642.3.6.22.0]'
          key: system.status
          description: 'FS enterprise MIB - switchOperState'
          valuemap:
            name: 'FS-MIB::switchOperState'
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 22b5e31ed5a44fc6a3ba3f6e05d0f5a0
              expression: 'last(/FS Switch S3400 SNMP/system.status)=5'
              name: 'FS Switch: System in critical state'
