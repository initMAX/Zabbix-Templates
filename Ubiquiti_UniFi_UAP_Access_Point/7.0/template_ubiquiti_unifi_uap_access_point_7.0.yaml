          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.10002.1.1.1.1.4.0]'
          key: vm.memory.cached
          units: B
          description: 'Cached memory in KB (enterprises.10002), converted to bytes'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1024'
          tags:
            - tag: component
              value: memory
        - uuid: 33a8ee97163845918df1daea08f787bf
          name: 'Memory: Free'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.10002.1.1.1.1.2.0]'
          key: vm.memory.free
          units: B
          description: 'Free memory in KB (enterprises.10002), converted to bytes'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1024'
          tags:
            - tag: component
              value: memory
        - uuid: 90e6ce1b82d840a1a60589c30354f9d8
          name: 'Memory: Total'
