        - uuid: 6a5a144011664fe3bcd9ac2e7eb6c0e4
          name: 'CPU utilization (5 min)'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.4413.1.1.1.1.4.13.0]'
          key: system.cpu.util.5min
          value_type: FLOAT
          units: '%'
          description: 'Enterprise 4413 - CPU utilization 300 second average'
          tags:
            - tag: component
