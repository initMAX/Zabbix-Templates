                  name: 'Forced Writes disabled on {#FIREBIRD.DB.NAME}'
                  priority: HIGH
            - uuid: b294013b394e412d8448ca74dc38d05a
              name: 'Page fetches on {#FIREBIRD.DB.NAME}'
              key: 'fbdb[{$FIREBIRD.CONNSTRING},{#FIREBIRD.DB.PATH},{$FIREBIRD.USER},{$FIREBIRD.PASSWORD},iostat_fetches]'
