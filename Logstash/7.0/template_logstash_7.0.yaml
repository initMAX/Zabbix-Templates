          tags:
            - tag: Logstash
        - uuid: ae6dfc33cb42497b8edd01a33e2dd2ac
          name: 'Max file descriptors'
          type: DEPENDENT
          key: logstash.process.max_fd
          delay: '0'
          history: 7d
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.process.max_file_descriptors
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: logstash
          tags:
            - tag: Logstash
        - uuid: 3a82b8ced4124f65aabab86e8bcde125
          name: 'File descriptors usage'
          type: DEPENDENT
          key: logstash.process.fd.pct
          delay: '0'
          history: 7d
          value_type: FLOAT
          units: '%'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  var open_fd = data.process.open_file_descriptors;
                  var max_fd = data.process.max_file_descriptors;
                  return max_fd > 0 ? (open_fd / max_fd * 100).toFixed(2) : 0;
          master_item:
            key: logstash
          tags:
            - tag: Logstash
          triggers:
            - uuid: 9213fab39d4b466998eb3a0a57b54c63
              expression: 'last(/Logstash/logstash.process.fd.pct)>{$LOGSTASH.FD.WARN}'
              name: 'File descriptors running low'
              event_name: 'File descriptor usage is above {$LOGSTASH.FD.WARN}%'
              opdata: 'FD usage: {ITEM.LASTVALUE}'
              priority: WARNING
        - uuid: ea4b8e4717e0495e9480d043c9ad18ab
