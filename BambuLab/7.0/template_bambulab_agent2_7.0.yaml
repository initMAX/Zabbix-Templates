        - uuid: 69d3241bbb3443a1b810d21be95ab346
          name: 'BambuLab: Print stage (text)'
          type: DEPENDENT
          key: bambulab.mc_print_stage.text
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: |
            Human-readable print stage derived from 'Print stage'.
            
            Common interpretation:
