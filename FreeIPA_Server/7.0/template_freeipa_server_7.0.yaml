      discovery_rules:
        - uuid: 502eaabeeda548c3a74f7d98d2dd8759
          name: 'IPA healthcheck checks discovery'
          type: DEPENDENT
          key: ipa.healthcheck.checks.discovery
          delay: '0'
          description: 'Discover ipa-healthcheck checks (source + check + identifier).'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  function entryId(d) {
                      var kw = d.kw || {};
                      return kw.key || kw.store || kw.path || kw.service || kw.cn || kw.name || kw.id || kw.rid || kw.hostname || kw.issuer || kw.subject || kw.serial || kw.dn || kw.realm || kw.suffix || kw.profile || kw.server || kw.ipaddr || kw.ip_address || '';
                  }
                  function details(entry) {
                      if (!entry || !Object.keys(entry).length) return '';
                      try { return JSON.stringify(entry, null, 2); } catch (e) { return ''; }
                  }
                  var data;
                  try { data = JSON.parse(value); } catch (e) { data = []; }
                  if (!Array.isArray(data)) data = [];
                  var seen = {};
                  var out = { data: [] };
                  for (var i = 0; i < data.length; i++) {
                      var d = data[i];
                      var src = d.source || '';
                      var check = d.check || '';
                      if (!src || !check) continue;
                      var id = entryId(d);
                      var key = src + '|' + check + '|' + id;
                      if (seen[key]) continue;
                      seen[key] = true;
                      var short = src;
                      if (short.indexOf('ipahealthcheck.') === 0) {
                          short = short.substring('ipahealthcheck.'.length);
                      }
                      var idLabel = id ? ' - ' + id : '';
                      out.data.push({
                          "{#SOURCE}": src,
                          "{#SOURCE_SHORT}": short,
                          "{#CHECK}": check,
                          "{#ID}": id,
                          "{#ID_LABEL}": idLabel,
                          "{#DETAILS}": details(d)
                      });
                  }
                  return JSON.stringify(out);
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: ipa.raw
          item_prototypes:
            - uuid: a11be818e27e4f628e06040ee1cd10ae
              name: 'IPA {#SOURCE_SHORT}: {#CHECK}{#ID_LABEL}'
              type: DEPENDENT
              key: 'ipa.healthcheck.result["{#SOURCE}","{#CHECK}","{#ID}"]'
              delay: '0'
              value_type: CHAR
              trends: '0'
              description: |
                Source: {#SOURCE}
                Check: {#CHECK}
                Details (entry):
                {#DETAILS}
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      function entryId(d) {
                          var kw = d.kw || {};
                          return kw.key || kw.store || kw.path || kw.service || kw.cn || kw.name || kw.id || kw.rid || kw.hostname || kw.issuer || kw.subject || kw.serial || kw.dn || kw.realm || kw.suffix || kw.profile || kw.server || kw.ipaddr || kw.ip_address || '';
                      }
                      var data;
                      try { data = JSON.parse(value); } catch (e) { data = []; }
                      if (!Array.isArray(data)) return '';
                      var src = '{#SOURCE}';
                      var check = '{#CHECK}';
                      var id = '{#ID}';
                      var seen = false;
                      var status = 'SUCCESS';
                      for (var i = 0; i < data.length; i++) {
                          var d = data[i];
                          if (d.source !== src || d.check !== check) continue;
                          if (entryId(d) !== id) continue;
                          seen = true;
                          if (d.result && d.result !== 'SUCCESS') return d.result;
                          if (!d.result) status = '';
                      }
                      return seen ? status : '';
              master_item:
                key: ipa.raw
              tags:
                - tag: FreeIPA
                - tag: FreeIPA
                  value: '{#SOURCE_SHORT}'
              trigger_prototypes:
                - uuid: 0f7bb95e0324446e9d5c9865580fee80
                  expression: 'last(/FreeIPA Server/ipa.healthcheck.result["{#SOURCE}","{#CHECK}","{#ID}"])="WARNING"'
                  name: 'FreeIPA Server {#SOURCE_SHORT}: {#CHECK}{#ID_LABEL} is WARNING'
                  priority: WARNING
                  description: |
                    Source: {#SOURCE}
                    Check: {#CHECK}
                    Details (entry):
                    {#DETAILS}
                    Note: Derived from LLD data and may be stale until discovery refreshes.
                  tags:
                    - tag: FreeIPA
                    - tag: FreeIPA
                      value: '{#SOURCE_SHORT}'
                - uuid: 8e9163d1fa7a4edca3d970d6dcaa83d6
                  expression: 'last(/FreeIPA Server/ipa.healthcheck.result["{#SOURCE}","{#CHECK}","{#ID}"])="ERROR"'
                  name: 'FreeIPA Server {#SOURCE_SHORT}: {#CHECK}{#ID_LABEL} is ERROR'
                  priority: HIGH
                  description: |
                    Source: {#SOURCE}
                    Check: {#CHECK}
                    Details (entry):
                    {#DETAILS}
                    Note: Derived from LLD data and may be stale until discovery refreshes.
                  tags:
                    - tag: FreeIPA
                    - tag: FreeIPA
                      value: '{#SOURCE_SHORT}'
                - uuid: 8e4dbb8c28c048b08459835950c3d3dc
                  expression: 'last(/FreeIPA Server/ipa.healthcheck.result["{#SOURCE}","{#CHECK}","{#ID}"])="CRITICAL"'
                  name: 'FreeIPA Server {#SOURCE_SHORT}: {#CHECK}{#ID_LABEL} is CRITICAL'
                  priority: DISASTER
                  description: |
                    Source: {#SOURCE}
                    Check: {#CHECK}
                    Details (entry):
                    {#DETAILS}
                    Note: Derived from LLD data and may be stale until discovery refreshes.
                  tags:
                    - tag: FreeIPA
                    - tag: FreeIPA
                      value: '{#SOURCE_SHORT}'
