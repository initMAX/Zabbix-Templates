# ClamAV by Zabbix agent - initMAX s.r.o.
# Prints `sigtool --info` of the daily signature database. freshclam replaces daily.cvd with the
# incremental daily.cld after the first update, so the newer file wins when both forms exist.
UserParameter=clamav.status,f=/var/lib/clamav/daily.cld; [ -f "$f" ] || f=/var/lib/clamav/daily.cvd; /usr/bin/sigtool --info "$f"
