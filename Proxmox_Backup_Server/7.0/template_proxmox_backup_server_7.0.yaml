zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 612cd71d525444e8a35d3ec35f6272ee
      name: Templates/initMAX
  templates:
    - uuid: b0f6fd01a42e4ed5bbc69eed0f0c1799
      template: 'Proxmox Backup Server by HTTP'
      name: 'Proxmox Backup Server by HTTP'
      description: |
        More of our templates can be found on https://git.initmax.cz/initMAX-Public/zabbix-templates
        
        Developed by initMAX s.r.o.
        https://www.initmax.com
      vendor:
        name: 'initMAX s.r.o.'
        version: 7.0-0
      groups:
        - name: Templates/initMAX
      items:
        - uuid: 551cec829eb542e49ed110ea2c3513dc
          name: 'API service status'
          type: SCRIPT
          key: pbs.api.available
          delay: 5m
          history: 7d
          trends: '0'
          params: |
            try {
                var params = JSON.parse(value);
                var req = new HttpRequest();
                req.addHeader('Authorization: PBSAPIToken=' + params.token + ':' + params.secret);
                req.get(encodeURI('https://' + params.url + ':' + params.port + '/api2/json/version'));
            } catch (error) {
                Zabbix.log(3, 'Proxmox Backup Server API failed: ' + params.url + ' Error: ' + error);
                if (!Number.isInteger(error))
                    return 520;
            }
            return req.getStatus();
          description: 'Get API service status (HTTP response code of the /version endpoint).'
          valuemap:
            name: 'HTTP response status code'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          timeout: 10s
          parameters:
            - name: port
              value: '{$PBS.URL.PORT}'
            - name: secret
              value: '{$PBS.TOKEN.SECRET}'
            - name: token
              value: '{$PBS.TOKEN.ID}'
            - name: url
              value: '{$PBS.URL.HOST}'
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 8d373327cefe4a07bac243014e29622e
              expression: 'last(/Proxmox Backup Server by HTTP/pbs.api.available)<>200'
              name: 'Proxmox Backup Server: API service not available'
              priority: HIGH
              description: 'The API service is not available. Check your network and authorization settings.'
              tags:
                - tag: scope
                  value: availability
        - uuid: 1f6f7d8b5d9c43c6948e881c5c802a7d
          name: 'Get datastore usage'
          type: HTTP_AGENT
          key: pbs.datastore.usage
          delay: 5m
          history: '0'
          value_type: TEXT
          trends: '0'
          description: 'List of datastores with usage statistics (master item for datastore discovery).'
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
              error_handler: CUSTOM_VALUE
              error_handler_params: 'Error getting data'
          timeout: 15s
          url: 'https://{$PBS.URL.HOST}:{$PBS.URL.PORT}/api2/json/status/datastore-usage'
          headers:
            - name: Authorization
              value: 'PBSAPIToken={$PBS.TOKEN.ID}:{$PBS.TOKEN.SECRET}'
          tags:
            - tag: component
              value: raw
        - uuid: cb1cc48d864e4b18bea71e64346e3345
          name: 'CPU utilization'
          type: DEPENDENT
          key: pbs.node.cpu
          delay: '0'
          history: 7d
          value_type: FLOAT
          units: '%'
          description: 'Host CPU utilization in percent.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.data.cpu
            - type: MULTIPLIER
              parameters:
                - '100'
          master_item:
            key: pbs.node.status
          tags:
            - tag: component
              value: cpu
          triggers:
            - uuid: 96753fcddc05451e83c13b535918680f
              expression: 'min(/Proxmox Backup Server by HTTP/pbs.node.cpu,5m)>{$PBS.CPU.UTIL.MAX.WARN}'
              name: 'Proxmox Backup Server: High CPU utilization'
              priority: WARNING
              description: 'Host CPU utilization has been above the threshold for 5 minutes.'
              tags:
                - tag: scope
                  value: performance
        - uuid: d2848cf295284ed9a250165d1c156a7e
