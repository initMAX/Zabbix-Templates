                  value: '{#AMS_ID}'
                - tag: component
                  value: ams
                - tag: tray
                  value: '{#TRAY_ID}'
            - uuid: e0339f5acd9540cb92e1f7e0deeba68b
              name: 'AMS {#AMS_ID} Tray {#TRAY_ID}: Remaining'
              type: DEPENDENT
              key: 'bambulab.ams.tray.remain[{#AMS_ID},{#TRAY_ID}]'
              delay: '0'
              units: '%'
              description: 'Remaining filament percentage for this tray slot (field: remain).'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.remain
                  error_handler: DISCARD_VALUE
              master_item:
                key: 'bambulab.ams.tray.data[{#AMS_ID},{#TRAY_ID}]'
              tags:
                - tag: ams
                  value: '{#AMS_ID}'
                - tag: component
                  value: ams
                - tag: tray
                  value: '{#TRAY_ID}'
            - uuid: 7e766c93786a41928ddda8d523d30865
              name: 'AMS {#AMS_ID} Tray {#TRAY_ID}: State'
              type: DEPENDENT
              key: 'bambulab.ams.tray.state[{#AMS_ID},{#TRAY_ID}]'
              delay: '0'
              description: |
                Tray state code (field: state).
                
                Note: this field is not reliable on its own for determining Empty vs Loaded.
                For a more stable status, use the derived items 'Status' / 'Is empty'
                (based on tray_type, tag_uid and remain).
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.state
                  error_handler: DISCARD_VALUE
              master_item:
                key: 'bambulab.ams.tray.data[{#AMS_ID},{#TRAY_ID}]'
              tags:
                - tag: ams
                  value: '{#AMS_ID}'
                - tag: component
                  value: ams
                - tag: tray
                  value: '{#TRAY_ID}'
            - uuid: 8228d88a02b341a4aa434b011248ad86
              name: 'AMS {#AMS_ID} Tray {#TRAY_ID}: Status'
              type: DEPENDENT
              key: 'bambulab.ams.tray.status[{#AMS_ID},{#TRAY_ID}]'
              delay: '0'
              value_type: CHAR
              trends: '0'
              description: |
                Derived tray status label.
                
                - Empty: tray_type is missing/empty (or tag_uid is all zeros and remain is -1)
                - Loaded: tray_type is present
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      function safeParse(s) {
                        if (s === null || s === undefined) return null;
                        s = String(s).replace(/\u0000/g, '').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
                        var start = s.indexOf('{');
                        var end = s.lastIndexOf('}');
                        if (start === -1 || end === -1 || end <= start) return null;
                        try { return JSON.parse(s.substring(start, end + 1)); } catch (e) { return null; }
                      }
                      var t = safeParse(value) || {};
                      var trayType = (t.tray_type === null || t.tray_type === undefined) ? '' : String(t.tray_type).trim();
                      var tag = (t.tag_uid === null || t.tag_uid === undefined) ? '' : String(t.tag_uid).trim();
                      var remain = (t.remain === null || t.remain === undefined) ? null : parseInt(t.remain, 10);
                      var tagZeros = (tag === '0000000000000000');
                      if (trayType === '' || (tagZeros && remain === -1)) return 'Empty';
                      return 'Loaded';
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: 'bambulab.ams.tray.data[{#AMS_ID},{#TRAY_ID}]'
              tags:
                - tag: ams
                  value: '{#AMS_ID}'
                - tag: component
                  value: ams
                - tag: tray
                  value: '{#TRAY_ID}'
            - uuid: 19461815543c479d86ec2006eaec9496
              name: 'AMS {#AMS_ID} Tray {#TRAY_ID}: Sub brand'
              type: DEPENDENT
              key: 'bambulab.ams.tray.sub_brand[{#AMS_ID},{#TRAY_ID}]'
              delay: '0'
              value_type: CHAR
              trends: '0'
              description: 'Filament sub-brand / profile name for this tray slot (field: tray_sub_brands).'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.tray_sub_brands
                  error_handler: DISCARD_VALUE
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: 'bambulab.ams.tray.data[{#AMS_ID},{#TRAY_ID}]'
              tags:
                - tag: ams
                  value: '{#AMS_ID}'
                - tag: component
                  value: ams
                - tag: tray
                  value: '{#TRAY_ID}'
            - uuid: 1ba8a69613c94c968f70689dd22bccce
              name: 'AMS {#AMS_ID} Tray {#TRAY_ID}: Type'
              type: DEPENDENT
              key: 'bambulab.ams.tray.type[{#AMS_ID},{#TRAY_ID}]'
              delay: '0'
              value_type: CHAR
              trends: '0'
              description: 'Filament type for this tray slot (field: tray_type).'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.tray_type
                  error_handler: DISCARD_VALUE
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: 'bambulab.ams.tray.data[{#AMS_ID},{#TRAY_ID}]'
              tags:
                - tag: ams
                  value: '{#AMS_ID}'
                - tag: component
                  value: ams
                - tag: tray
                  value: '{#TRAY_ID}'
          master_item:
            key: 'bambulab.get["{$BAMBU_URL}","device/{$BAMBU_SN}/report","{$BAMBU_USER}","{$BAMBU_PASS}"]'
          lld_macro_paths:
            - lld_macro: '{#AMS_ID}'
              path: $.ams_id
            - lld_macro: '{#TRAY_ID}'
              path: $.tray_id
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  try {
                    var root = JSON.parse(value);
                    var amsList = (root && root.print && root.print.ams && root.print.ams.ams) ? root.print.ams.ams : [];
                    var out = [];
                  
                    for (var i = 0; i < amsList.length; i++) {
                      var ams = amsList[i] || {};
                      var amsId = String(ams.id);
                      var trays = Array.isArray(ams.tray) ? ams.tray : [];
                  
                      for (var j = 0; j < trays.length; j++) {
                        var tray = trays[j] || {};
                        out.push({ ams_id: amsId, tray_id: String(tray.id) });
                      }
                    }
                  
                    return JSON.stringify(out);
                  } catch (e) {
                    return '[]';
                  }
