              error_handler: DISCARD_VALUE
        - uuid: 3fce8e9bb4474e8f83e0caf411ed43a4
          name: 'BambuLab: AMS trays discovery'
          type: DEPENDENT
          key: bambulab.ams.trays.discovery
          delay: '0'
          description: 'Discover AMS trays (all AMS units, all tray slots).'
          item_prototypes:
            - uuid: 49680de751884bdeada73f077362eeff
              name: 'AMS {#AMS_ID} Tray {#TRAY_ID}: Color'
              type: DEPENDENT
              key: 'bambulab.ams.tray.color[{#AMS_ID},{#TRAY_ID}]'
              delay: '0'
              value_type: CHAR
              trends: '0'
              description: 'Filament color as #RRGGBB, derived from tray_color (RRGGBBAA).'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.tray_color
                  error_handler: DISCARD_VALUE
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var s = (value === null || value === undefined) ? '' : String(value).trim();
                      if (/^[0-9A-Fa-f]{8}$/.test(s)) {
                        return '#' + s.substring(0, 6).toUpperCase();
                      }
                      if (/^[0-9A-Fa-f]{6}$/.test(s)) {
                        return '#' + s.toUpperCase();
                      }
                      if (/^#[0-9A-Fa-f]{6}$/.test(s)) {
                        return s.toUpperCase();
                      }
                      return s;
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: 'bambulab.ams.tray.data[{#AMS_ID},{#TRAY_ID}]'
              tags:
                - tag: ams
                  value: '{#AMS_ID}'
                - tag: component
                  value: ams
                - tag: tray
                  value: '{#TRAY_ID}'
            - uuid: b5edfdd4cc5d4fff9c1c5a1e57dde3f0
              name: 'AMS {#AMS_ID} Tray {#TRAY_ID}: Color label'
              type: DEPENDENT
              key: 'bambulab.ams.tray.color_label[{#AMS_ID},{#TRAY_ID}]'
              delay: '0'
              value_type: CHAR
              trends: '0'
              description: 'Text label for dashboards: color swatch + hex (e.g. 🟧 #FF6A13).'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.tray_color
                  error_handler: DISCARD_VALUE
                - type: JAVASCRIPT
                  parameters:
                    - |
                      function clamp01(x) { return Math.max(0, Math.min(1, x)); }
                      function hexToRgb(hex) {
                        var m = /^#?([0-9A-Fa-f]{6})$/.exec(hex);
                        if (!m) return null;
                        var v = m[1];
                        return {
                          r: parseInt(v.substring(0, 2), 16),
                          g: parseInt(v.substring(2, 4), 16),
                          b: parseInt(v.substring(4, 6), 16)
                        };
                      }
                      function rgbToHsv(r, g, b) {
                        var rn = r / 255, gn = g / 255, bn = b / 255;
                        var max = Math.max(rn, gn, bn), min = Math.min(rn, gn, bn);
                        var d = max - min;
                        var h = 0;
                        if (d !== 0) {
                          if (max === rn) h = ((gn - bn) / d) % 6;
                          else if (max === gn) h = ((bn - rn) / d) + 2;
                          else h = ((rn - gn) / d) + 4;
                          h *= 60;
                          if (h < 0) h += 360;
                        }
                        var s = (max === 0) ? 0 : d / max;
                        var v = max;
                        return { h: h, s: s, v: v };
                      }
                      
                      var raw = (value === null || value === undefined) ? '' : String(value).trim().toUpperCase();
                      if (raw === '') return '';
                      
                      raw = raw.replace(/^#/, '');
                      if (/^[0-9A-F]{8}$/.test(raw)) raw = raw.substring(0, 6);
                      if (/^[0-9A-F]{6}$/.test(raw)) raw = '#' + raw;
                      
                      var rgb = hexToRgb(raw);
                      if (!rgb) return '■ ' + raw;
                      
                      var hsv = rgbToHsv(rgb.r, rgb.g, rgb.b);
                      var sat = clamp01(hsv.s);
                      var val = clamp01(hsv.v);
                      
                      var swatch = '■';
                      if (sat < 0.12) {
                        swatch = (val < 0.35) ? '⬛' : '⬜';
                      } else {
                        var h = hsv.h;
                        if (h < 15 || h >= 345) swatch = '🟥';
                        else if (h < 45) swatch = '🟧';
                        else if (h < 75) swatch = '🟨';
                        else if (h < 165) swatch = '🟩';
                        else if (h < 255) swatch = '🟦';
                        else swatch = '🟪';
                      }
                      
                      return swatch + ' ' + raw;
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: 'bambulab.ams.tray.data[{#AMS_ID},{#TRAY_ID}]'
              tags:
                - tag: ams
                  value: '{#AMS_ID}'
                - tag: component
                  value: ams
                - tag: tray
                  value: '{#TRAY_ID}'
            - uuid: abb81d0b28024d00ae4a8e4c6d53783f
              name: 'AMS {#AMS_ID} Tray {#TRAY_ID}: Get data'
              type: DEPENDENT
              key: 'bambulab.ams.tray.data[{#AMS_ID},{#TRAY_ID}]'
              delay: '0'
              history: '0'
              value_type: TEXT
              trends: '0'
              description: 'Raw tray JSON object for AMS {#AMS_ID}, tray slot {#TRAY_ID}.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.print.ams.ams[?(@.id == "{#AMS_ID}")].tray[?(@.id == "{#TRAY_ID}")].first()'
                  error_handler: DISCARD_VALUE
              master_item:
                key: 'bambulab.get["{$BAMBU_URL}","device/{$BAMBU_SN}/report","{$BAMBU_USER}","{$BAMBU_PASS}"]'
              tags:
                - tag: ams
                  value: '{#AMS_ID}'
                - tag: component
                  value: ams
                - tag: component
                  value: raw
                - tag: tray
                  value: '{#TRAY_ID}'
            - uuid: c4b835667ada451c8de1d482ba296a88
              name: 'AMS {#AMS_ID} Tray {#TRAY_ID}: Is empty'
              type: DEPENDENT
              key: 'bambulab.ams.tray.empty[{#AMS_ID},{#TRAY_ID}]'
              delay: '0'
              description: |
                Derived empty flag for this tray slot (0/1).
                
                Heuristic:
                - Empty if tray_type is missing/empty
                - OR tag_uid is all zeros and remain is -1
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      function safeParse(s) {
                        if (s === null || s === undefined) return null;
                        s = String(s).replace(/\u0000/g, '').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
                        var start = s.indexOf('{');
                        var end = s.lastIndexOf('}');
                        if (start === -1 || end === -1 || end <= start) return null;
                        try { return JSON.parse(s.substring(start, end + 1)); } catch (e) { return null; }
                      }
                      var t = safeParse(value) || {};
                      var trayType = (t.tray_type === null || t.tray_type === undefined) ? '' : String(t.tray_type).trim();
                      var tag = (t.tag_uid === null || t.tag_uid === undefined) ? '' : String(t.tag_uid).trim();
                      var remain = (t.remain === null || t.remain === undefined) ? null : parseInt(t.remain, 10);
                      var tagZeros = (tag === '0000000000000000');
                      if (trayType === '') return 1;
                      if (tagZeros && remain === -1) return 1;
                      return 0;
              master_item:
                key: 'bambulab.ams.tray.data[{#AMS_ID},{#TRAY_ID}]'
              tags:
                - tag: ams
                  value: '{#AMS_ID}'
                - tag: component
                  value: ams
                - tag: tray
                  value: '{#TRAY_ID}'
            - uuid: 95081290f2d349ea9af52703d020d2ee
              name: 'AMS {#AMS_ID} Tray {#TRAY_ID}: Material'
              type: DEPENDENT
              key: 'bambulab.ams.tray.material[{#AMS_ID},{#TRAY_ID}]'
              delay: '0'
              value_type: CHAR
              trends: '0'
              description: 'Combined filament label for this tray slot (tray_type + tray_sub_brands).'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      function safeParse(s) {
                        if (s === null || s === undefined) return null;
                        s = String(s).replace(/\u0000/g, '').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
                        var start = s.indexOf('{');
                        var end = s.lastIndexOf('}');
                        if (start === -1 || end === -1 || end <= start) return null;
                        try { return JSON.parse(s.substring(start, end + 1)); } catch (e) { return null; }
                      }
                      var t = safeParse(value) || {};
                      var trayType = (t.tray_type === null || t.tray_type === undefined) ? '' : String(t.tray_type).trim();
                      var subBrand = (t.tray_sub_brands === null || t.tray_sub_brands === undefined) ? '' : String(t.tray_sub_brands).trim();
                      if (trayType === '' && subBrand === '') return '';
                      if (trayType === '') return subBrand;
                      if (subBrand === '') return trayType;
                      return trayType + ' - ' + subBrand;
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: 'bambulab.ams.tray.data[{#AMS_ID},{#TRAY_ID}]'
              tags:
                - tag: ams
                  value: '{#AMS_ID}'
                - tag: component
                  value: ams
                - tag: tray
                  value: '{#TRAY_ID}'
            - uuid: 8f012649acfb4a4e9b0645b3c20d09c6
              name: 'AMS {#AMS_ID} Tray {#TRAY_ID}: Nozzle temp max'
              type: DEPENDENT
              key: 'bambulab.ams.tray.nozzle_temp_max[{#AMS_ID},{#TRAY_ID}]'
              delay: '0'
              units: °C
              description: 'Recommended maximum nozzle temperature for this filament (field: nozzle_temp_max).'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.nozzle_temp_max
                  error_handler: DISCARD_VALUE
              master_item:
                key: 'bambulab.ams.tray.data[{#AMS_ID},{#TRAY_ID}]'
              tags:
                - tag: ams
                  value: '{#AMS_ID}'
                - tag: component
                  value: ams
                - tag: tray
                  value: '{#TRAY_ID}'
            - uuid: 73345479a384442ab56de4e1f760f67d
              name: 'AMS {#AMS_ID} Tray {#TRAY_ID}: Nozzle temp min'
              type: DEPENDENT
              key: 'bambulab.ams.tray.nozzle_temp_min[{#AMS_ID},{#TRAY_ID}]'
              delay: '0'
              units: °C
              description: 'Recommended minimum nozzle temperature for this filament (field: nozzle_temp_min).'
              preprocessing:
                - type: JSONPATH
