        - uuid: 71276103c6fb4658a59bc2b9bec0502e
          name: 'JVM heap used percent'
          type: DEPENDENT
          key: logstash.jvm.mem.heap.used.pct
          delay: '0'
          history: 7d
          units: '%'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.jvm.mem.heap_used_percent
          master_item:
            key: logstash
          tags:
            - tag: Logstash
          triggers:
            - uuid: 5ec13ea6eee24a35bcef4554f5fc6894
              expression: 'last(/Logstash/logstash.jvm.mem.heap.used.pct)>{$LOGSTASH.HEAP.WARN}'
              name: 'JVM heap usage is high'
              event_name: 'JVM heap usage is above {$LOGSTASH.HEAP.WARN}%'
              opdata: 'Heap: {ITEM.LASTVALUE}'
              priority: WARNING
              dependencies:
                - name: 'JVM heap usage is critical'
