        - macro: '{$CPU_IDLE_WARN}'
          value: '15'
          description: 'CPU idle warning threshold (%). Example: 10'
        - macro: '{$DISK_UTIL_HIGH}'
          value: '90'
          description: 'Disk utilization critical threshold (%). Example: 95'
        - macro: '{$DISK_UTIL_WARN}'
          value: '80'
          description: 'Disk utilization warning threshold (%). Example: 85'
        - macro: '{$HRSTORAGE.DESCR.MATCHES}'
          value: '.*'
          description: 'LLD include filter for volumes ({#IFDESCR} regex). Example: ^/volume'
        - macro: '{$HRSTORAGE.DESCR.NOT_MATCHES}'
          value: '^(Physical memory|Virtual memory|Cached memory|Shared memory|Memory buffers|Swap space|Available memory|Free memory)$|^/volume[^/]+/@appdata|^/volume[^/]+/@docker'
          description: 'LLD exclude filter for volumes ({#IFDESCR} regex). Default excludes memory/swap entries and @appdata/@docker. Example: ^/volume1/.snapshot'
        - macro: '{$HRSTORAGE.TYPE.MATCHES}'
          value: '.*'
          description: 'LLD include filter for storage types ({#IFTYPE} regex). Default disabled; prefer {#IFDESCR}. Example: ^1\\.3\\.6\\.1\\.2\\.1\\.25\\.2\\.1\\.(1|4|9|10)$'
        - macro: '{$HRSTORAGE.TYPE.NOT_MATCHES}'
          value: '^$'
          description: 'LLD exclude filter for storage types ({#IFTYPE} regex). Default disabled; prefer {#IFDESCR}. Example: ^1\\.3\\.6\\.1\\.2\\.1\\.25\\.2\\.1\\.(2|3|8)$'
        - macro: '{$ICMP_LOSS_WARN}'
          value: '20'
          description: 'ICMP loss warning threshold (%). Example: 10'
        - macro: '{$ICMP_RESPONSE_TIME_WARN}'
          value: '0.15'
          description: 'ICMP response time warning threshold (s). Example: 0.25'
        - macro: '{$IFNAME.MATCHES}'
          value: '.*'
          description: 'LLD include filter for interfaces ({#IFNAME} regex). Example: ^(bond|eth)'
        - macro: '{$IFNAME.NOT_MATCHES}'
          value: '^$'
          description: 'LLD exclude filter for interfaces ({#IFNAME} regex). Example: ^(lo|veth)'
        - macro: '{$SYNO_DEVICE.MATCHES}'
          value: '.*'
          description: 'LLD include filter for devices ({#SNMPVALUE} regex). Example: ^sd'
        - macro: '{$SYNO_DEVICE.NOT_MATCHES}'
          value: '^$'
          description: 'LLD exclude filter for devices ({#SNMPVALUE} regex). Example: ^nvme'
        - macro: '{$SYNO_DISK_TEMP_WARN}'
          value: '60'
          description: 'Disk temperature warning threshold (C). Example: 55'
        - macro: '{$SYNO_TEMP_WARN}'
          value: '60'
          description: 'System temperature warning threshold (C). Example: 55'
