                  parameters:
                    - |
                      var data;
                      try { data = JSON.parse(value); } catch (e) { return ''; }
                      if (!Array.isArray(data)) return '';
                      for (var i = 0; i < data.length; i++) {
                        if (data[i].name === '{#PKG.NAME}') {
                          return (data[i].installtime && data[i].installtime.value) ? data[i].installtime.value : '';
                        }
                      }
                      return '';
              master_item:
