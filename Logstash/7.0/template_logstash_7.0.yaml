          triggers:
            - uuid: 3cad361f10274cd38897cae59c2499b8
              expression: 'last(/Logstash/logstash.reloads.failures)>0'
              name: 'Config reload failure detected'
              priority: WARNING
      discovery_rules:
        - uuid: 56a1c8f808ad43b9ad60ddfe847d29eb
          name: 'Pipeline discovery'
          type: DEPENDENT
          key: logstash.pipeline.discovery
          delay: '0'
          lifetime_type: DELETE_NEVER
          lifetime: '0'
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: 834254bdc92943bdba74a17cef36e5d3
              name: 'Pipeline {#PIPELINE}: events in'
              type: DEPENDENT
              key: 'logstash.pipeline.events.in[{#PIPELINE}]'
              delay: '0'
              history: 7d
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.pipelines.{#PIPELINE}.events.in'
                - type: SIMPLE_CHANGE
                  parameters:
                    - ''
              master_item:
                key: logstash
              tags:
                - tag: Logstash
                  value: pipeline
            - uuid: 499b19a715fe448a817adf95ee91a946
              name: 'Pipeline {#PIPELINE}: events out'
              type: DEPENDENT
              key: 'logstash.pipeline.events.out[{#PIPELINE}]'
              delay: '0'
              history: 7d
              preprocessing:
