      discovery_rules:
        # ========== Modem discovery ==========
        - uuid: bb1bc0b9f04c463996e8ddbf00bc010b
          name: 'Modem discovery'
          type: DEPENDENT
          key: modem.discovery
          delay: '0'
          item_prototypes:
            - uuid: 3e953fbd690e44958cf83e4835f44a7c
              name: 'Modem #{#MODEM.NUMBER} imei'
              type: DEPENDENT
              key: 'modem.imei[{#MODEM.NUMBER}]'
              delay: '0'
              history: 7d
              value_type: CHAR
              trends: '0'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$..[?(@.modem_no == ''{#MODEM.NUMBER}'')].imei.first()'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: modem.full_info
              tags:
                - tag: Modem
                  value: '{#MODEM.NUMBER}'
            - uuid: 258edf0426ef4a5a8a2d55585ba65da7
              name: 'Modem #{#MODEM.NUMBER} imsi'
              type: DEPENDENT
              key: 'modem.imsi[{#MODEM.NUMBER}]'
              delay: '0'
              history: 7d
              value_type: CHAR
              trends: '0'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$..[?(@.modem_no == ''{#MODEM.NUMBER}'')].imsi.first()'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: modem.full_info
              tags:
                - tag: Modem
                  value: '{#MODEM.NUMBER}'
            - uuid: f5fee65510b140eebd66d3e05718af59
              name: 'Modem #{#MODEM.NUMBER} network name'
              type: DEPENDENT
              key: 'modem.net_name[{#MODEM.NUMBER}]'
              delay: '0'
              history: 7d
              value_type: CHAR
              trends: '0'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$..[?(@.modem_no == ''{#MODEM.NUMBER}'')].net_name.first()'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: modem.full_info
              tags:
                - tag: Modem
                  value: '{#MODEM.NUMBER}'
            - uuid: 0284510fbfad4a4395ea4ff57912d333
              name: 'Modem #{#MODEM.NUMBER} number'
              type: DEPENDENT
              key: 'modem.number[{#MODEM.NUMBER}]'
              delay: '0'
              history: 7d
              value_type: CHAR
              trends: '0'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$..[?(@.modem_no == ''{#MODEM.NUMBER}'')].number.first()'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: modem.full_info
              tags:
                - tag: Modem
                  value: '{#MODEM.NUMBER}'
            - uuid: 268747619a3649178f333b9d4750c0d6
              name: 'Modem #{#MODEM.NUMBER} signal strength'
              type: DEPENDENT
              key: 'modem.signal_strength[{#MODEM.NUMBER}]'
              delay: '0'
              history: 7d
              units: '%'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$..[?(@.modem_no == ''{#MODEM.NUMBER}'')].signal_strength.first()'
              master_item:
                key: modem.full_info
              tags:
                - tag: Modem
                  value: '{#MODEM.NUMBER}'
              trigger_prototypes:
                - uuid: 8b537758b83a4944a2381dde8f7acbcb
                  expression: 'last(/SMSEagle by HTTP/modem.signal_strength[{#MODEM.NUMBER}])<{$SMSE.MIN.SIGNAL.STRENGTH}'
                  name: 'Modem #{#MODEM.NUMBER} signal strength low'
                  opdata: '{ITEM.LASTVALUE}'
                  priority: AVERAGE
                  manual_close: 'YES'
                  tags:
                    - tag: SMSE
                      value: 'Signal strength'
            - uuid: 07bd2bf7f0024ebab4953c0e6dbd1001
              name: 'Modem #{#MODEM.NUMBER} sim network registration status'
              type: DEPENDENT
              key: 'modem.sim_network_registration_status[{#MODEM.NUMBER}]'
              delay: '0'
              history: 7d
              valuemap:
                name: 'SMSEagle SIM network registration'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$..[?(@.modem_no == ''{#MODEM.NUMBER}'')].sim_network_registration_status.first()'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var map = {"Not Registered": 0, "Registered Home": 1, "Searching": 2, "Registration Denied": 3, "Unknown": 4, "Registered Roaming": 5};
                      return map[value] !== undefined ? map[value] : 4;
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: modem.full_info
              tags:
                - tag: Modem
                  value: '{#MODEM.NUMBER}'
              trigger_prototypes:
                - uuid: c9ca524d64cf4f8a940bc2a4936e1767
                  expression: 'last(/SMSEagle by HTTP/modem.sim_network_registration_status[{#MODEM.NUMBER}])<>1 and last(/SMSEagle by HTTP/modem.sim_network_registration_status[{#MODEM.NUMBER}])<>5'
                  name: 'Modem #{#MODEM.NUMBER} SIM not registered'
                  opdata: '{ITEM.LASTVALUE}'
                  priority: AVERAGE
                  manual_close: 'YES'
                  tags:
                    - tag: SMSE
                      value: 'SIM registration'
            - uuid: 22ccd566312843ada304ba5d883d7991
              name: 'Modem #{#MODEM.NUMBER} sim status'
              type: DEPENDENT
              key: 'modem.sim_status[{#MODEM.NUMBER}]'
              delay: '0'
              history: 7d
              valuemap:
                name: 'SMSEagle SIM status'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$..[?(@.modem_no == ''{#MODEM.NUMBER}'')].sim_status.first()'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var map = {"Not Inserted": 0, "Operational": 1, "PIN Required": 2, "PUK Required": 3, "Error": 4};
                      return map[value] !== undefined ? map[value] : 4;
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: modem.full_info
              tags:
                - tag: Modem
                  value: '{#MODEM.NUMBER}'
              trigger_prototypes:
                - uuid: 120f7a1e605e460699e4f1c67b1b50ed
                  expression: 'last(/SMSEagle by HTTP/modem.sim_status[{#MODEM.NUMBER}])<>1'
                  name: 'Modem #{#MODEM.NUMBER} sim status'
                  opdata: '{ITEM.LASTVALUE}'
                  priority: WARNING
                  manual_close: 'YES'
                  tags:
                    - tag: SMSE
                      value: 'SIM status'
            - uuid: 40cd488d0b754913b575e9f074ed4b66
              name: 'Modem #{#MODEM.NUMBER} status'
              type: DEPENDENT
              key: 'modem.status[{#MODEM.NUMBER}]'
              delay: '0'
              history: 7d
              valuemap:
                name: 'SMSEagle service status'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$..[?(@.modem_no == ''{#MODEM.NUMBER}'')].modem_enabled.first()'
                - type: BOOL_TO_DECIMAL
                  parameters:
                    - ''
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: modem.full_info
              tags:
                - tag: Modem
                  value: '{#MODEM.NUMBER}'
              trigger_prototypes:
                - uuid: 374ae9d8b4ff432b87e9373b116444a2
                  expression: 'last(/SMSEagle by HTTP/modem.status[{#MODEM.NUMBER}])<>1'
                  name: 'Modem #{#MODEM.NUMBER} not functional'
                  opdata: '{ITEM.LASTVALUE}'
                  priority: HIGH
                  manual_close: 'YES'
          master_item:
            key: modem.full_info
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  // Zabbix LLD JavaScript preprocessing step
                  var data = JSON.parse(value);
                  var result = [];
                  for (var i = 0; i < data.length; i++) {
                      result.push({
                          "{#MODEM.NUMBER}": data[i].modem_no
                      });
                  }
                  return JSON.stringify(result);
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
        # ========== Temperature sensor discovery ==========
        - uuid: 2543f2bd99bf4a028974fb1ab495f7d9
          name: 'Temperature sensor discovery'
          type: SCRIPT
          key: device.temp.discovery
          delay: 1h
          timeout: 30s
          params: |
            var baseUrl = '{$SCHEMA.API.SMSEAGLE}://{$HOST.API.SMSEAGLE}/api/v2/device/temperature_sensor';
            var token = '{$TOKEN.API.SMSEAGLE}';
            var result = [];
            for (var i = 1; i <= 4; i++) {
                try {
                    var req = new HttpRequest();
                    req.addHeader('access-token: ' + token);
                    var resp = req.get(baseUrl + '/' + i + '/status');
                    var data = JSON.parse(resp);
                    if (data.enabled !== undefined) {
                        result.push({
                            "{#SENSOR.ID}": String(i),
                            "{#SENSOR.ENABLED}": data.enabled ? "1" : "0",
                            "{#SENSOR.STATUS}": data.status || "unknown"
                        });
                    }
                } catch (e) {
                    // Sensor does not exist, skip
                }
            }
            return JSON.stringify(result);
