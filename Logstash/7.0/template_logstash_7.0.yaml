            - uuid: 75dd624d61ce45a591bece731c78ca1a
              name: 'Pipeline {#PIPELINE}: events duration'
              type: DEPENDENT
              key: 'logstash.pipeline.events.duration[{#PIPELINE}]'
              delay: '0'
              history: 7d
              units: ms
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.pipelines.{#PIPELINE}.events.duration_in_millis'
                - type: SIMPLE_CHANGE
                  parameters:
                    - ''
              master_item:
                key: logstash
              tags:
                - tag: Logstash
                  value: pipeline
            - uuid: 1490f2e7eff1413e881e1a3f9be956bb
              name: 'Pipeline {#PIPELINE}: queue events'
              type: DEPENDENT
              key: 'logstash.pipeline.queue.events[{#PIPELINE}]'
              delay: '0'
              history: 7d
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.pipelines.{#PIPELINE}.queue.events_count'
              master_item:
                key: logstash
              tags:
                - tag: Logstash
                  value: pipeline
            - uuid: bda330e0a6234411a7abefed1361deb2
              name: 'Pipeline {#PIPELINE}: queue type'
              type: DEPENDENT
              key: 'logstash.pipeline.queue.type[{#PIPELINE}]'
              delay: '0'
              history: 7d
              valuemap:
                name: 'Logstash queue type'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.pipelines.{#PIPELINE}.queue.type'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var map = {"memory": 0, "persisted": 1};
                      return map[value] !== undefined ? map[value] : 2;
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: logstash
              tags:
                - tag: Logstash
                  value: pipeline
            - uuid: 50d4e2545bfd47b8b70544c9e9536a37
              name: 'Pipeline {#PIPELINE}: reload successes'
              type: DEPENDENT
              key: 'logstash.pipeline.reloads.successes[{#PIPELINE}]'
              delay: '0'
              history: 7d
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.pipelines.{#PIPELINE}.reloads.successes'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: logstash
              tags:
                - tag: Logstash
                  value: pipeline
            - uuid: 486d6a2c12104d6590bcf64a0d5b2293
              name: 'Pipeline {#PIPELINE}: reload failures'
              type: DEPENDENT
              key: 'logstash.pipeline.reloads.failures[{#PIPELINE}]'
              delay: '0'
              history: 7d
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.pipelines.{#PIPELINE}.reloads.failures'
                - type: SIMPLE_CHANGE
                  parameters:
                    - ''
              master_item:
                key: logstash
              tags:
                - tag: Logstash
                  value: pipeline
              trigger_prototypes:
                - uuid: 8569bad7076b426e8620390a2319c66e
                  expression: 'last(/Logstash/logstash.pipeline.reloads.failures[{#PIPELINE}])>0'
                  name: 'Pipeline {#PIPELINE}: reload failure detected'
                  priority: WARNING
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  var result = [];
                  for (var name in data.pipelines) {
                      result.push({"{#PIPELINE}": name});
                  }
                  return JSON.stringify(result);
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: logstash
      macros:
        - macro: '{$LOGSTASH.FD.WARN}'
          value: '80'
          description: 'File descriptor usage warning threshold (%).'
        - macro: '{$LOGSTASH.HEAP.CRIT}'
          value: '95'
          description: 'JVM heap usage critical threshold (%).'
        - macro: '{$LOGSTASH.HEAP.WARN}'
          value: '80'
          description: 'JVM heap usage warning threshold (%).'
        - macro: '{$LOGSTASH.PORT}'
          value: '9600'
          description: 'Logstash Monitoring API port.'
      valuemaps:
        - uuid: 3e7a172bea2447d6a2985da01e8fcad5
          name: 'Logstash status'
          mappings:
            - value: '0'
              newvalue: green
            - value: '1'
              newvalue: yellow
            - value: '2'
              newvalue: red
            - value: '3'
              newvalue: unknown
        - uuid: a8ab9c42bbc2426f943df9e0a4554ccf
          name: 'Logstash queue type'
          mappings:
            - value: '0'
              newvalue: memory
            - value: '1'
              newvalue: persisted
            - value: '2'
              newvalue: unknown
