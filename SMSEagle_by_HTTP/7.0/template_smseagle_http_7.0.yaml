zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 612cd71d525444e8a35d3ec35f6272ee
      name: Templates/initMAX
  templates:
    - uuid: 5c2009a54b3844d8b896afcb916c3687
      template: 'SMSEagle by HTTP'
      name: 'SMSEagle by HTTP'
      description: |
        Monitoring SMSEagle SMS gateway devices via HTTP API v2.
        Collects modem status, signal strength, SIM status, message counters,
        firmware version, support status, HA failover state, service statuses
        (MQTT, SNMP, SMPP, Email2SMS, Data connection), and temperature sensors.
        Requires firmware 6.30+ for full functionality.

        More of our templates can be found on https://git.initmax.cz/initMAX-Public/zabbix-templates

        Developed by initMAX s.r.o.
        https://www.initmax.com
      vendor:
        name: initMAX
        version: 7.0-0
      groups:
        - name: Templates/initMAX
      items:
        # ========== Messages ==========
        - uuid: abf0c865b24e4c8ab512641ea368e1e8
          name: 'Messages count - delivered'
          type: DEPENDENT
          key: messages.delivered
          delay: '0'
          history: 7d
          units: '!messages'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.delivered
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: messages.full_info
          tags:
            - tag: Messages
        - uuid: 7840d610a7d74a28b35569d9df34ec00
          name: 'Messages count - error'
          type: DEPENDENT
          key: messages.error
          delay: '0'
          history: 7d
          units: '!messages'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.error
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: messages.full_info
          tags:
            - tag: Messages
        - uuid: 8b12ab1daf7d4acb982ccd6ccb365215
          name: 'Messages full info'
          type: HTTP_AGENT
          key: messages.full_info
          delay: 1m
          history: '0'
          value_type: TEXT
          trends: '0'
          url: '{$SCHEMA.API.SMSEAGLE}://{$HOST.API.SMSEAGLE}/api/v2/messages/count/'
          headers:
            - name: access-token
              value: '{$TOKEN.API.SMSEAGLE}'
          tags:
            - tag: RAW
        - uuid: 2fa8b50e10ae4cb18f4ca18d089f8a27
          name: 'Messages count - inbox'
          type: DEPENDENT
          key: messages.inbox
          delay: '0'
          history: 7d
          units: '!messages'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.inbox
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: messages.full_info
          tags:
            - tag: Messages
        - uuid: 631b6a32e63e417abdb171a89941b2d4
          name: 'Messages count - outbox'
          type: DEPENDENT
          key: messages.outbox
          delay: '0'
          history: 7d
          units: '!messages'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.outbox
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: messages.full_info
          tags:
            - tag: Messages
        - uuid: 7225c30bd3f940e68235caffdfe99223
          name: 'Messages count - sent'
          type: DEPENDENT
          key: messages.sent
          delay: '0'
          history: 7d
          units: '!messages'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.sent
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: messages.full_info
          tags:
            - tag: Messages
        # ========== Modem ==========
        - uuid: 1a9ca91068794766a0f6b269c8f94463
          name: 'Modem full info'
          type: HTTP_AGENT
          key: modem.full_info
          delay: 1m
          history: '0'
          value_type: TEXT
          trends: '0'
          url: '{$SCHEMA.API.SMSEAGLE}://{$HOST.API.SMSEAGLE}/api/v2/modem/full_info/'
          headers:
            - name: access-token
              value: '{$TOKEN.API.SMSEAGLE}'
          tags:
            - tag: RAW
        - uuid: f6af6cb04f76401eb6f1094d911014eb
          name: 'Modem count'
          type: DEPENDENT
          key: modem.count
          delay: '0'
          history: 7d
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return JSON.parse(value).length;'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: modem.full_info
          tags:
