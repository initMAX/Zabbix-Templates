      discovery_rules:
        - uuid: 502eaabeeda548c3a74f7d98d2dd8759
          name: 'IPA healthcheck checks discovery'
          type: DEPENDENT
          key: ipa.healthcheck.checks.discovery
          delay: '0'
          description: |
            Discover ipa-healthcheck checks (source + check + identifier).
            Ignore run metadata and normalize known healthy diagnostic counters before the 1h heartbeat.
            Changed checks and diagnostic errors still pass immediately. Duplicate entries are retained in Details.
          filter:
            evaltype: AND
            conditions:
              - macro: '{#SOURCE}'
                value: '{$FREEIPA.SOURCE.MATCHES}'
                operator: MATCHES_REGEX
                formulaid: A
              - macro: '{#SOURCE}'
                value: '{$FREEIPA.SOURCE.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  function category(source) {
                      if (source === 'ipahealthcheck.meta.services') return 'Services';
                      if (/replication|\.ruv$|\.topology$/.test(source)) return 'Replication';
                      if (/certs|dogtag/.test(source)) return 'Certificates';
                      if (/\.(kdc|host|trust|idns|nss)$/.test(source)) return 'Authentication';
                      if (source === 'ipahealthcheck.ipa.files') return 'Files';
                      return 'Configuration';
                  }
                  function entryId(d) {
                      var kw = d.kw || {};
                      return kw.key || kw.store || kw.path || kw.service || kw.cn || kw.name || kw.id || kw.rid || kw.hostname || kw.issuer || kw.subject || kw.serial || kw.dn || kw.realm || kw.suffix || kw.profile || kw.server || kw.ipaddr || kw.ip_address || '';
                  }
                  function canonical(value) {
                      if (value === null || typeof value !== 'object') return value;
                      if (Array.isArray(value)) {
                          return value.map(canonical);
                      }
                      var result = Object.create(null);
                      Object.keys(value).sort().forEach(function(key) {
                          result[key] = canonical(value[key]);
                      });
                      return result;
                  }
                  function details(entry) {
                      var cleaned = Object.create(null);
                      Object.keys(entry).forEach(function(key) {
                          if (key !== 'uuid' && key !== 'when' && key !== 'duration') {
                              cleaned[key] = canonical(entry[key]);
                          }
                      });
                      var kw = cleaned.kw || {};
                      // Keep all failed-check diagnostics and unknown message formats.
                      if (entry.result === 'SUCCESS') {
                          if (entry.source === 'ipahealthcheck.system.filesystemspace' &&
                                  entry.check === 'FileSystemSpaceCheck' &&
                                  typeof kw.store === 'string' && typeof kw.percent_free === 'number' &&
                                  typeof kw.threshold === 'number' && kw.percent_free >= kw.threshold) {
                              var expected = kw.store + ': free space percentage within limits: ' +
                                  kw.percent_free + '% >= ' + kw.threshold + '%';
                              if (kw.msg === expected) {
                                  delete kw.percent_free;
                                  kw.msg = kw.store + ': free space percentage within configured limits (threshold: ' +
                                      kw.threshold + '%)';
                              }
                          }
                          if (entry.source === 'ipahealthcheck.system.filesystemspace' &&
                                  entry.check === 'FileSystemSpaceCheck' &&
                                  typeof kw.store === 'string' && typeof kw.free_space === 'number' &&
                                  typeof kw.threshold === 'number' && kw.threshold >= 0 &&
                                  kw.free_space >= kw.threshold) {
                              var expectedMiB = kw.store + ': free space within limits: ' +
                                  kw.free_space + ' MiB >= ' + kw.threshold + ' MiB';
                              if (kw.msg === expectedMiB) {
                                  delete kw.free_space;
                                  kw.msg = kw.store + ': free space within configured limits (threshold: ' +
                                      kw.threshold + ' MiB)';
                              }
                          }
                          if (entry.source === 'ipahealthcheck.ipa.certs' &&
                                  entry.check === 'IPACAChainExpirationCheck' &&
                                  typeof kw.days === 'number' && kw.days >= 0 &&
                                  typeof kw.path === 'string' && typeof kw.key === 'string' &&
                                  !Object.prototype.hasOwnProperty.call(kw, 'msg')) {
                              delete kw.days;
                          }
                      }
                      return JSON.stringify(canonical(cleaned));
                  }
                  var data = JSON.parse(value);
                  if (!Array.isArray(data) || !data.length) throw 'Empty or invalid IPA healthcheck';
                  var groups = Object.create(null);
                  for (var i = 0; i < data.length; i++) {
                      var d = data[i];
                      if (!d || typeof d !== 'object' || Array.isArray(d)) throw 'Invalid IPA healthcheck entry';
                      var src = d.source || '';
                      var check = d.check || '';
                      if (!src || !check) throw 'Missing IPA healthcheck identity';
                      var id = entryId(d);
                      var key = JSON.stringify([src, check, String(id)]);
                      if (!groups[key]) {
                          groups[key] = { source: src, check: check, id: id, entries: Object.create(null) };
                      }
                      groups[key].entries[details(d)] = true;
                  }
                  var keys = Object.keys(groups).sort();
                  if (!keys.length) throw 'No IPA healthcheck identities';
                  var out = { data: [] };
                  for (var j = 0; j < keys.length; j++) {
                      var group = groups[keys[j]];
                      var src = group.source, check = group.check, id = group.id;
                      var entries = Object.keys(group.entries).sort().map(function(entry) {
                          return JSON.parse(entry);
                      });
                      var short = src;
                      if (short.indexOf('ipahealthcheck.') === 0) {
                          short = short.substring('ipahealthcheck.'.length);
                      }
                      var idLabel = id ? ' - ' + id : '';
                      out.data.push({
                          "{#SOURCE}": src,
                          "{#CATEGORY}": category(src),
                          "{#SOURCE_SHORT}": short,
                          "{#CHECK}": check,
                          "{#ID}": id,
                          "{#ID_LABEL}": idLabel,
                          "{#DETAILS}": JSON.stringify(entries.length === 1 ? entries[0] : entries, null, 2)
                      });
                  }
                  return JSON.stringify(out);
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: ipa.raw
          item_prototypes:
            - uuid: a11be818e27e4f628e06040ee1cd10ae
              name: 'IPA {#SOURCE_SHORT}: {#CHECK}{#ID_LABEL}'
              type: DEPENDENT
              key: 'ipa.healthcheck.result["{#SOURCE}","{#CHECK}","{#ID}"]'
              delay: '0'
              value_type: CHAR
              trends: '0'
              description: |
                Source: {#SOURCE}
                Check: {#CHECK}
                Details (entry):
                {#DETAILS}
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      function entryId(d) {
                          var kw = d.kw || {};
                          return kw.key || kw.store || kw.path || kw.service || kw.cn || kw.name || kw.id || kw.rid || kw.hostname || kw.issuer || kw.subject || kw.serial || kw.dn || kw.realm || kw.suffix || kw.profile || kw.server || kw.ipaddr || kw.ip_address || '';
                      }
                      var data = JSON.parse(value);
                      if (!Array.isArray(data) || !data.length) throw 'Empty or invalid IPA healthcheck';
                      var src = '{#SOURCE}';
                      var check = '{#CHECK}';
                      var id = '{#ID}';
                      var rank = { SUCCESS: 0, WARNING: 1, ERROR: 2, CRITICAL: 3 };
                      var status = 'NOT_PRESENT';
                      var worst = -1;
                      for (var i = 0; i < data.length; i++) {
                          var d = data[i];
                          if (!d || typeof d !== 'object' || Array.isArray(d)) throw 'Invalid IPA healthcheck entry';
                          if (d.source !== src || d.check !== check) continue;
                          if (String(entryId(d)) !== id) continue;
                          if (!Object.prototype.hasOwnProperty.call(rank, d.result)) throw 'Unknown IPA result';
                          if (rank[d.result] > worst) {
                              worst = rank[d.result];
                              status = d.result;
                          }
                      }
                      return status;
              master_item:
                key: ipa.raw
              tags:
                - tag: FreeIPA
                - tag: FreeIPA
                  value: '{#SOURCE_SHORT}'
              trigger_prototypes:
                - uuid: 0f7bb95e0324446e9d5c9865580fee80
                  expression: 'last(/FreeIPA Server/ipa.healthcheck.result["{#SOURCE}","{#CHECK}","{#ID}"])="WARNING"'
                  name: 'FreeIPA Server {#SOURCE_SHORT}: {#CHECK}{#ID_LABEL} is WARNING'
                  priority: WARNING
                  description: |
