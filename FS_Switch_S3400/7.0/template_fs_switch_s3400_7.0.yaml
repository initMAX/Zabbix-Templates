          key: system.sw.name
          delay: 1h
          value_type: CHAR
          trends: '0'
          description: 'FS enterprise MIB - switch model name (scalar)'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
        - uuid: 161effe75471487c9a0388a2a86a75c4
          name: 'Firmware version'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.52642.3.6.10.1.6.0]'
          key: system.sw.version
          delay: 1h
          value_type: CHAR
          trends: '0'
          description: 'FS enterprise MIB - full firmware version string'
          inventory_link: SOFTWARE_APP_A
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: e71410224548496f82d964d23c3fbdd3
              expression: 'last(/FS Switch S3400 SNMP/system.sw.version,#1)<>last(/FS Switch S3400 SNMP/system.sw.version,#2) and length(last(/FS Switch S3400 SNMP/system.sw.version))>0'
              name: 'FS Switch: Firmware version has changed'
              event_name: 'FS Switch: Firmware version has changed (new version: {ITEM.VALUE})'
              priority: INFO
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
        - uuid: c367ac2d8aa846eea62601e1a8bc1b09
          name: 'Memory: Utilization (raw)'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.52642.3.6.10.1.14.0]'
          key: vm.memory.pfree
          units: '%'
          description: 'FS enterprise MIB - likely memory utilization percentage'
          tags:
            - tag: component
              value: memory
        - uuid: 20b618699f6e4d2389fc0e43ab71fa44
          name: 'Memory: Total'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.52642.3.6.5.0]'
          key: vm.memory.total
          delay: 5m
          units: B
          description: 'Total system memory in bytes'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          tags:
            - tag: component
              value: memory
        - uuid: e7f4ef1b61c748c09ab062e10e838cdc
          name: 'Memory: Utilization'
          type: CALCULATED
          key: vm.memory.util
          value_type: FLOAT
          units: '%'
          params: last(//vm.memory.pfree)
          description: 'Memory utilization calculated as 100 - memoryFreedInPercent'
          tags:
            - tag: component
              value: memory
          triggers:
            - uuid: 9c1e2514f72c404580fc13e58961debf
              expression: 'min(/FS Switch S3400 SNMP/vm.memory.util,5m)>{$MEMORY.UTIL.MAX}'
              name: 'FS Switch: High memory utilization'
              event_name: 'FS Switch: High memory utilization (>{$MEMORY.UTIL.MAX}% for 5m)'
              priority: AVERAGE
              tags:
                - tag: scope
                  value: capacity
                - tag: scope
                  value: performance
        - uuid: 5edb8624d18844649bf8d684e4aa9b14
          name: 'SNMP agent availability'
          type: INTERNAL
          key: 'zabbix[host,snmp,available]'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: 9d172e254b824dd0a2f71ed124f3a2e9
              expression: 'max(/FS Switch S3400 SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              name: 'FS Switch: No SNMP data collection'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: WARNING
              dependencies:
                - name: 'FS Switch: Unavailable by ICMP ping'
                  expression: 'max(/FS Switch S3400 SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
      discovery_rules:
        - uuid: 94c27d1d29de43f3befb92b5bd5a32c1
          name: 'Network interfaces discovery'
          type: DEPENDENT
          key: net.if.discovery
          delay: '0'
          filter:
            conditions:
              - macro: '{#IFDESCR}'
                value: '{$NET.IF.IFDESCR.MATCHES}'
                formulaid: A
              - macro: '{#IFDESCR}'
                value: '{$NET.IF.IFDESCR.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
              - macro: '{#IFNAME}'
                value: '{$NET.IF.IFNAME.MATCHES}'
                formulaid: C
              - macro: '{#IFNAME}'
                value: '{$NET.IF.IFNAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: D
          description: 'Discovering interfaces from IF-MIB.'
          item_prototypes:
            - uuid: 414db6dd8b244409bbfa99b9ba4da815
              name: 'Interface {#IFNAME}({#IFALIAS}): Inbound packets discarded'
              type: DEPENDENT
              key: 'net.if.in.discards[ifInDiscards.{#SNMPINDEX}]'
              delay: '0'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}'
                    - '0'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 3m
              master_item:
                key: net.if.walk
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
