zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 612cd71d525444e8a35d3ec35f6272ee
      name: Templates/initMAX
  templates:
    - uuid: 3a8193f185ec451e99eba349d73adf7e
      template: 'FS Switch S3900 SNMP'
      name: 'FS Switch S3900 SNMP'
      description: |
        More of our templates can be found on https://git.initmax.cz/initMAX-Public/zabbix-templates
        
        Developed by initMAX s.r.o.
        https://www.initmax.com
      vendor:
        name: 'initMAX s.r.o.'
        version: 7.0-0
      groups:
        - name: Templates/initMAX
      items:
        - uuid: 6734d29b41164153b6990d092c4ae020
          name: 'ICMP ping'
          type: SIMPLE
          key: icmpping
          valuemap:
            name: 'Service state'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: 3b84fc69d681449a9d4dce4a1b65d450
              expression: 'max(/FS Switch S3900 SNMP/icmpping,#3)=0'
              name: 'FS Switch: Unavailable by ICMP ping'
              priority: HIGH
              tags:
                - tag: scope
                  value: availability
        - uuid: e76cd3ba6d234dfb9a76ac6cce681da8
          name: 'ICMP loss'
          type: SIMPLE
          key: icmppingloss
          value_type: FLOAT
          units: '%'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: e82344c419ae49a1a4ed155d468534eb
              expression: 'min(/FS Switch S3900 SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/FS Switch S3900 SNMP/icmppingloss,5m)<100'
              name: 'FS Switch: High ICMP ping loss'
              opdata: 'Loss: {ITEM.LASTVALUE1}'
              priority: WARNING
              dependencies:
                - name: 'FS Switch: Unavailable by ICMP ping'
                  expression: 'max(/FS Switch S3900 SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: 5e56b8a9d0864038b897499287d786fd
          name: 'ICMP response time'
          type: SIMPLE
          key: icmppingsec
          value_type: FLOAT
          units: s
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: b1b6781b5bf945cabfe87f87eff6d51f
              expression: 'avg(/FS Switch S3900 SNMP/icmppingsec,5m)>{$ICMP_RESPONSE_TIME_WARN}'
              name: 'FS Switch: High ICMP ping response time'
              opdata: 'Value: {ITEM.LASTVALUE1}'
              priority: WARNING
              dependencies:
                - name: 'FS Switch: High ICMP ping loss'
                  expression: 'min(/FS Switch S3900 SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/FS Switch S3900 SNMP/icmppingloss,5m)<100'
                - name: 'FS Switch: Unavailable by ICMP ping'
                  expression: 'max(/FS Switch S3900 SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: 7c1b9d66d7db4a0296e2c60edb92ad4b
          name: 'FS Switch: SNMP walk network interfaces'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.2.1.2.2.1.8,1.3.6.1.2.1.2.2.1.7,1.3.6.1.2.1.31.1.1.1.18,1.3.6.1.2.1.31.1.1.1.1,1.3.6.1.2.1.2.2.1.2,1.3.6.1.2.1.2.2.1.3,1.3.6.1.2.1.31.1.1.1.6,1.3.6.1.2.1.31.1.1.1.10,1.3.6.1.2.1.2.2.1.14,1.3.6.1.2.1.2.2.1.20,1.3.6.1.2.1.2.2.1.19,1.3.6.1.2.1.2.2.1.13,1.3.6.1.2.1.31.1.1.1.15]'
          key: net.if.walk
          history: '0'
          value_type: TEXT
          trends: '0'
          description: 'SNMP walk of IF-MIB for network interface discovery and monitoring.'
          tags:
            - tag: component
              value: raw
        - uuid: f927cc5bc32c48b9b105eabad1ca3449
          name: 'FS Switch: SNMP walk fans'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.52642.9.187.5.1.1.1,1.3.6.1.4.1.52642.9.187.5.1.1.3,1.3.6.1.4.1.52642.9.187.5.1.1.4,1.3.6.1.4.1.52642.9.187.5.1.1.5,1.3.6.1.4.1.52642.9.187.5.1.1.6,1.3.6.1.4.1.52642.9.187.5.1.1.7]'
          key: sensor.fans.walk
          history: '0'
          value_type: TEXT
          trends: '0'
          description: 'Walk FS fan table at .9.187.5.1.1 (index, status, present, RPM, alarm)'
          tags:
            - tag: component
              value: raw
        - uuid: 209a28d057384488aba159abfc1a195c
          name: 'FS Switch: SNMP walk PSUs'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.52642.9.189.5.1.1.1,1.3.6.1.4.1.52642.9.189.5.1.1.3,1.3.6.1.4.1.52642.9.189.5.1.1.4,1.3.6.1.4.1.52642.9.189.5.1.1.5]'
          key: sensor.psu.walk
          history: '0'
          value_type: TEXT
          trends: '0'
          description: 'Walk FS PSU table at .9.189.5.1.1 (index, description, status, alarm)'
          tags:
            - tag: component
              value: raw
        - uuid: 51b0ef21a911477c8b66d826d1ee0f21
          name: Temperature
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.52642.9.48.1.0]'
          key: sensor.temp.value
          value_type: FLOAT
          units: °C
          description: 'Board temperature in Celsius'
          tags:
            - tag: component
              value: memory
          triggers:
            - uuid: 0d87eda2f2024660bc63a1823bc040d9
              expression: 'avg(/FS Switch S3900 SNMP/sensor.temp.value,5m)>{$TEMP.MAX.CRIT}'
              name: 'FS Switch: Temperature critical (>{$TEMP.MAX.CRIT}°C)'
              priority: HIGH
              tags:
                - tag: component
                  value: temperature
                - tag: scope
                  value: availability
            - uuid: 78834a9914284599900a7cf7adb03736
              expression: 'avg(/FS Switch S3900 SNMP/sensor.temp.value,5m)>{$TEMP.MAX.WARN}'
              name: 'FS Switch: Temperature warning (>{$TEMP.MAX.WARN}°C)'
              priority: WARNING
              dependencies:
                - name: 'FS Switch: Temperature critical (>{$TEMP.MAX.CRIT}°C)'
                  expression: 'avg(/FS Switch S3900 SNMP/sensor.temp.value,5m)>{$TEMP.MAX.CRIT}'
              tags:
                - tag: component
                  value: temperature
                - tag: scope
                  value: performance
        - uuid: 56625fd33b1744d2a206c85f3fe303a8
          name: 'System contact details'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.4.0]'
          key: 'system.contact[sysContact.0]'
          delay: 15m
          value_type: CHAR
          trends: '0'
          inventory_link: CONTACT
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
        - uuid: 44d9895399434075843b087a763b543c
          name: 'CPU utilization (5s)'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.52642.9.109.1.1.1.1.3.1]'
          key: system.cpu.util
          value_type: FLOAT
          units: '%'
          description: 'CPU busy % over last 5 seconds (Cisco cpmCPUTotal5sec style)'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 5m
          tags:
            - tag: component
              value: cpu
        - uuid: b93dfb924f44499fa90674cf3e5788da
          name: 'CPU utilization (5min avg)'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.52642.9.109.1.1.1.1.5.1]'
          key: system.cpu.util.avg
          value_type: FLOAT
          units: '%'
          description: 'CPU busy % over last 5 minutes (Cisco cpmCPUTotal5minRev style)'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 5m
          tags:
            - tag: component
              value: cpu
          triggers:
            - uuid: 92659c83c7c3410fa0044671745156f0
              expression: 'min(/FS Switch S3900 SNMP/system.cpu.util.avg,5m)>{$CPU.UTIL.CRIT}'
              name: 'FS Switch: High CPU utilization'
              event_name: 'FS Switch: High CPU utilization (over {$CPU.UTIL.CRIT}% for 5m)'
              opdata: 'Current utilization: {ITEM.LASTVALUE1}'
              priority: WARNING
              tags:
                - tag: scope
                  value: performance
        - uuid: aaea433e669a421bab5fd1579fdf41f4
          name: 'System description'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.1.0]'
          key: 'system.descr[sysDescr.0]'
          delay: 15m
          value_type: CHAR
          trends: '0'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
        - uuid: 9b5aa0adca3549b4835b55ab661b1f69
          name: 'Hardware model name'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.52642.3.6.10.1.3.0]'
          key: system.hw.model
          delay: 1h
          value_type: CHAR
          trends: '0'
          description: 'FS enterprise MIB - switch model name'
          inventory_link: MODEL
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
        - uuid: 5c874b62317a4127a3241c4fd1285ff4
          name: 'Hardware serial number'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.52642.3.6.10.1.4.0]'
          key: system.hw.serialnumber
          delay: 1h
          value_type: CHAR
          trends: '0'
          description: 'FS enterprise MIB - switch serial number'
          inventory_link: SERIALNO_A
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 450f06f2ee3d4a15a3422b9a773b6c10
              expression: 'last(/FS Switch S3900 SNMP/system.hw.serialnumber,#1)<>last(/FS Switch S3900 SNMP/system.hw.serialnumber,#2) and length(last(/FS Switch S3900 SNMP/system.hw.serialnumber))>0'
              name: 'FS Switch: Device has been replaced'
              event_name: 'FS Switch: Device has been replaced (new serial number received)'
              priority: INFO
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
        - uuid: c891bfb99afc4bc9b7cd13d4de2f638c
          name: 'Uptime (FS)'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.52642.3.6.13.0]'
          key: 'system.hw.uptime[fsUptime.0]'
          delay: 30s
          value_type: FLOAT
          trends: '0'
          units: uptime
          description: 'FS enterprise MIB - system uptime timeticks'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
        - uuid: 6795aa909e534e91827f538130480534
          name: 'Hardware version'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.52642.3.6.10.1.5.0]'
          key: system.hw.version
          value_type: CHAR
          trends: '0'
          description: 'FS enterprise MIB - hardware version'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: memory
        - uuid: 1be62ada4c20433bb07eb2ba51e43c57
          name: 'System location'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.6.0]'
          key: 'system.location[sysLocation.0]'
          delay: 15m
          value_type: CHAR
          trends: '0'
          inventory_link: LOCATION
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
        - uuid: 9b5c1fdb7a0a49718aa510c0a3a0f0b5
          name: 'System name'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.5.0]'
          key: system.name
          delay: 15m
          value_type: CHAR
          trends: '0'
          inventory_link: NAME
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: b498c2a028194834b0b07f256bceb31c
              expression: 'last(/FS Switch S3900 SNMP/system.name,#1)<>last(/FS Switch S3900 SNMP/system.name,#2) and length(last(/FS Switch S3900 SNMP/system.name))>0'
              name: 'FS Switch: System name has changed'
              event_name: 'FS Switch: System name has changed (new name: {ITEM.VALUE})'
              priority: INFO
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
        - uuid: f20f6275df044f39b1db1f4e4bb77ed0
          name: 'Uptime (network)'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.3.0]'
          key: 'system.net.uptime[sysUpTime.0]'
          delay: 30s
          value_type: FLOAT
          trends: '0'
          units: uptime
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
        - uuid: d999a8ca3b2943bebf4e87d91c2cd70b
          name: 'System object ID'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.2.0]'
          key: 'system.objectid[sysObjectID.0]'
          delay: 15m
          value_type: CHAR
          trends: '0'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
        - uuid: aba28ff1849542cbb4e562938c4034ad
          name: 'Overall system status'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.52642.3.6.22.0]'
          key: system.status
          description: 'FS enterprise MIB - switchOperState'
          valuemap:
            name: 'FS-MIB::switchOperState'
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 3ad66fd64c14474da14779c36d1e0ab5
              expression: 'last(/FS Switch S3900 SNMP/system.status)=5'
              name: 'FS Switch: System in critical state'
              priority: HIGH
              tags:
                - tag: scope
                  value: availability
            - uuid: 5406b3fb63f24231aec8acfeb8e772e3
              expression: 'last(/FS Switch S3900 SNMP/system.status)=6'
              name: 'FS Switch: System in nonrecoverable state'
              priority: DISASTER
              tags:
                - tag: scope
                  value: availability
        - uuid: dcf8833c5bcd4f309ebc4ff7ec656c80
          name: 'Product name'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.52642.3.6.21.0]'
          key: system.sw.name
          delay: 1h
          value_type: CHAR
          trends: '0'
          description: 'FS enterprise MIB - switch model name (scalar)'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
        - uuid: 103a709baf524c66b43a5c249a2c6c36
          name: 'Firmware version'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.52642.3.6.10.1.6.0]'
          key: system.sw.version
          delay: 1h
          value_type: CHAR
          trends: '0'
          description: 'FS enterprise MIB - full firmware version string'
          inventory_link: SOFTWARE_APP_A
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 7386391310294d64a5c8fad9c718ae88
              expression: 'last(/FS Switch S3900 SNMP/system.sw.version,#1)<>last(/FS Switch S3900 SNMP/system.sw.version,#2) and length(last(/FS Switch S3900 SNMP/system.sw.version))>0'
              name: 'FS Switch: Firmware version has changed'
              event_name: 'FS Switch: Firmware version has changed (new version: {ITEM.VALUE})'
              priority: INFO
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
        - uuid: e3f4e16251e04add96426fc33cae92d6
          name: 'Memory: Utilization (raw)'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.52642.9.48.5.0]'
          key: vm.memory.pfree
          units: '%'
          description: 'FS enterprise MIB - likely memory utilization percentage'
          tags:
            - tag: component
              value: memory
        - uuid: 8e9435c9302e4939ba71f8c5b139f80f
          name: 'Memory: Total'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.52642.9.48.2.0]'
          key: vm.memory.total
          delay: 5m
          units: B
          description: 'Total system memory in bytes'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          tags:
            - tag: component
              value: memory
        - uuid: 0acb8534e3264a54949b3a4b2e27358d
          name: 'Memory: Utilization'
          type: CALCULATED
          key: vm.memory.util
          value_type: FLOAT
          units: '%'
          params: last(//vm.memory.pfree)
          description: 'Memory utilization calculated as 100 - memoryFreedInPercent'
          tags:
            - tag: component
              value: memory
          triggers:
            - uuid: ee4e515e35ea469cb9cbe9c986fe5e64
              expression: 'min(/FS Switch S3900 SNMP/vm.memory.util,5m)>{$MEMORY.UTIL.MAX}'
              name: 'FS Switch: High memory utilization'
              event_name: 'FS Switch: High memory utilization (>{$MEMORY.UTIL.MAX}% for 5m)'
              priority: AVERAGE
              tags:
                - tag: scope
                  value: capacity
                - tag: scope
                  value: performance
        - uuid: 01b20d4515834adf99fa2799d3e474d8
          name: 'SNMP agent availability'
          type: INTERNAL
          key: 'zabbix[host,snmp,available]'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: 66887383951a49a09aa8e9f90cad4e34
              expression: 'max(/FS Switch S3900 SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              name: 'FS Switch: No SNMP data collection'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: WARNING
              dependencies:
                - name: 'FS Switch: Unavailable by ICMP ping'
                  expression: 'max(/FS Switch S3900 SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
      discovery_rules:
        - uuid: 4d5cb7c75f874351be8fda1e6a61b35c
          name: 'Fan discovery'
          type: DEPENDENT
          key: fan.discovery
          delay: '0'
          description: 'Discovery of FS-MIB::switchFanTable.'
          item_prototypes:
            - uuid: 4c17bf1fd16d43108c25821b3fd2f268
              name: 'Fan {#FAN_INDEX}: Speed'
              type: DEPENDENT
              key: 'sensor.fan.speed[{#SNMPINDEX}]'
              delay: '0'
              units: rpm
              description: 'FS-MIB::switchFanOperSpeed in RPM'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.52642.9.187.5.1.1.6.{#SNMPINDEX}'
                    - '0'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 3m
              master_item:
                key: sensor.fans.walk
              tags:
                - tag: component
                  value: fan
            - uuid: e3d684e6b8ea4d30811b1399b5a82bf6
              name: 'Fan {#FAN_INDEX}: Status'
              type: DEPENDENT
              key: 'sensor.fan.status[{#SNMPINDEX}]'
              delay: '0'
              description: 'FS-MIB::switchFanStatus (1=ok, 2=failure)'
              valuemap:
                name: 'FS-MIB::switchFanStatus'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.52642.9.187.5.1.1.4.{#SNMPINDEX}'
                    - '0'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 3m
              master_item:
                key: sensor.fans.walk
              tags:
                - tag: component
                  value: fan
              trigger_prototypes:
                - uuid: e1dd04168606499ebc7cbf9f23490494
                  expression: 'last(/FS Switch S3900 SNMP/sensor.fan.status[{#SNMPINDEX}])=2'
                  name: 'Fan {#FAN_INDEX}: Fan failure'
                  opdata: 'Current state: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  tags:
                    - tag: component
                      value: fan
                    - tag: scope
                      value: availability
          graph_prototypes:
            - uuid: 1315aa972f8f41e0ae2a94dd88f0c8fc
              name: 'Fan {#FAN_INDEX}: Speed'
              graph_items:
                - drawtype: BOLD_LINE
                  color: 199C0D
                  item:
                    host: 'FS Switch S3900 SNMP'
                    key: 'sensor.fan.speed[{#SNMPINDEX}]'
          master_item:
            key: sensor.fans.walk
          preprocessing:
            - type: SNMP_WALK_TO_JSON
              parameters:
                - '{#FAN_INDEX}'
                - 1.3.6.1.4.1.52642.9.187.5.1.1.3
                - '0'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
        - uuid: ea04ad2961c04285b928745810037d3f
          name: 'Network interfaces discovery'
          type: DEPENDENT
          key: net.if.discovery
          delay: '0'
          filter:
            conditions:
              - macro: '{#IFDESCR}'
                value: '{$NET.IF.IFDESCR.MATCHES}'
                formulaid: A
              - macro: '{#IFDESCR}'
                value: '{$NET.IF.IFDESCR.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
              - macro: '{#IFNAME}'
                value: '{$NET.IF.IFNAME.MATCHES}'
                formulaid: C
              - macro: '{#IFNAME}'
                value: '{$NET.IF.IFNAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: D
          description: 'Discovering interfaces from IF-MIB.'
          item_prototypes:
