                  value: pipeline
            - uuid: b1ee01ed59184e81903a1e31d3d01cae
              name: 'Pipeline {#PIPELINE}: events filtered'
              type: DEPENDENT
              key: 'logstash.pipeline.events.filtered[{#PIPELINE}]'
              delay: '0'
              history: 7d
