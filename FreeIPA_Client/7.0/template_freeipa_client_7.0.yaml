zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 5b3faa6e8c604404be9e7c0770cf2f1b
      name: Templates/Applications
  templates:
    - uuid: d76f20738d7a4a68a5a0b6750d144f9a
      template: 'FreeIPA Client'
      name: 'FreeIPA Client'
      description: |
        Native-first monitoring for FreeIPA clients.

        More of our templates can be found on
        https://git.initmax.cz/initMAX-Public/zabbix-templates

        Developed by initMAX s.r.o.
        https://www.initmax.com
      vendor:
        name: initMAX s.r.o.
        version: 7.0-1
      groups:
        - name: Templates/Applications
      items:
        - uuid: 8b8fa3e898204302a486daeedab37934
          name: 'IPA packages: RAW'
          description: |
            Collects package inventory filtered by {$IPA.PACKAGES.MATCH} using system.sw.packages.get.
            Expected value: JSON array of matching packages; empty array means no matches or no access.
            History is disabled for this item, so the history tab is empty by design.
          key: 'system.sw.packages.get[{$IPA.PACKAGES.MATCH}]'
          delay: 1h
          history: '0'
          trends: '0'
          value_type: TEXT
          tags:
            - tag: FreeIPA
              value: Client
            - tag: FreeIPA
              value: Version
            - tag: FreeIPA
              value: RAW
        - uuid: 10037a66351443ae99279b791efea417
          name: 'Kerberos: keytab test'
          description: |
            Runs kinit using /etc/krb5.keytab via userparameter.
            Expected value: 1 = keytab works and TGT acquired, 0 = failure (bad keytab, wrong principal, or permissions).
            The principal defaults to host/<FQDN>.
            If {$IPA.KINIT.REALM} is set, it is appended as principal@REALM.
          key: 'ipa.kerberos.kinit[{$IPA.KINIT.REALM}]'
          delay: 10m
          history: 90d
          value_type: UNSIGNED
          valuemap:
            name: 'Kerberos keytab test'
          tags:
            - tag: FreeIPA
              value: Client
            - tag: FreeIPA
              value: Kerberos
          triggers:
            - uuid: 19478595aa474a2f86b3808a8a3f6ed8
              expression: 'last(/FreeIPA Client/ipa.kerberos.kinit[{$IPA.KINIT.REALM}])=0'
              name: 'Kerberos keytab test failed'
              priority: HIGH
              manual_close: 'YES'
        - uuid: 775cabfabd3241d092ccb496558b5988
          name: 'SSH login & home check: raw'
          description: |
            SSH agent check that logs in with {$IPA.SSH.USER} and verifies {$IPA.SSH.HOME.FILE} in the home directory.
            Expected value: 1 = OK, 2 = NOFILE (home marker missing).
          type: SSH
          key: ssh.run
          delay: 10m
          history: 7d
          trends: 365d
          value_type: UNSIGNED
          authtype: PASSWORD
          username: '{$IPA.SSH.USER}'
          password: '{$IPA.SSH.PASS}'
          params: 'test -f "$HOME/{$IPA.SSH.HOME.FILE}" && echo OK || echo NOFILE'
          timeout: 10s
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  if (value === "OK") {
                    return "1";
                  }
                  if (value === "NOFILE") {
                    return "2";
                  }
                  throw "ERROR: unexpected SSH output";
          valuemap:
            name: 'SSH login & home status'
          tags:
            - tag: FreeIPA
              value: Client
            - tag: FreeIPA
              value: SSH
            - tag: FreeIPA
              value: RAW
          triggers:
            - uuid: 8b1c396947af40c0b85fada487d90784
              expression: 'nodata(/FreeIPA Client/ssh.run,{$IPA.SSH.NODATA.WINDOW})=1 and count(/FreeIPA Client/ssh.run,#1)=1'
              name: 'SSH login failed'
              priority: HIGH
              manual_close: 'YES'
            - uuid: 4034a87414874e2eb52b2ca664a35b7b
              expression: 'last(/FreeIPA Client/ssh.run)=2'
              name: 'SSH login ok but ~/.ZABBIX is missing'
              priority: WARNING
              manual_close: 'YES'
        - uuid: 568d0e7063eb4a55bda38a10608faccc
          name: 'Kerberos: keytab file exists'
          description: |
            Checks if /etc/krb5.keytab exists on the client.
            Expected value: 1 = exists, 0 = missing.
          key: 'vfs.file.exists[/etc/krb5.keytab]'
          delay: 10m
          history: 7d
          value_type: UNSIGNED
          valuemap:
            name: 'Kerberos keytab file'
          tags:
            - tag: FreeIPA
              value: Client
            - tag: FreeIPA
              value: Kerberos
          triggers:
            - uuid: 523cae4e8e5a41dd8612d76efd304eed
              expression: 'last(/FreeIPA Client/vfs.file.exists[/etc/krb5.keytab])=0'
              name: 'Kerberos keytab file is missing'
              priority: HIGH
              manual_close: 'YES'
        - uuid: 7e3d72d782b54b15a0b5465bbfab10c9
          name: 'DNS resolver: resolv.conf raw'
          description: |
            Reads /etc/resolv.conf on the client.
            Expected value: full file content; empty means file missing or unreadable.
          key: 'vfs.file.contents[/etc/resolv.conf]'
          delay: 10m
          history: '0'
          trends: '0'
          value_type: TEXT
          tags:
            - tag: FreeIPA
              value: Client
            - tag: FreeIPA
              value: DNS
            - tag: FreeIPA
              value: RAW
        - uuid: 42cedbaaf5ba4136b82ed73ecba22077
          name: 'DNS resolver: servers'
          description: |
            Parses nameserver entries from /etc/resolv.conf.
            Expected value: space-separated list of DNS servers; empty means none found.
          type: DEPENDENT
          key: ipa.dns.resolv.servers
          delay: '0'
          history: 7d
          trends: '0'
          value_type: TEXT
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var servers = [];
                  var lines = value.split('\n');
                  for (var i = 0; i < lines.length; i++) {
                    var line = lines[i].replace(/#.*/, '').trim();
                    if (!line) continue;
                    var parts = line.split(/\s+/);
                    if (parts[0] === 'nameserver' && parts[1]) {
                      servers.push(parts[1]);
                    }
                  }
                  return servers.join(' ');
          master_item:
            key: 'vfs.file.contents[/etc/resolv.conf]'
          tags:
            - tag: FreeIPA
              value: Client
            - tag: FreeIPA
              value: DNS
          triggers:
            - uuid: f8fc37fcc6c14ae29acef6b746861bc1
              expression: 'find(/FreeIPA Client/ipa.dns.resolv.servers,,"regexp","{$IPA.DNS.SERVERS.MATCH}")=0 or find(/FreeIPA Client/ipa.dns.resolv.servers.invalid,,"regexp",".+")=1'
              name: 'DNS resolver servers do not match expected IPA servers'
              priority: HIGH
              manual_close: 'YES'
        - uuid: ed50ab04d5114497a655d2a084100844
          name: 'DNS resolver: unexpected servers'
          description: |
            Lists nameserver entries that do not match {$IPA.DNS.SERVERS.MATCH}.
            Expected value: empty when only IPA DNS servers are configured; otherwise list of unexpected servers.
          type: DEPENDENT
          key: ipa.dns.resolv.servers.invalid
          delay: '0'
          history: 7d
          trends: '0'
          value_type: TEXT
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var match = "{$IPA.DNS.SERVERS.MATCH}";
                  var re = new RegExp("^(?:" + match + ")$", "i");
                  var servers = [];
                  var lines = value.split('\n');
                  for (var i = 0; i < lines.length; i++) {
                    var line = lines[i].replace(/#.*/, '').trim();
                    if (!line) continue;
                    var parts = line.split(/\s+/);
                    if (parts[0] !== 'nameserver' || !parts[1]) continue;
                    if (!re.test(parts[1])) servers.push(parts[1]);
                  }
                  return servers.join(' ');
          master_item:
            key: 'vfs.file.contents[/etc/resolv.conf]'
          tags:
            - tag: FreeIPA
              value: Client
            - tag: FreeIPA
              value: DNS
        - uuid: 3da53114f25347dbac4d371649925950
          name: 'DNS resolver: search domains'
          description: |
            Parses search/domain entries from /etc/resolv.conf.
            Expected value: space-separated list of search domains; empty means none configured.
          type: DEPENDENT
          key: ipa.dns.resolv.search
          delay: '0'
          history: 7d
          trends: '0'
          value_type: TEXT
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var domains = [];
                  var lines = value.split('\n');
                  for (var i = 0; i < lines.length; i++) {
                    var line = lines[i].replace(/#.*/, '').trim();
                    if (!line) continue;
                    var parts = line.split(/\s+/);
                    if (parts[0] === 'search' && parts.length > 1) {
                      domains = domains.concat(parts.slice(1));
                    } else if (parts[0] === 'domain' && parts[1]) {
                      domains.push(parts[1]);
                    }
                  }
                  return domains.join(' ');
          master_item:
            key: 'vfs.file.contents[/etc/resolv.conf]'
          tags:
            - tag: FreeIPA
              value: Client
            - tag: FreeIPA
              value: DNS
          triggers:
            - uuid: 3aff5e68d92a4a04b7d2e33f913c6f68
              expression: 'find(/FreeIPA Client/ipa.dns.resolv.search,,"regexp","{$IPA.DNS.SEARCH.MATCH}")=0'
              name: 'DNS search domain does not match expected value'
              priority: WARNING
              manual_close: 'YES'
        - uuid: 2e34875c2f884c71ae8cdec759d094db
          name: 'DNS query: response time'
          description: |
            Performs DNS query for {$IPA.DNS.TEST.NAME} type A using the local resolver.
            Expected value: response time in seconds; 0 means query failed or DNS down.
          key: 'net.dns.perf[,{$IPA.DNS.TEST.NAME},A]'
          delay: 1m
          history: 90d
          value_type: FLOAT
          units: s
          tags:
            - tag: FreeIPA
              value: Client
            - tag: FreeIPA
              value: DNS
          triggers:
            - uuid: 30f3724e9cd04ebea2f0aef67079c709
              expression: 'last(/FreeIPA Client/net.dns.perf[,{$IPA.DNS.TEST.NAME},A])=0'
              name: 'DNS query failed'
              priority: HIGH
              manual_close: 'YES'
            - uuid: 446f217afaca4921869ebca96d0c16fa
              expression: 'avg(/FreeIPA Client/net.dns.perf[,{$IPA.DNS.TEST.NAME},A],5m)>{$IPA.DNS.RESP.TIME.CRIT}'
              name: 'DNS response time is high (critical)'
              priority: HIGH
              manual_close: 'YES'
            - uuid: e8cd136d162b4bddb269480e1e7a7a47
              expression: 'avg(/FreeIPA Client/net.dns.perf[,{$IPA.DNS.TEST.NAME},A],5m)>{$IPA.DNS.RESP.TIME.WARN} and avg(/FreeIPA Client/net.dns.perf[,{$IPA.DNS.TEST.NAME},A],5m)<={$IPA.DNS.RESP.TIME.CRIT}'
              name: 'DNS response time is high (warning)'
              priority: WARNING
              manual_close: 'YES'
        - uuid: fa76cb44ea7c4851801521c8dc1e3e95
          name: 'DNS query: A record'
          description: |
            Queries A record for {$IPA.DNS.TEST.NAME} using the local resolver.
            Expected value: DNS response with A records; empty means no record or resolver error.
          key: 'net.dns.record[,{$IPA.DNS.TEST.NAME},A]'
          delay: 5m
          history: 7d
          trends: '0'
          value_type: TEXT
          tags:
            - tag: FreeIPA
              value: Client
            - tag: FreeIPA
              value: DNS
            - tag: FreeIPA
              value: RAW
        - uuid: dcb0c9a0a50344b09adba71495878f4d
          name: 'DNS query: A record normalized (local resolver)'
          description: |
            Normalized list of A record IPs for {$IPA.DNS.TEST.NAME} from the local resolver.
            Expected value: space-separated list of IPs; empty means no A records found.
          type: DEPENDENT
          key: ipa.dns.test.a.normalized.local
          delay: '0'
          history: 7d
          trends: '0'
          value_type: TEXT
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var ips = value.match(/\\b\\d{1,3}(?:\\.\\d{1,3}){3}\\b/g);
                  if (!ips) return '';
                  var seen = {};
                  var out = [];
                  for (var i = 0; i < ips.length; i++) {
                    if (seen[ips[i]]) continue;
                    seen[ips[i]] = true;
                    out.push(ips[i]);
                  }
                  out.sort();
                  return out.join(' ');
          master_item:
            key: 'net.dns.record[,{$IPA.DNS.TEST.NAME},A]'
          tags:
            - tag: FreeIPA
              value: Client
            - tag: FreeIPA
              value: DNS
        - uuid: 0655346c33364fa6ae66edcd57336252
          name: 'DNS SRV _kerberos: record'
          description: |
            Performs SRV lookup for _kerberos._tcp.{$IPA.DNS.SRV.DOMAIN} using the local resolver.
            Expected value: DNS response string containing 'SRV'; empty or missing 'SRV' means record not found.
          key: 'net.dns.record[,_kerberos._tcp.{$IPA.DNS.SRV.DOMAIN},SRV]'
          delay: 5m
          history: 7d
          trends: '0'
          value_type: TEXT
          tags:
            - tag: FreeIPA
              value: Client
            - tag: FreeIPA
              value: DNS
            - tag: FreeIPA
              value: SRV
            - tag: FreeIPA
              value: RAW
          triggers:
            - uuid: d9c0d66cd47c4cb8b650908ab0f775fa
              expression: 'count(/FreeIPA Client/net.dns.record[,_kerberos._tcp.{$IPA.DNS.SRV.DOMAIN},SRV],#1)=1 and (find(/FreeIPA Client/net.dns.record[,_kerberos._tcp.{$IPA.DNS.SRV.DOMAIN},SRV],,"regexp","\\sSRV\\s")=0 or nodata(/FreeIPA Client/net.dns.record[,_kerberos._tcp.{$IPA.DNS.SRV.DOMAIN},SRV],{$IPA.DNS.NODATA.WINDOW})=1)'
              name: 'DNS SRV _kerberos record not found'
              priority: HIGH
              manual_close: 'YES'
        - uuid: cc9f2c74a26144cbb66e6b758a86be80
          name: 'DNS SRV _kerberos: normalized targets (local resolver)'
          description: |
            Normalized list of SRV targets from the local resolver, used for cross-resolver comparison.
            Expected value: space-separated list of "target:port" pairs; empty means no SRV targets.
          type: DEPENDENT
          key: ipa.dns.srv.kerberos.normalized.local
          delay: '0'
          history: 7d
          value_type: TEXT
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var out = [];
                  var lines = value.split('\\n');
                  for (var i = 0; i < lines.length; i++) {
                    var line = lines[i].trim();
                    if (!line) continue;
                    var parts = line.split(/\\s+/);
                    var idx = parts.indexOf('SRV');
                    if (idx === -1 || parts.length < idx + 5) continue;
                    var port = parts[idx + 3];
                    var target = parts[idx + 4];
                    if (!target) continue;
                    target = target.replace(/\\.$/, '');
                    out.push(target + ':' + port);
                  }
                  out.sort();
                  return out.join(' ');
          master_item:
            key: 'net.dns.record[,_kerberos._tcp.{$IPA.DNS.SRV.DOMAIN},SRV]'
          tags:
            - tag: FreeIPA
              value: Client
            - tag: FreeIPA
              value: DNS
            - tag: FreeIPA
              value: SRV
        - uuid: 3d85b45afe1a450a98d5d19b217ce469
          name: 'DNS SRV _ldap: record'
          description: |
            Performs SRV lookup for _ldap._tcp.{$IPA.DNS.SRV.DOMAIN} using the local resolver.
            Expected value: DNS response string containing 'SRV'; empty or missing 'SRV' means record not found.
          key: 'net.dns.record[,_ldap._tcp.{$IPA.DNS.SRV.DOMAIN},SRV]'
          delay: 5m
          history: 7d
          trends: '0'
          value_type: TEXT
          tags:
            - tag: FreeIPA
              value: Client
            - tag: FreeIPA
              value: DNS
            - tag: FreeIPA
              value: SRV
            - tag: FreeIPA
              value: RAW
          triggers:
            - uuid: fe14f926316c483a9c8760c64a05b117
              expression: 'count(/FreeIPA Client/net.dns.record[,_ldap._tcp.{$IPA.DNS.SRV.DOMAIN},SRV],#1)=1 and (find(/FreeIPA Client/net.dns.record[,_ldap._tcp.{$IPA.DNS.SRV.DOMAIN},SRV],,"regexp","\\sSRV\\s")=0 or nodata(/FreeIPA Client/net.dns.record[,_ldap._tcp.{$IPA.DNS.SRV.DOMAIN},SRV],{$IPA.DNS.NODATA.WINDOW})=1)'
              name: 'DNS SRV _ldap record not found'
              priority: HIGH
              manual_close: 'YES'
        - uuid: 3b04f3403d444e38a5e60d3c10f1d6dd
          name: 'DNS SRV _ldap: normalized targets (local resolver)'
          description: |
            Normalized list of SRV targets from the local resolver, used for cross-resolver comparison.
            Expected value: space-separated list of "target:port" pairs; empty means no SRV targets.
          type: DEPENDENT
          key: ipa.dns.srv.ldap.normalized.local
          delay: '0'
          history: 7d
          value_type: TEXT
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var out = [];
                  var lines = value.split('\n');
                  for (var i = 0; i < lines.length; i++) {
                    var line = lines[i].trim();
                    if (!line) continue;
                    var parts = line.split(/\s+/);
                    var idx = parts.indexOf('SRV');
                    if (idx === -1 || parts.length < idx + 5) continue;
                    var port = parts[idx + 3];
                    var target = parts[idx + 4];
                    if (!target) continue;
                    target = target.replace(/\.$/, '');
                    out.push(target + ':' + port);
                  }
                  out.sort();
                  return out.join(' ');
          master_item:
            key: 'net.dns.record[,_ldap._tcp.{$IPA.DNS.SRV.DOMAIN},SRV]'
          tags:
            - tag: FreeIPA
              value: Client
            - tag: FreeIPA
              value: DNS
            - tag: FreeIPA
              value: SRV
        - uuid: 4a04283670f4402796649944b6fd44c6
          name: 'SSSD service: raw'
          description: |
            Raw systemd.unit.get output for sssd.service.
            SSSD provides identity and authentication for IPA clients.
            Expected value: JSON with ActiveState/SubState/LoadState; empty means systemd query failed.
          key: 'systemd.unit.get[sssd.service]'
          delay: 1m
          history: '0'
          trends: '0'
          value_type: TEXT
          tags:
            - tag: FreeIPA
              value: Client
            - tag: FreeIPA
              value: SSSD
            - tag: FreeIPA
              value: RAW
        - uuid: bb81c7b2d9024c428d823511ffdcca27
          name: 'SSSD service: ActiveState'
          description: |
            Extracted ActiveState from systemd JSON for sssd.service.
            Expected value: "active" when healthy; other values include "inactive", "failed", "activating".
          type: DEPENDENT
          key: ipa.sssd.service.active
          delay: '0'
          history: 7d
          value_type: CHAR
          trends: '0'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data;
                  try { data = JSON.parse(value); } catch (e) { return ''; }
                  var state = data.ActiveState;
                  if (state && typeof state === 'object') {
                    return state.text || state.value || '';
                  }
                  return state || '';
          master_item:
            key: 'systemd.unit.get[sssd.service]'
          tags:
            - tag: FreeIPA
              value: Client
            - tag: FreeIPA
              value: SSSD
        - uuid: 523b81cadfeb4a9eb35224c5373ca4e1
          name: 'SSSD service: SubState'
          description: |
            Extracted SubState from systemd JSON for sssd.service.
            Expected value: "running" when healthy; other values include "dead", "failed", "start".
          type: DEPENDENT
          key: ipa.sssd.service.sub
          delay: '0'
          history: 7d
          value_type: CHAR
          trends: '0'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data;
                  try { data = JSON.parse(value); } catch (e) { return ''; }
                  var state = data.SubState;
                  if (state && typeof state === 'object') {
                    return state.text || state.value || '';
                  }
                  return state || '';
          master_item:
            key: 'systemd.unit.get[sssd.service]'
          tags:
            - tag: FreeIPA
              value: Client
            - tag: FreeIPA
              value: SSSD
        - uuid: cd40ea8338824d41ae0d1d62ada3c4a7
          name: 'SSSD service: running'
          description: |
            Derived boolean: ActiveState=active AND SubState=running.
            Expected value: 1 = running, 0 = not running.
          type: DEPENDENT
          key: ipa.sssd.service.running
          delay: '0'
          history: 90d
          value_type: UNSIGNED
          valuemap:
            name: 'Service running state'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data;
                  try { data = JSON.parse(value); } catch (e) { return 0; }
                  var activeState = data.ActiveState;
                  var subState = data.SubState;
                  if (activeState && typeof activeState === 'object') {
                    activeState = activeState.text || activeState.value || '';
                  }
                  if (subState && typeof subState === 'object') {
                    subState = subState.text || subState.value || '';
                  }
                  var active = activeState === 'active';
                  var running = subState === 'running';
                  return (active && running) ? 1 : 0;
          master_item:
            key: 'systemd.unit.get[sssd.service]'
          tags:
            - tag: FreeIPA
              value: Client
            - tag: FreeIPA
              value: SSSD
          triggers:
            - uuid: b934a5fed4534e4aabd9619510d048f6
              expression: 'last(/FreeIPA Client/ipa.sssd.service.running)=0'
              name: 'SSSD service is not running'
              priority: HIGH
              manual_close: 'YES'
        - uuid: 9b285718451540a59f6c3e4be234d61d
          name: 'Chronyd service: raw'
          description: |
            Raw systemd.unit.get output for chronyd.service.
            Chronyd provides NTP time synchronization on the client.
            Expected value: JSON with LoadState/ActiveState/SubState; empty means unit not found or query failed.
          key: 'systemd.unit.get[chronyd.service]'
          delay: 1m
          history: '0'
          trends: '0'
          value_type: TEXT
          tags:
            - tag: FreeIPA
              value: Client
            - tag: FreeIPA
              value: TIME
            - tag: FreeIPA
              value: RAW
        - uuid: f09f83aba2ab456ba2fa7ee831029c59
          name: 'Chronyd service: loaded'
          description: |
            Derived boolean from LoadState of chronyd.service.
            Expected value: 1 = loaded, 0 = not loaded (service missing or masked).
          type: DEPENDENT
          key: ipa.time.chronyd.loaded
          delay: '0'
          history: 7d
          value_type: UNSIGNED
          valuemap:
            name: 'Service loaded state'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data;
                  try { data = JSON.parse(value); } catch (e) { return 0; }
                  var state = data.LoadState;
                  if (state && typeof state === 'object') {
                    state = state.text || state.value || '';
                  }
                  return (state === 'loaded') ? 1 : 0;
          master_item:
            key: 'systemd.unit.get[chronyd.service]'
          tags:
            - tag: FreeIPA
              value: Client
            - tag: FreeIPA
              value: TIME
        - uuid: e381dd4dfcd7432bbae3a3b52631cf3c
          name: 'Chronyd service: running'
          description: |
            Derived boolean: ActiveState=active AND SubState=running for chronyd.service.
            Expected value: 1 = running, 0 = not running.
          type: DEPENDENT
