            - uuid: a5a826ee15094a0194b50fcfd62a08ab
              name: 'Package {#PKG.NAME}: install time'
              description: |
                Extracts install time for {#PKG.NAME} from system.sw.packages.get.
                Expected value: installtime.value (epoch or manager-specific format); empty means value not available.
              type: DEPENDENT
              key: 'ipa.package.install.time[{#PKG.NAME}]'
              delay: '0'
              discover: NO_DISCOVER
              history: 90d
