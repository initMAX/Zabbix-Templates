                - ''
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: device.services
          tags:
            - tag: Service
              value: Email2SMS
        - uuid: fcd874010d1d4431a9d790cbe40affdb
          name: 'Service: Email2SMS Poller'
          type: DEPENDENT
          key: service.email2sms_poller.enabled
          delay: '0'
          history: 7d
          valuemap:
