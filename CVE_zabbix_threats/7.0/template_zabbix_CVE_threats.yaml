zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 612cd71d525444e8a35d3ec35f6272ee
      name: Templates/initMAX
  templates:
    - uuid: b0342ac833624016a4dbb0803bc3ff7d
      template: 'Zabbix CVE threats'
      name: 'Zabbix CVE threats'
      vendor:
        name: initMAX s.r.o.
        version: 7.0-3
      description: |
        This template evaluates Zabbix CVEs for the effective version.
        By default it uses the actual server version from zabbix["version"].
        If macro {$ZBX.CVE.VERSION} is set, it overrides the detected version.
        CVE data are loaded from {$ZBX.CVE.URL} and used for LLD items/triggers with detailed descriptions and tags.
        
        More of our templates can be found on
        https://git.initmax.cz/initMAX-Public/zabbix-templates

        Developed by initMAX s.r.o.
        https://www.initmax.com
      groups:
        - name: Templates/initMAX
      items:
        - uuid: 99e8cecec2144197b00f70cfb048bfa4
          name: 'CVE Count'
          type: DEPENDENT
          key: cve.count
          valuemap:
            name: 'CVE count'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return JSON.parse(value).length;'
          master_item:
            key: 'cve.zabbix.data'
        - uuid: d9e23c41ccf7412282447567d4da6eaf
          name: 'Zabbix version (actual)'
          type: INTERNAL
          key: 'zabbix["version"]'
          delay: 1h
          value_type: TEXT
        - uuid: f043fb628d194f22ada9a39f3a4559bf
          name: 'Zabbix version (effective)'
          type: DEPENDENT
          key: cve.version.effective
          history: 90d
          value_type: TEXT
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  function normalizeMacroValue(raw) {
                      if (raw === null || raw === undefined) {
                          return '';
                      }
                  
                      var s = String(raw).trim();
                      if (!s) {
                          return '';
                      }
                  
                      if (s.indexOf('{$') === 0 && s.lastIndexOf('}') === s.length - 1) {
                          return '';
                      }
                  
                      return s;
                  }
                  
                  var actual = String(value || '').trim();
                  var override = normalizeMacroValue('{$ZBX.CVE.VERSION}');
                  
                  return override || actual;
          master_item:
            key: 'zabbix["version"]'
        - uuid: 966c14a6b01e44c991c6d801498a5ac9
          name: 'Zabbix Version Status'
          type: DEPENDENT
          key: zabbix.version.status
          history: 90d
          valuemap:
            name: 'Version Status'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.Status
          master_item:
            key: 'zbx.zabbix[version]'
          tags:
            - tag: component
              value: versions
          triggers:
            - uuid: df567e038af048ccbe943c61c33b3ea4
              expression: 'last(/Zabbix CVE threats/zabbix.version.status)=1'
              name: 'Zabbix server version is Outdated'
              priority: AVERAGE
              manual_close: 'YES'
              dependencies:
                - name: 'Zabbix server version {ITEM.LASTVALUE2} is Unsupported'
                  expression: 'last(/Zabbix CVE threats/zabbix.version.status)=2 and last(/Zabbix CVE threats/cve.version.effective)<>""'
            - uuid: 7ccc9d9e7aea4465978bad27cbc18102
              expression: 'last(/Zabbix CVE threats/zabbix.version.status)=2 and last(/Zabbix CVE threats/cve.version.effective)<>""'
              name: 'Zabbix server version {ITEM.LASTVALUE2} is Unsupported'
              priority: HIGH
              manual_close: 'YES'
        - uuid: 0954cc23a8f54594a821f45ca6de4138
          name: 'CVE data'
          type: DEPENDENT
          key: cve.zabbix.data
          history: '0'
          value_type: TEXT
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  function normalizeVersionString(raw) {
                      if (!raw) {
                          return null;
                      }
                  
                      var s = String(raw).trim();
                      if (!s) {
                          return null;
                      }
                  
                      s = s.replace(/\u2013|\u2014/g, '-');
                  
                      var match = s.match(/(\d+\.\d+\.\*|\d+\.\d+\*|\d+\.\d+\.\d+[a-zA-Z]*\d*|\d+\.\d+[a-zA-Z]*\d*)/);
                      if (!match) {
                          return null;
                      }
                  
                      var v = match[1];
                      var parts = v.split('.');
                      if (parts.length === 2) {
                          var minorPart = parts[1];
                          var minorMatch = minorPart.match(/^(\d+)([a-zA-Z].*)?$/);
                          if (minorMatch) {
                              v = parts[0] + '.' + minorMatch[1] + '.0' + (minorMatch[2] || '');
                          }
                      }
                  
                      return v;
                  }
                  
                  function normalizeMacroValue(raw) {
                      if (raw === null || raw === undefined) {
                          return '';
                      }
                  
                      var s = String(raw).trim();
                      if (!s) {
                          return '';
                      }
                  
                      if (s.indexOf('{$') === 0 && s.lastIndexOf('}') === s.length - 1) {
                          return '';
                      }
                  
                      return s;
                  }
                  
                  function joinList(value) {
                      if (value === null || value === undefined) {
                          return '';
                      }
                  
                      if (Array.isArray(value)) {
                          var out = [];
                          for (var i = 0; i < value.length; i++) {
                              var entry = value[i];
                              if (entry === null || entry === undefined) {
                                  continue;
                              }
                              if (typeof entry === 'string') {
                                  out.push(entry);
                                  continue;
                              }
                              if (typeof entry === 'object') {
                                  var keys = Object.keys(entry);
                                  if (keys.length === 1) {
                                      out.push(String(entry[keys[0]]));
                                      continue;
                                  }
                              }
                              out.push(String(entry));
                          }
                          return out.join(', ');
                      }
                  
                      return String(value);
                  }
                  
                  function listFromObjects(value, key) {
                      if (!Array.isArray(value)) {
                          return '';
                      }
                  
                      var out = [];
                      for (var i = 0; i < value.length; i++) {
                          var entry = value[i];
                          if (entry === null || entry === undefined) {
                              continue;
                          }
                          if (typeof entry === 'object' && entry[key]) {
                              out.push(String(entry[key]));
                          } else if (typeof entry === 'string') {
                              out.push(entry);
                          } else {
                              out.push(String(entry));
                          }
                      }
                      return out.join(', ');
                  }
                  
                  function buildVersionPairs(versions) {
                      var pairs = [];
                      if (!versions) {
                          return pairs;
                      }
                  
                      for (var i = 0; i < versions.length; i++) {
                          var entry = versions[i];
                          var affectedRaw = entry.version_affected;
                          var fixedRaw = entry.version_fixed;
                  
                          var affected = null;
                          var fixed = null;
                          var rangeEnd = null;
                          var rangeEndRaw = null;
                  
                          if (affectedRaw) {
                              var normalized = String(affectedRaw).replace(/\u2013|\u2014/g, '-');
                              if (normalized.indexOf('-') !== -1) {
                                  var rangeParts = normalized.split('-');
                                  affected = normalizeVersionString(rangeParts[0]);
                                  if (rangeParts.length > 1) {
                                      rangeEndRaw = rangeParts[1];
                                      rangeEnd = normalizeVersionString(rangeParts[1]);
                                  }
                              } else {
                                  affected = normalizeVersionString(normalized);
                              }
                          }
                  
                          fixed = normalizeVersionString(fixedRaw) || rangeEnd;
                          var fixedDisplay = '';
                          if (fixedRaw) {
                              fixedDisplay = String(fixedRaw).trim();
                          } else if (rangeEndRaw) {
                              fixedDisplay = String(rangeEndRaw).trim();
                          } else if (fixed) {
                              fixedDisplay = fixed;
                          }
                  
                          if (!affected && fixed && affectedRaw && /<=|<|all versions/i.test(affectedRaw)) {
                              affected = '0.0.0';
                          }
                  
                          if (!affected || !fixed) {
                              continue;
                          }
                  
                          pairs.push({ affected: affected, fix: fixed, fixDisplay: fixedDisplay });
                      }
                  
                      return pairs;
                  }
                  
                  function compareVersions(v1, v2) {
                      function parseVersion(version) {
                          var parts = version.match(/^(\d+)\.(\d+)\.(\d+)([a-zA-Z]+)?(\d+)?$/);
                          if (!parts) {
                              throw new Error('Invalid version format: ' + version);
                          }
                  
                          var major = parseInt(parts[1], 10);
                          var minor = parseInt(parts[2], 10);
                          var patch = parseInt(parts[3], 10);
                  
                          var suffix = (parts[4] || '').toLowerCase();
                          var suffixNum = parseInt(parts[5] || '0', 10);
                  
                          var suffixOrder = {
                              alpha: 1,
                              alfa: 1,
                              beta: 2,
                              rc: 3,
                              '': 4
                          };
                  
                          return {
                              major: major,
                              minor: minor,
                              patch: patch,
                              suffix: Object.prototype.hasOwnProperty.call(suffixOrder, suffix) ? suffixOrder[suffix] : 0,
                              suffixNum: suffixNum
                          };
                      }
                  
                      var v1Parsed = parseVersion(v1);
                      var v2Parsed = parseVersion(v2);
                  
                      if (v1Parsed.major !== v2Parsed.major) return v1Parsed.major - v2Parsed.major;
                      if (v1Parsed.minor !== v2Parsed.minor) return v1Parsed.minor - v2Parsed.minor;
                      if (v1Parsed.patch !== v2Parsed.patch) return v1Parsed.patch - v2Parsed.patch;
                  
                      if (v1Parsed.suffix !== v2Parsed.suffix) return v1Parsed.suffix - v2Parsed.suffix;
                  
                      return v1Parsed.suffixNum - v2Parsed.suffixNum;
                  }
                  
                  function isVersionInRange(lowerVersion, upperVersion, versionToCheck) {
                      return compareVersions(lowerVersion, versionToCheck) <= 0 && compareVersions(versionToCheck, upperVersion) < 0;
                  }
                  
                  function uniqueList(values) {
                      var seen = {};
                      var out = [];
                      for (var i = 0; i < values.length; i++) {
                          var v = String(values[i] || '').trim();
                          if (!v) {
                              continue;
                          }
                          if (seen[v]) {
                              continue;
                          }
                          seen[v] = true;
                          out.push(v);
                      }
                      return out;
                  }
                  
                  var versionToCheck = normalizeVersionString(value);
                  if (!versionToCheck) {
                      Zabbix.log(3, 'ERROR: Unable to parse Zabbix version from value: ' + value);
                      return JSON.stringify([]);
                  }
                  
                  var cveUrl = normalizeMacroValue('{$ZBX.CVE.URL}');
                  if (!cveUrl) {
                      cveUrl = 'https://assets.zabbix.com/files/zabbix_security_advisories.json';
                  }
                  
                  var cveRequest = new HttpRequest();
                  cveRequest.addHeader('User-Agent: Mozilla/5.0');
                  var jsonContent = cveRequest.get(cveUrl);
                  if (cveRequest.getStatus() != 200) {
                      throw 'Response code: ' + cveRequest.getStatus();
                  }
                  
                  var advisories;
                  try {
                      advisories = JSON.parse(jsonContent);
                  } catch (parseError) {
                      var trimmed = String(jsonContent || '').trim();
                      var match = trimmed.match(/(\[[\s\S]*\]|\{[\s\S]*\})/);
                      if (!match) {
                          throw 'Invalid advisories payload: ' + parseError;
                      }
                      advisories = JSON.parse(match[1]);
                  }
                  if (!Array.isArray(advisories)) {
                      advisories = advisories.advisories || [];
                  }
                  if (!Array.isArray(advisories)) {
                      throw 'Invalid advisories payload format';
                  }
                  
                  var cveMatchList = [];
                  
                  for (var i = 0; i < advisories.length; i++) {
                      var adv = advisories[i];
                      if (adv.product && String(adv.product).toLowerCase() !== 'zabbix') {
                          continue;
                      }
                  
                      var cve = {
                          zbvId: adv.zabbix_id || '',
                          cveId: adv.cve_id || '',
                          cvssScore: adv.cvss_score || '',
                          severity: adv.severity ? (adv.severity.charAt(0).toUpperCase() + adv.severity.slice(1).toLowerCase()) : '',
                          synopsis: adv.synopsis_text || '',
                          description: adv.synopsis_description || '',
                          attackVectors: joinList(adv.synopsis_known_attack_vectors),
                          resolution: adv.synopsis_resolution || '',
                          workarounds: joinList(adv.workarounds),
                          acknowledgements: joinList(adv.synopsis_acknowledgements),
                          published: adv.published || '',
                          updated: adv.updated || '',
                          components: listFromObjects(adv.zabbix_component_list, 'zabbix_component'),
                          tickets: listFromObjects(adv.tickets_list, 'ticket'),
                          fixedVersion: ''
                      };
                  
                      cve.versions = buildVersionPairs(adv.versions_affected_fixed);
                  
                      if (!cve.versions.length) {
                          continue;
                      }
                  
                      var matchedFixes = [];
                      var matched = false;
                      for (var j = 0; j < cve.versions.length; j++) {
                          var lowerVersion = cve.versions[j].affected ? cve.versions[j].affected.replace(/\*/g, '100') : '0.0.0';
                          var upperVersion = cve.versions[j].fix ? cve.versions[j].fix.replace(/\*/g, '100') : '9.9.9';
                          try {
                              if (isVersionInRange(lowerVersion, upperVersion, versionToCheck)) {
                                  Zabbix.log(3, ' CVE Match: ' + cve.cveId);
                                  matched = true;
                                  if (cve.versions[j].fixDisplay) {
                                      matchedFixes.push(cve.versions[j].fixDisplay);
                                  }
                              }
                          } catch (error) {
                              Zabbix.log(3, 'ERROR: ' + error);
                          }
                      }
                      
                      if (!matched) {
                          continue;
                      }
                      if (!cve.severity || cve.severity === '-') {
                          cve.severity = 'Disaster';
                      }
                      cve.fixedVersion = uniqueList(matchedFixes).join(', ');
                      cveMatchList.push(cve);
                  }
                  
                  return JSON.stringify(cveMatchList);
          master_item:
            key: cve.version.effective
        - uuid: dd4156deb56b4c7c9ab357e208ffdf02
          name: 'Curent Version'
          type: DEPENDENT
          key: 'zbx.zabbix[version]'
          history: 90d
          value_type: TEXT
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  try {
                  curentVersion = value;
                  Zabbix.log(4, '[ value ]: ' + value);
                  majorVersion = curentVersion.split('.')[0] + '.' + curentVersion.split('.')[1]; 
                  var webRequest = new HttpRequest(),
                      versions_URL = "https://services.zabbix.com/updates/v1?type=software_update_check";
                  
                  zbx_resp = webRequest.get(versions_URL);
                  if (webRequest.getStatus() != 200) {
                      throw 'Response code: '+ webRequest.getStatus();
                  } else {
                      //Zabbix.log(3, '[ data ]: ' + zbx_resp);
                      versions = JSON.parse(zbx_resp).versions;
                      for (x in versions){
                          //Zabbix.log(3, '[ version ]: ' + versions[x].version);
                          if (versions[x].version == majorVersion){
                              if (curentVersion == versions[x].latest_release.release) {
                                  result = '{"Status":0,"CurentVersion":"' + curentVersion + '","LatestVersion":"' + versions[x].latest_release.release + '","Timestamp":" '+ versions[x].latest_release.created +'"}';
                              } else {
                                  result = '{"Status":1,"CurentVersion":"' + curentVersion + '","LatestVersion":"' + versions[x].latest_release.release + '","Timestamp":" '+ versions[x].latest_release.created +'"}';
                              }
                              break;
                          }
                          result = '{"Status":2,"CurentVersion":"' + curentVersion + '","LatestVersion":"0","Timestamp":"0"}';
                      }
                      return result;
                  }
                  }
                  catch (error) {
                      Zabbix.log(3, '[ version preprod ] ERROR: ' + error);
                      throw 'preprod failed: ' + error;
                  }
          master_item:
            key: cve.version.effective
          tags:
            - tag: component
              value: versions
      discovery_rules:
        - uuid: 2c19c599a346440e94709f84d9c96417
          name: 'CVE Discovery'
          type: DEPENDENT
          key: cve.discovery
          enabled_lifetime_type: DISABLE_NEVER
          lifetime_type: DELETE_AFTER
          lifetime: 1d
          item_prototypes:
            - uuid: b04e8c64a0354124be62c181d07557ce
              name: 'CVE - {#CBVSEVERITY} - {#CBVID}'
              type: DEPENDENT
              key: 'cve[{#CBVID}]'
              value_type: TEXT
              description: |
                CVE: {#CBVID}
                Severity: {#CBVSEVERITY} (CVSS {#CVSSSCORE})
                Fixed version: {#CBVFIXED}
                Published: {#CBVPUBLISHED}
                Updated: {#CBVUPDATED}
                Components: {#CBVCOMPONENTS}
                Tickets: {#CBVTICKETS}
                Zabbix ID: {#ZBVID}
                
                Synopsis: {#CBVSYNOPSIS}
                {#CBVDESCRIPTION}
                
                Attack vectors: {#CBVATTACKVECTORS}
                Resolution: {#CBVRESOLUTION}
                Workarounds: {#CBVWORKAROUNDS}
                Acknowledgements: {#CBVACKNOWLEDGEMENTS}
              tags:
                - tag: CVE
                  value: '{#CBVID}'
                - tag: Severity
                  value: '{#CBVSEVERITY}'
                - tag: CVSS
                  value: '{#CVSSSCORE}'
                - tag: Components
                  value: '{#CBVCOMPONENTS}'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      try {
                          var data = JSON.parse(value);
                          if (!Array.isArray(data)) {
                              return '';
                          }
                          for (var i = 0; i < data.length; i++) {
                              if (String(data[i].cveId) === '{#CBVID}') {
                                  return data[i].severity || '';
                              }
                          }
                          return '';
                      } catch (error) {
                          return '';
                      }
              master_item:
                key: cve.zabbix.data
              trigger_prototypes:
                - uuid: 914a3e9fca684d96b76feafdf860b8f8
                  expression: |
                    last(/Zabbix CVE threats/cve[{#CBVID}])="Critical" or last(/Zabbix CVE threats/cve[{#CBVID}])="High" or
                    last(/Zabbix CVE threats/cve[{#CBVID}])="Medium" or 
                    last(/Zabbix CVE threats/cve[{#CBVID}])="Low"
                  name: '{#CBVSEVERITY} CVE Problem Found - {#CBVID}'
                  priority: DISASTER
                  description: |
                    CVE: {#CBVID}
                    Severity: {#CBVSEVERITY} (CVSS {#CVSSSCORE})
                    Fixed version: {#CBVFIXED}
                    Published: {#CBVPUBLISHED}
                    Updated: {#CBVUPDATED}
                    Components: {#CBVCOMPONENTS}
                    Tickets: {#CBVTICKETS}
                    Zabbix ID: {#ZBVID}
                    
                    Synopsis: {#CBVSYNOPSIS}
                    {#CBVDESCRIPTION}
                    
                    Attack vectors: {#CBVATTACKVECTORS}
                    Resolution: {#CBVRESOLUTION}
                    Workarounds: {#CBVWORKAROUNDS}
                    Acknowledgements: {#CBVACKNOWLEDGEMENTS}
                  manual_close: 'YES'
                  tags:
                    - tag: CBVSEVERITY
                      value: '{#CBVSEVERITY}'
                    - tag: CVSSSCORE
                      value: '{#CVSSSCORE}'
                    - tag: CVE
                      value: '{#CBVID}'
                    - tag: Severity
                      value: '{#CBVSEVERITY}'
                    - tag: CVSS
                      value: '{#CVSSSCORE}'
                    - tag: Components
                      value: '{#CBVCOMPONENTS}'
          master_item:
            key: cve.zabbix.data
          lld_macro_paths:
            - lld_macro: '{#CBVDESCRIPTION}'
              path: $.description
            - lld_macro: '{#CBVSYNOPSIS}'
              path: $.synopsis
            - lld_macro: '{#CBVFIXED}'
              path: $.fixedVersion
            - lld_macro: '{#CBVRESOLUTION}'
              path: $.resolution
            - lld_macro: '{#CBVWORKAROUNDS}'
              path: $.workarounds
            - lld_macro: '{#CBVATTACKVECTORS}'
              path: $.attackVectors
            - lld_macro: '{#CBVACKNOWLEDGEMENTS}'
              path: $.acknowledgements
            - lld_macro: '{#CBVPUBLISHED}'
              path: $.published
            - lld_macro: '{#CBVUPDATED}'
              path: $.updated
            - lld_macro: '{#CBVCOMPONENTS}'
              path: $.components
            - lld_macro: '{#CBVTICKETS}'
              path: $.tickets
            - lld_macro: '{#CBVID}'
              path: $.cveId
            - lld_macro: '{#CBVSEVERITY}'
              path: $.severity
            - lld_macro: '{#CVSSSCORE}'
              path: $.cvssScore
            - lld_macro: '{#ZBVID}'
              path: $.zbvId
          overrides:
            - name: 'High Severity'
              step: '1'
              filter:
                conditions:
                  - macro: '{#CBVSEVERITY}'
                    value: High
              operations:
                - operationobject: TRIGGER_PROTOTYPE
                  operator: LIKE
                  value: 'CVE Problem Found'
                  discover: DISCOVER
                  status: ENABLED
                  severity: HIGH
            - name: 'Medium Severity'
              step: '2'
              filter:
                conditions:
                  - macro: '{#CBVSEVERITY}'
                    value: Medium
              operations:
                - operationobject: TRIGGER_PROTOTYPE
                  operator: LIKE
                  value: 'CVE Problem Found'
                  discover: DISCOVER
                  status: ENABLED
                  severity: AVERAGE
            - name: 'Low Severity'
              step: '3'
              filter:
                conditions:
                  - macro: '{#CBVSEVERITY}'
                    value: Low
              operations:
                - operationobject: TRIGGER_PROTOTYPE
                  operator: LIKE
                  value: 'CVE Problem Found'
                  discover: DISCOVER
                  status: ENABLED
                  severity: WARNING
      macros:
        - macro: '{$ZBX.CVE.URL}'
          value: 'https://assets.zabbix.com/files/zabbix_security_advisories.json'
        - macro: '{$ZBX.CVE.VERSION}'
          value: ''
      valuemaps:
        - uuid: b191eb5fa33c46d486f9a10f76b1d1b7
          name: 'CVE count'
          mappings:
            - value: '0'
              newvalue: OK
            - type: GREATER_OR_EQUAL
              value: '1'
              newvalue: 'Security problem'
        - uuid: a0d711fc0e194b26baee2e4f77288da1
          name: 'Version Status'
          mappings:
            - value: '0'
              newvalue: 'Actual version'
            - value: '1'
              newvalue: 'Outdated version'
            - value: '2'
              newvalue: 'Unsupported version'
