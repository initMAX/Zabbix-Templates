    - uuid: 2d8f3a1536da47b1a401ad6f8cc40ef5
      expression: 'last(/BambuLab by Zabbix agent2 MQTT/bambulab.is_printing)=1 and last(/BambuLab by Zabbix agent2 MQTT/bambulab.bed.target_temperature)>{$BAMBU_BED_TARGET_MIN} and min(/BambuLab by Zabbix agent2 MQTT/bambulab.bed.temperature,{$BAMBU_BED_HEAT_TIME}) < (last(/BambuLab by Zabbix agent2 MQTT/bambulab.bed.target_temperature)-{$BAMBU_BED_DELTA})'
