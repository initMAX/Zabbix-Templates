# Windows Update by Zabbix agent - initMAX s.r.o.
# Allows exactly ONE remote command - the update search this template runs. Everything else under
# system.run stays denied: the agent appends DenyKey=system.run[*] after all configured rules.
AllowKey=system.run["powershell \"(New-Object -ComObject Microsoft.Update.Session).CreateupdateSearcher().Search('IsHidden=0 and IsInstalled=0').Updates|Select-Object Title |ConvertTo-Json\""]
