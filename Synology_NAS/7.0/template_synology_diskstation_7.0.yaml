zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 7df96b18c230490a9a0a9e2307226338
      name: Templates
  templates:
    - uuid: 23c72497b8d646ad90bf7a0740e0c186
      template: 'Synology DiskStation'
      name: 'Synology DiskStation'
      description: |
        More of our templates can be found on https://git.initmax.cz/initMAX-Public/zabbix-templates

        Developed by initMAX s.r.o.
        https://www.initmax.com
      vendor:
        name: initMAX s.r.o.
        version: 7.0-0
      groups:
        - name: Templates
      items:
        - uuid: 7ee0110bfefc449a90f84ba9a9353cb7
          name: 'ICMP ping'
          type: SIMPLE
          key: icmpping
          delay: 1m
          history: 7d
          trends: 365d
          valuemap:
            name: 'Service state'
          tags:
            - tag: App
              value: Status
          triggers:
            - uuid: fb293d349ac6461c83c1438a116c5f16
              expression: 'max(/Synology DiskStation/icmpping,#3)=0'
              name: 'Unavailable by ICMP ping'
              priority: HIGH
              description: |
                Last value: {ITEM.LASTVALUE1}.
                Last three attempts returned timeout.  Please check device connectivity.
        - uuid: b578727b9ac843399a584ec324fc9dc4
          name: 'ICMP loss'
          type: SIMPLE
          key: icmppingloss
          delay: 1m
          history: 7d
          trends: 365d
          value_type: FLOAT
          units: '%'
          tags:
            - tag: App
              value: Status
          triggers:
            - uuid: a5367edf6968433ca72a7c430753b50d
              expression: 'min(/Synology DiskStation/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Synology DiskStation/icmppingloss,5m)<100'
              name: 'High ICMP ping loss'
              priority: WARNING
              dependencies:
                - name: 'Unavailable by ICMP ping'
                  expression: 'max(/Synology DiskStation/icmpping,#3)=0'
        - uuid: 0d5265896a2840a48f7f79e528a135e7
          name: 'ICMP response time'
          type: SIMPLE
          key: icmppingsec
          delay: 1m
          history: 7d
          trends: 365d
          value_type: FLOAT
          units: s
          tags:
            - tag: App
              value: Status
          triggers:
            - uuid: a4ec7cbf1fa0409c9e0135e38cab8e0f
              expression: 'avg(/Synology DiskStation/icmppingsec,5m)>{$ICMP_RESPONSE_TIME_WARN}'
              name: 'High ICMP ping response time'
              priority: WARNING
              dependencies:
                - name: 'High ICMP ping loss'
                  expression: 'min(/Synology DiskStation/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Synology DiskStation/icmppingloss,5m)<100'
                - name: 'Unavailable by ICMP ping'
                  expression: 'max(/Synology DiskStation/icmpping,#3)=0'
        - uuid: fb6bb6e9e3584ffea59c4aa27b8154a0
