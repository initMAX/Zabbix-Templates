        - uuid: 2b39f79a6f6a4b7b9b3e9a7d3a0b2b6d
          name: 'IPA DNS servers discovery'
          description: |
            Discovers DNS servers from /etc/resolv.conf (nameserver lines).
            Expected value: LLD JSON with {#DNS.SERVER} entries.
          type: DEPENDENT
          key: ipa.dns.servers.discovery
          delay: '0'
          lifetime: 30d
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var out = { data: [] };
                  var parts = value.trim().split(/\s+/);
                  for (var i = 0; i < parts.length; i++) {
                    var s = parts[i].trim();
                    if (!s) continue;
                    out.data.push({ "{#DNS.SERVER}": s });
                  }
                  return JSON.stringify(out);
          master_item:
            key: ipa.dns.resolv.servers
          item_prototypes:
            - uuid: 8f4a9f4bb16a4a5a8f4a9f4bb16a4a5a
              name: 'DNS server {#DNS.SERVER}: SRV _ldap record'
              description: |
                SRV lookup for _ldap._tcp.{$IPA.DNS.SRV.DOMAIN} using the specific resolver.
                Expected value: DNS response string containing 'SRV'; empty or missing 'SRV' means record not found.
              key: 'net.dns.record[{#DNS.SERVER},_ldap._tcp.{$IPA.DNS.SRV.DOMAIN},SRV]'
              delay: 5m
              history: 7d
              trends: '0'
              value_type: TEXT
              tags:
                - tag: FreeIPA
                  value: Client
                - tag: FreeIPA
                  value: DNS
                - tag: FreeIPA
                  value: SRV
                - tag: FreeIPA
                  value: RAW
              trigger_prototypes:
                - uuid: b7a2db9b1f3d45b9a4a2d7a02e2f3db1
                  expression: 'count(/FreeIPA Client/net.dns.record[{#DNS.SERVER},_ldap._tcp.{$IPA.DNS.SRV.DOMAIN},SRV],#1)=1 and (find(/FreeIPA Client/net.dns.record[{#DNS.SERVER},_ldap._tcp.{$IPA.DNS.SRV.DOMAIN},SRV],,"regexp","\\sSRV\\s")=0 or nodata(/FreeIPA Client/net.dns.record[{#DNS.SERVER},_ldap._tcp.{$IPA.DNS.SRV.DOMAIN},SRV],{$IPA.DNS.NODATA.WINDOW})=1)'
                  name: 'DNS server {#DNS.SERVER} missing SRV _ldap record'
                  priority: HIGH
                  manual_close: 'YES'
            - uuid: 1b3fcae0a8c54c42b3fcae0a8c54c42b
              name: 'DNS server {#DNS.SERVER}: SRV _ldap response time'
              description: |
                Measures SRV lookup response time on the specific resolver.
                Expected value: response time in seconds; 0 means query failed or DNS down.
              key: 'net.dns.perf[{#DNS.SERVER},_ldap._tcp.{$IPA.DNS.SRV.DOMAIN},SRV]'
              delay: 1m
              history: 7d
              value_type: FLOAT
              units: s
              tags:
                - tag: FreeIPA
                  value: Client
                - tag: FreeIPA
                  value: DNS
                - tag: FreeIPA
                  value: SRV
              trigger_prototypes:
                - uuid: aa9b24616f5a487d88c03c0e0ba22697
                  expression: 'last(/FreeIPA Client/net.dns.perf[{#DNS.SERVER},_ldap._tcp.{$IPA.DNS.SRV.DOMAIN},SRV])=0'
                  name: 'DNS server {#DNS.SERVER} SRV query failed'
                  priority: HIGH
                  manual_close: 'YES'
                - uuid: 916458af6a2749c484ca692d730c69af
                  expression: 'avg(/FreeIPA Client/net.dns.perf[{#DNS.SERVER},_ldap._tcp.{$IPA.DNS.SRV.DOMAIN},SRV],5m)>{$IPA.DNS.RESP.TIME.CRIT}'
                  name: 'DNS server {#DNS.SERVER} SRV response time is high (critical)'
                  priority: HIGH
                  manual_close: 'YES'
                - uuid: e4a87cb351d84cd28edb83a97232d965
                  expression: 'avg(/FreeIPA Client/net.dns.perf[{#DNS.SERVER},_ldap._tcp.{$IPA.DNS.SRV.DOMAIN},SRV],5m)>{$IPA.DNS.RESP.TIME.WARN} and avg(/FreeIPA Client/net.dns.perf[{#DNS.SERVER},_ldap._tcp.{$IPA.DNS.SRV.DOMAIN},SRV],5m)<={$IPA.DNS.RESP.TIME.CRIT}'
                  name: 'DNS server {#DNS.SERVER} SRV response time is high (warning)'
                  priority: WARNING
                  manual_close: 'YES'
            - uuid: 7a27e0bf30d942f1877b89b5b8a83e75
              name: 'DNS server {#DNS.SERVER}: SRV _ldap normalized targets'
              description: |
                Normalized list of SRV targets from the specific resolver.
                Expected value: space-separated list of "target:port" pairs.
              type: DEPENDENT
              key: 'ipa.dns.srv.ldap.normalized[{#DNS.SERVER}]'
              delay: '0'
              history: 7d
              value_type: TEXT
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var out = [];
                      var lines = value.split('\n');
                      for (var i = 0; i < lines.length; i++) {
                        var line = lines[i].trim();
                        if (!line) continue;
                        var parts = line.split(/\s+/);
                        var idx = parts.indexOf('SRV');
                        if (idx === -1 || parts.length < idx + 5) continue;
                        var port = parts[idx + 3];
                        var target = parts[idx + 4];
                        if (!target) continue;
                        target = target.replace(/\.$/, '');
                        out.push(target + ':' + port);
                      }
                      out.sort();
                      return out.join(' ');
              master_item:
                key: 'net.dns.record[{#DNS.SERVER},_ldap._tcp.{$IPA.DNS.SRV.DOMAIN},SRV]'
              tags:
                - tag: FreeIPA
                  value: Client
                - tag: FreeIPA
                  value: DNS
                - tag: FreeIPA
                  value: SRV
              trigger_prototypes:
                - uuid: d23ea162b072489889895ccb02fcb737
