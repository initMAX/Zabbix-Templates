              delay: '0'
              history: 7d
              value_type: FLOAT
              trends: '0'
              units: unixtime
              description: |
                Estimation of when the datastore will be full (UNIX epoch). 0 means never, declining
                usage, or not enough RRD history yet. PBS only returns the estimated-full-date field
                once it has collected enough usage history (roughly a month), so this item reports 0
                until then.
              preprocessing:
                - type: JSONPATH
                  parameters:
