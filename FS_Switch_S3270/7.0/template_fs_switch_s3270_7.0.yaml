zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 612cd71d525444e8a35d3ec35f6272ee
      name: Templates/initMAX
  templates:
    - uuid: e38a8191876742a8a18de83b2c877836
      template: 'FS Switch S3270 SNMP'
      name: 'FS Switch S3270 SNMP'
      description: |
        More of our templates can be found on https://git.initmax.cz/initMAX-Public/zabbix-templates
        
        Developed by initMAX s.r.o.
        https://www.initmax.com
      vendor:
        name: 'initMAX s.r.o.'
        version: 7.0-0
      groups:
        - name: Templates/initMAX
      items:
        - uuid: 28f21967e405457ba35d98e2eb2cdd5a
          name: 'ICMP ping'
          type: SIMPLE
          key: icmpping
          valuemap:
            name: 'Service state'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: 4b79a5674b874a778ad30dc957d5e98d
              expression: 'max(/FS Switch S3270 SNMP/icmpping,#3)=0'
              name: 'FS Switch: Unavailable by ICMP ping'
              priority: HIGH
              tags:
                - tag: scope
                  value: availability
        - uuid: a9f3f5accb3e42fab4d5658c5bface44
          name: 'ICMP loss'
          type: SIMPLE
          key: icmppingloss
          value_type: FLOAT
          units: '%'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: de438e8ff7524c6bbe2179329e3841ef
              expression: 'min(/FS Switch S3270 SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/FS Switch S3270 SNMP/icmppingloss,5m)<100'
              name: 'FS Switch: High ICMP ping loss'
              opdata: 'Loss: {ITEM.LASTVALUE1}'
              priority: WARNING
              dependencies:
                - name: 'FS Switch: Unavailable by ICMP ping'
                  expression: 'max(/FS Switch S3270 SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: 8e2059f5dc5c453d9c87ca6b8152dea5
          name: 'ICMP response time'
          type: SIMPLE
          key: icmppingsec
          value_type: FLOAT
          units: s
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: fa41398f1afa4d89912d52920e2ba0e7
              expression: 'avg(/FS Switch S3270 SNMP/icmppingsec,5m)>{$ICMP_RESPONSE_TIME_WARN}'
              name: 'FS Switch: High ICMP ping response time'
              opdata: 'Value: {ITEM.LASTVALUE1}'
              priority: WARNING
              dependencies:
                - name: 'FS Switch: High ICMP ping loss'
                  expression: 'min(/FS Switch S3270 SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/FS Switch S3270 SNMP/icmppingloss,5m)<100'
                - name: 'FS Switch: Unavailable by ICMP ping'
                  expression: 'max(/FS Switch S3270 SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: 76500f1ff76c4afb98c34eed12a53057
          name: 'FS Switch: SNMP walk network interfaces'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.2.1.2.2.1.8,1.3.6.1.2.1.2.2.1.7,1.3.6.1.2.1.31.1.1.1.18,1.3.6.1.2.1.31.1.1.1.1,1.3.6.1.2.1.2.2.1.2,1.3.6.1.2.1.2.2.1.3,1.3.6.1.2.1.31.1.1.1.6,1.3.6.1.2.1.31.1.1.1.10,1.3.6.1.2.1.2.2.1.14,1.3.6.1.2.1.2.2.1.20,1.3.6.1.2.1.2.2.1.19,1.3.6.1.2.1.2.2.1.13,1.3.6.1.2.1.31.1.1.1.15]'
          key: net.if.walk
          history: '0'
          value_type: TEXT
          trends: '0'
          description: 'SNMP walk of IF-MIB for network interface discovery and monitoring.'
          tags:
            - tag: component
              value: raw
        - uuid: 06532df3762945e8b3d3e8c1fc475d62
          name: 'FS Switch: SNMP walk PSUs'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.52642.1.1.10.2.1.1.41.1.1,1.3.6.1.4.1.52642.1.1.10.2.1.1.41.1.2,1.3.6.1.4.1.52642.1.1.10.2.1.1.41.1.3,1.3.6.1.4.1.52642.1.1.10.2.1.1.41.1.4,1.3.6.1.4.1.52642.1.1.10.2.1.1.41.1.8]'
          key: sensor.psu.walk
          history: '0'
          value_type: TEXT
          trends: '0'
          description: 'Walk FS PSU table at .9.189.5.1.1 (index, description, status, alarm)'
          tags:
            - tag: component
              value: raw
        - uuid: 8da4b9ac94644ca69697de339cf1714e
          name: Temperature
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.52642.1.1.10.2.1.1.16.0]'
          key: sensor.temp.value
          value_type: FLOAT
          units: °C
          description: 'Board temperature in Celsius'
          tags:
            - tag: component
              value: memory
          triggers:
            - uuid: a6d218baa4c540c282f281af49117aed
              expression: 'avg(/FS Switch S3270 SNMP/sensor.temp.value,5m)>{$TEMP.MAX.CRIT}'
              name: 'FS Switch: Temperature critical (>{$TEMP.MAX.CRIT}°C)'
              priority: HIGH
              tags:
                - tag: component
                  value: temperature
                - tag: scope
                  value: availability
            - uuid: d5f5d0b72dc441d2af88405158d11b93
              expression: 'avg(/FS Switch S3270 SNMP/sensor.temp.value,5m)>{$TEMP.MAX.WARN}'
              name: 'FS Switch: Temperature warning (>{$TEMP.MAX.WARN}°C)'
              priority: WARNING
              dependencies:
                - name: 'FS Switch: Temperature critical (>{$TEMP.MAX.CRIT}°C)'
                  expression: 'avg(/FS Switch S3270 SNMP/sensor.temp.value,5m)>{$TEMP.MAX.CRIT}'
              tags:
                - tag: component
                  value: temperature
                - tag: scope
                  value: performance
        - uuid: 4d08693447b64e1eaaf8d64df27a2b23
          name: 'FS Switch: SNMP walk temperature sensors'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.52642.1.1.10.2.1.1.44.1.1,1.3.6.1.4.1.52642.1.1.10.2.1.1.44.1.2,1.3.6.1.4.1.52642.1.1.10.2.1.1.44.1.3,1.3.6.1.4.1.52642.1.1.10.2.1.1.44.1.4,1.3.6.1.4.1.52642.1.1.10.2.1.1.44.1.5]'
          key: sensor.temp.walk
          history: '0'
