              value: system
          triggers:
            - uuid: 21af3c38e8904d95b7c2b26d5d474b59
              expression: 'last(/FS Switch S3270 SNMP/system.sw.version,#1)<>last(/FS Switch S3270 SNMP/system.sw.version,#2) and length(last(/FS Switch S3270 SNMP/system.sw.version))>0'
