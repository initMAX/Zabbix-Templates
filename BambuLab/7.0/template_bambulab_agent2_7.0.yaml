        - uuid: 8c83c345d9964f2d83a75ece20cc1758
          name: 'BambuLab: State'
          type: DEPENDENT
          key: bambulab.state
          delay: '0'
          description: 'Numeric print state from $.print.state (commonly: 4=Running, 5=Paused, 6=Finished, 7=Failed).'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.print.state
              error_handler: DISCARD_VALUE
          master_item:
            key: 'bambulab.get["{$BAMBU_URL}","device/{$BAMBU_SN}/report","{$BAMBU_USER}","{$BAMBU_PASS}"]'
          tags:
            - tag: component
              value: print
          triggers:
            - uuid: fff8cd68b28541de811494488bba5ec6
              expression: 'nodata(/BambuLab by Zabbix agent2 MQTT/bambulab.state,{$BAMBU_NODATA})=1'
              name: 'BambuLab: No data (MQTT status)'
              priority: AVERAGE
              description: 'No data was received from the printer MQTT topic for the configured period.'
              tags:
                - tag: scope
                  value: availability
            - uuid: 6b5b20af6f2c4ab981f2c1680fdb2c73
              expression: 'last(/BambuLab by Zabbix agent2 MQTT/bambulab.state)=5 and min(/BambuLab by Zabbix agent2 MQTT/bambulab.state,{$BAMBU_PAUSE_TIME})=5'
              name: 'BambuLab: Print paused for too long'
              priority: WARNING
              description: 'Print state stayed paused (state=5) longer than the configured pause window.'
              tags:
                - tag: scope
                  value: availability
        - uuid: f38f1b1aa0854bcfa2005bc069a13407
          name: 'BambuLab: State (text)'
          type: DEPENDENT
          key: bambulab.state.text
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: 'Human-readable print state derived from $.print.state.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.print.state
              error_handler: DISCARD_VALUE
            - type: JAVASCRIPT
              parameters:
                - |
                  var n = parseInt(value, 10);
                  if (isNaN(n)) return 'unknown';
                  if (n === 4) return 'Running';
                  if (n === 5) return 'Paused';
                  if (n === 6) return 'Finished';
                  if (n === 7) return 'Failed';
                  return String(n);
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 10m
          master_item:
            key: 'bambulab.get["{$BAMBU_URL}","device/{$BAMBU_SN}/report","{$BAMBU_USER}","{$BAMBU_PASS}"]'
          tags:
            - tag: component
              value: print
        - uuid: 25741d289cff45f2a88c75e19ee7fe64
          name: 'BambuLab: Subtask name'
          type: DEPENDENT
          key: bambulab.subtask_name
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: 'Current job name / profile from $.print.subtask_name.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.print.subtask_name
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 10m
          master_item:
            key: 'bambulab.get["{$BAMBU_URL}","device/{$BAMBU_SN}/report","{$BAMBU_USER}","{$BAMBU_PASS}"]'
          tags:
            - tag: component
              value: print
        - uuid: dfa57bdfde2747c79135332bc82f069e
          name: 'BambuLab: WiFi signal'
          type: DEPENDENT
          key: bambulab.wifi.signal
          delay: '0'
          value_type: FLOAT
          units: dBm
          description: |
            WiFi RSSI signal level in dBm (from $.print.wifi_signal, e.g. "-74dBm").
            
            Rough guidance:
            - -50 to -65 dBm: good
            - -65 to -75 dBm: weak
            - < -75 dBm: poor (may cause disconnects)
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.print.wifi_signal
              error_handler: DISCARD_VALUE
            - type: REGEX
              parameters:
                - '(-?[0-9]+)'
                - \1
          master_item:
            key: 'bambulab.get["{$BAMBU_URL}","device/{$BAMBU_SN}/report","{$BAMBU_USER}","{$BAMBU_PASS}"]'
          tags:
            - tag: component
              value: network
          triggers:
            - uuid: 051bf912f2814a7b99b5717ccb8c99e2
              expression: 'min(/BambuLab by Zabbix agent2 MQTT/bambulab.wifi.signal,{$BAMBU_WIFI_WARN_FOR})<{$BAMBU_WIFI_WARN}'
              name: 'BambuLab: WiFi signal low (< {$BAMBU_WIFI_WARN} dBm)'
              priority: WARNING
              description: 'WiFi signal stayed below the warning threshold for the configured duration.'
              tags:
                - tag: scope
                  value: availability
            - uuid: 2aec22a4ab634db7ba703519122cd0db
              expression: 'min(/BambuLab by Zabbix agent2 MQTT/bambulab.wifi.signal,{$BAMBU_WIFI_CRIT_FOR})<{$BAMBU_WIFI_CRIT}'
              name: 'BambuLab: WiFi signal very low (< {$BAMBU_WIFI_CRIT} dBm)'
              priority: AVERAGE
              description: 'WiFi signal stayed below the critical threshold for the configured duration.'
              tags:
                - tag: scope
                  value: availability
      discovery_rules:
        - uuid: 7710ebfbe64247afbe13599ade2421d7
          name: 'BambuLab: AMS discovery'
          type: DEPENDENT
          key: bambulab.ams.discovery
          delay: '0'
          description: 'Discover AMS units.'
          item_prototypes:
            - uuid: 4ffcbc8376d24c18964955be50380c0d
