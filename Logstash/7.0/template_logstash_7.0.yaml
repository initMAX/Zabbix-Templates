zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 612cd71d525444e8a35d3ec35f6272ee
      name: Templates/initMAX
  templates:
    - uuid: a52d0318944547478607ac597422d642
      template: Logstash
      name: Logstash
      description: |
        More of our templates can be found on https://git.initmax.cz/initMAX-Public/zabbix-templates

        Developed by initMAX s.r.o.
        https://www.initmax.com
      vendor:
        name: 'initMAX s.r.o.'
        version: 7.0-0
      groups:
        - name: Templates/initMAX
      items:
        - uuid: 7e4a9656d1124875a9837645fdb2e7a6
          name: 'Logstash raw data'
          type: HTTP_AGENT
          key: logstash
          history: '0'
          value_type: TEXT
          trends: '0'
          url: 'http://{HOST.CONN}:{$LOGSTASH.PORT}/_node/stats'
          tags:
            - tag: Logstash
            - tag: raw
        - uuid: 3e2d9cadf2394bdd999d0cb1908114e0
          name: Version
          type: DEPENDENT
          key: logstash.version
          delay: '0'
          history: 7d
          value_type: CHAR
          trends: '0'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.version
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: logstash
          tags:
            - tag: Logstash
        - uuid: 29fb1c71281f46e3b6972f89f09f21f3
          name: Status
          type: DEPENDENT
          key: logstash.status
          delay: '0'
          history: 7d
          valuemap:
            name: 'Logstash status'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.status
            - type: JAVASCRIPT
              parameters:
                - |
                  var map = {"green": 0, "yellow": 1, "red": 2};
                  return map[value] !== undefined ? map[value] : 3;
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: logstash
          tags:
            - tag: Logstash
          triggers:
            - uuid: c88a4010e0b44523bed1fb179b4d41c0
              expression: 'last(/Logstash/logstash.status)<>0'
              name: 'Status is not green'
              opdata: 'Status: {ITEM.LASTVALUE}'
              priority: HIGH
        - uuid: bc8124a9e303414dab86b1e17be4c4b9
          name: Uptime
          type: DEPENDENT
          key: logstash.uptime
          delay: '0'
          history: 7d
          units: uptime
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.jvm.uptime_in_millis
            - type: JAVASCRIPT
              parameters:
                - 'return +(value / 1000).toFixed(0);'
          master_item:
            key: logstash
          tags:
            - tag: Logstash
          triggers:
            - uuid: d96a8912206940cf9c9d240dcc765d53
              expression: 'change(/Logstash/logstash.uptime)<0'
              name: 'Logstash has been restarted'
              opdata: 'Uptime: {ITEM.LASTVALUE}'
              priority: INFO
        - uuid: 965ccc1c7ba34dedbf2a42405e215ec3
          name: 'Pipeline workers'
          type: DEPENDENT
          key: logstash.pipeline.workers
          delay: '0'
          history: 7d
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.pipeline.workers
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: logstash
          tags:
