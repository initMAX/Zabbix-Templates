          master_item:
            key: device.version
          tags:
            - tag: Firmware
        - uuid: 8d30899fd3554b729012707f958dd25e
          name: 'Firmware: Update available'
          type: DEPENDENT
          key: device.firmware.update_available
          delay: '0'
          history: 7d
          valuemap:
            name: 'SMSEagle firmware update'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.update_available
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
            - type: BOOL_TO_DECIMAL
              parameters:
                - ''
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: device.version
          tags:
            - tag: Firmware
        # ========== Device support ==========
        - uuid: 39857b776ba9459ba408ca3828ac5800
          name: 'Device support info'
          type: HTTP_AGENT
          key: device.support
          delay: 12h
          history: '0'
          value_type: TEXT
          trends: '0'
          url: '{$SCHEMA.API.SMSEAGLE}://{$HOST.API.SMSEAGLE}/api/v2/device/support'
          headers:
            - name: access-token
              value: '{$TOKEN.API.SMSEAGLE}'
          tags:
            - tag: RAW
        - uuid: 297c7bb3b408445f881480160504e220
          name: 'Support: Expiration date'
          type: DEPENDENT
          key: device.support.date
          delay: '0'
          history: 7d
          value_type: CHAR
          trends: '0'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.date
              error_handler: CUSTOM_VALUE
              error_handler_params: unknown
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: device.support
          tags:
            - tag: Support
        - uuid: 07f3f6244ce24430bd2d6ef2744fbdab
          name: 'Support: Active'
          type: DEPENDENT
          key: device.support.active
          delay: '0'
          history: 7d
          valuemap:
            name: 'SMSEagle support status'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.active
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
            - type: BOOL_TO_DECIMAL
              parameters:
                - ''
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: device.support
          tags:
            - tag: Support
        # ========== HA Failover ==========
        - uuid: c881606dd99f4c7b992da6feccd5f9ed
          name: 'Device HA failover status'
          type: HTTP_AGENT
          key: device.ha_failover
          delay: 5m
          history: '0'
          value_type: TEXT
          trends: '0'
          url: '{$SCHEMA.API.SMSEAGLE}://{$HOST.API.SMSEAGLE}/api/v2/device/ha_failover/status'
          headers:
            - name: access-token
              value: '{$TOKEN.API.SMSEAGLE}'
          tags:
            - tag: RAW
        - uuid: b84eada8b3204acda2e65bc9f7e1149a
          name: 'HA: Failover status'
          type: DEPENDENT
          key: device.ha.status
          delay: '0'
          history: 7d
          valuemap:
            name: 'SMSEagle HA status'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.status
            - type: JAVASCRIPT
              parameters:
                - |
                  var map = {"disabled": 0, "master": 1, "backup": 2, "fault": 3};
                  return map[value] !== undefined ? map[value] : -1;
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: device.ha_failover
          tags:
            - tag: HA
        # ========== Services (Script) ==========
        - uuid: e8918a802d8a41eabc2e9b42d0978876
          name: 'Services full info'
          type: SCRIPT
          key: device.services
          delay: 5m
          history: '0'
          value_type: TEXT
          trends: '0'
          timeout: 30s
          params: |
            var baseUrl = '{$SCHEMA.API.SMSEAGLE}://{$HOST.API.SMSEAGLE}/api/v2/device';
            var token = '{$TOKEN.API.SMSEAGLE}';
            var services = ['mqtt', 'snmp', 'data_conn', 'email2sms', 'email2sms_poller', 'smpp'];
            var result = {};
            for (var i = 0; i < services.length; i++) {
                try {
                    var req = new HttpRequest();
                    req.addHeader('access-token: ' + token);
                    var resp = req.get(baseUrl + '/' + services[i] + '/status');
                    result[services[i]] = JSON.parse(resp);
                } catch (e) {
                    result[services[i]] = {"enabled": null, "error": e.message};
                }
            }
            return JSON.stringify(result);
          tags:
            - tag: RAW
        - uuid: 42c4b994ee0e482ea2770537c57c652b
          name: 'Service: MQTT'
          type: DEPENDENT
          key: service.mqtt.enabled
          delay: '0'
          history: 7d
          valuemap:
            name: 'SMSEagle service status'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.mqtt.enabled
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
            - type: BOOL_TO_DECIMAL
              parameters:
                - ''
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: device.services
          tags:
            - tag: Service
              value: MQTT
        - uuid: afab7e3ee4ba4f558410f311baa8e9b4
          name: 'Service: SNMP'
          type: DEPENDENT
          key: service.snmp.enabled
          delay: '0'
          history: 7d
          valuemap:
            name: 'SMSEagle service status'
          preprocessing:
