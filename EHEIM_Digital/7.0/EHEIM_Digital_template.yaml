      macros:
        - macro: '{$API.HOST}'
          value: 192.168.1.1
          description: 'Local API endpoint (IP or URL). Change if the API runs elsewhere.'
        - macro: '{$API.NO.DATA}'
          value: 15m
          description: 'Time (e.g. 15m) after which missing data will be treated as a problem.'
        - macro: '{$API.NO.DATA.MSTR}'
          value: 5m
          description: 'Time (e.g., 5m) after which nodata is raised for the master item. Should be shorter than LLD.'
        - macro: '{$API.PASS}'
          value: admin
          description: 'Default API password – change it via the /changeauth endpoint (see https://api.eheimdigital.com/docs/eheim_digital_api/changeauth).'
        - macro: '{$API.USER}'
          value: api
          description: 'Username for the EHEIM Digital API.'
        - macro: '{$AQUAALERT.MAX.POLLUTION}'
          value: '90'
          description: 'Max. water pollution level (%). Triggers when pollution exceeds this percentage.'
        - macro: '{$AQUAALERT.SERVICE.SENSOR}'
          value: '5'
          description: 'Min. days until sensor service. Triggers when remaining days drop below this value.'
        - macro: '{$AQUAALERT.SERVICE.WATERCHANGE}'
          value: '5'
          description: 'Min. days until water change. Triggers when remaining days drop below this value.'
        - macro: '{$FILTER.MEASUREMENT}'
          value: litres
          description: 'Expected measurement unit: "litres" or "gallons"'
        - macro: '{$FILTER.MODEL}'
          value: 600T
          description: 'Filter model: "700", "600T", "450", or "350"'
        - macro: '{$FILTER.SERVICE.TIME}'
          value: '30'
          description: 'Remaining filter-service days. Triggers when the calculated “service time” of an EHEIM filter drops below this number of days.'
        - macro: '{$MAX.PH}'
          value: '7'
          description: 'Upper pH limit. Averages above this value are considered out of range.'
        - macro: '{$MAX.TEMP}'
          value: '30'
          description: 'Upper temperature limit (°C). Average water temperature above this value raises an alert.'
        - macro: '{$MIN.FEEDER.FILL}'
          value: '20'
          description: 'Minimum feeder fill (%). Triggers when the autofeeder’s fill level falls below this percentage.'
        - macro: '{$MIN.PH}'
          value: '6.2'
          description: 'Lower pH limit. Averages below this value are considered out of range.'
        - macro: '{$MIN.TEMP}'
          value: '20'
          description: 'Lower temperature limit (°C). Average water temperature below this value raises an alert.'
        - macro: '{$PH.SERVICE.TIME}'
          value: '5'
          description: 'Remaining pH-probe service days. Triggers when the probe’s “service time” drops below this number of days.'
        - macro: '{$TEMP.AVG.TIME}'
          value: 15m
          description: 'Averaging window for temperature (time period used in temperature triggers).'
        - macro: '{$TRIGGER.PH.TIME}'
          value: 4h
          description: 'Averaging window for pH (time period used to check pH range).'
        - macro: '{$UV.SERVICE.TIME}'
          value: '30'
          description: 'Remaining UV-unit service days. Triggers when time until next UV lamp service is below this number of days.'
