          units: Wh
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '100'
      macros:
        - macro: '{$SOLAX.IP}'
          value: 10.1.1.102
      valuemaps:
        - uuid: 09fcb6e3de4d43d58862f2258afb9aa4
          name: SolarChargerUseMode
          mappings:
            - value: '0'
              newvalue: 'Self use mode'
            - value: '1'
              newvalue: ForceTimeUse
            - value: '2'
              newvalue: 'Back Up Mode'
            - value: '3'
              newvalue: 'Feedin Priority'
