          snmp_oid: 'walk[1.3.6.1.4.1.41112.1.6.1.2.1.4,1.3.6.1.4.1.41112.1.6.1.2.1.6,1.3.6.1.4.1.41112.1.6.1.2.1.7,1.3.6.1.4.1.41112.1.6.1.2.1.8,1.3.6.1.4.1.41112.1.6.1.2.1.9,1.3.6.1.4.1.41112.1.6.1.2.1.10,1.3.6.1.4.1.41112.1.6.1.2.1.11,1.3.6.1.4.1.41112.1.6.1.2.1.15,1.3.6.1.4.1.41112.1.6.1.2.1.16,1.3.6.1.4.1.41112.1.6.1.2.1.18,1.3.6.1.4.1.41112.1.6.1.2.1.19,1.3.6.1.4.1.41112.1.6.1.2.1.20,1.3.6.1.4.1.41112.1.6.1.2.1.21,1.3.6.1.4.1.41112.1.6.1.2.1.22,1.3.6.1.4.1.41112.1.6.1.2.1.23]'
          key: unifi.vap.walk
